<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estufas">
<meta name="theme-color" content="#0D1B13">
<title>Bulário</title>
<style>
  :root{
    --bg:#F2F5EF; --ink:#1D2B22; --leaf:#234D35; --leaf-dark:#173425;
    --paper:#FFFFFF; --line:#DCE3D8; --pend:#C68A2E; --feito:#3D7A5C; --danger:#B5432F; --gold:#8A6A2F;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:60px;}
  header{background:var(--leaf-dark); color:#fff; padding:16px 20px 20px; position:sticky; top:0; z-index:5;}
  header a{color:#CFE0D3; text-decoration:none; font-size:13px;}
  header h1{margin:6px 0 0; font-size:20px;}
  main{padding:16px 20px;}
  .search{width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; margin-bottom:12px; background:#fff;}
  .subnav{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .chip{padding:7px 13px; border-radius:20px; font-size:12.5px; background:var(--paper); border:1px solid var(--line); cursor:pointer; color:#54614F;}
  .chip.active{background:var(--leaf); color:#fff; border-color:var(--leaf);}
  .fill-btn{width:100%; padding:11px; border:1px dashed var(--leaf); border-radius:10px; background:transparent; color:var(--leaf); font-size:13px; font-weight:600; margin-bottom:14px; cursor:pointer;}
  .fill-status{font-size:12.5px; color:#54614F; margin:-8px 0 12px; white-space:pre-line;}
  .empty{text-align:center; color:#6C7A67; font-size:14px; margin-top:40px;}
  .prod{background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden;}
  .prod-head{display:flex; justify-content:space-between; align-items:center; padding:13px 14px; cursor:pointer;}
  .prod-head .name{font-weight:600; font-size:15px;}
  .prod-head .cat{font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;}
  .cat.fung{background:#E4EFE6; color:var(--feito);}
  .cat.inset{background:#FBE9D3; color:var(--pend);}
  .prod-body{padding:0 14px 14px; display:none; border-top:1px solid var(--line); padding-top:12px;}
  .prod.open .prod-body{display:block;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11px; color:#54614F; margin-bottom:5px;}
  .field input, .field textarea, .field select{width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .prod-save{width:100%; padding:9px; border:none; border-radius:8px; background:var(--leaf); color:#fff; font-size:13px; font-weight:600;}
  .prod-del{width:100%; padding:9px; border:1px solid var(--danger); border-radius:8px; background:transparent; color:var(--danger); font-size:13px; font-weight:600; margin-top:6px;}
  .fab{
    position:fixed; bottom:22px; right:20px; left:20px; max-width:420px; margin:0 auto;
    background:var(--leaf); color:#fff; border:none; border-radius:14px; padding:16px;
    font-size:16px; font-weight:600; box-shadow:0 4px 14px rgba(23,52,37,.35);
  }
  dialog{border:none; border-radius:16px; width:min(92vw,420px); padding:0;}
  dialog::backdrop{background:rgba(23,52,37,.45);}
  .sheet{padding:20px;}
  .sheet h2{margin:0 0 16px; font-size:18px;}
  .sheet select{width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; font-size:15px; background:#fff;}
  .sheet-actions{display:flex; gap:10px; margin-top:14px;}
  .sheet-actions button{flex:1; padding:12px; border-radius:9px; border:none; font-size:15px; font-weight:600;}
  .btn-cancel{background:#EDEFEA; color:var(--ink);}
  .btn-save{background:var(--leaf); color:#fff;}
</style>
  <link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="theme.css">
</head>
<body data-page="bulario" class="tdark">
<header>
  <a href="index.html">‹ voltar</a>
  <h1>Bulário</h1>
</header>
<main>
  <input class="search" id="bu-search" type="text" placeholder="Buscar produto, praga, doença ou ingrediente...">
  <div class="subnav">
    <div class="chip active" data-c="todos">Todos</div>
    <div class="chip" data-c="Fungicida">Fungicidas</div>
    <div class="chip" data-c="Inseticida/Acaricida">Inseticidas/Acaricidas</div>
  </div>
  <div class="fill-status" id="fillStatus"></div>
  <div id="bu-list"></div>
</main>

<button class="fab" onclick="abrirNovo()">+ Novo produto</button>

<dialog id="dialog">
  <div class="sheet">
    <h2>Novo produto</h2>
    <div class="field"><label>Nome</label><input id="fNome" type="text"></div>
    <div class="field">
      <label>Categoria</label>
      <select id="fCategoria">
        <option value="Fungicida">Fungicida</option>
        <option value="Inseticida/Acaricida">Inseticida/Acaricida</option>
      </select>
    </div>
    <div class="field"><label>Pragas / doenças que controla</label><input id="fAlvos" type="text" placeholder="ex: mosca-branca, oídio"></div>
    <div class="row2">
      <div class="field"><label>FRAC</label><input id="fFrac" type="text" placeholder="ex: M05"></div>
      <div class="field"><label>Culturas</label><input id="fCulturas" type="text" placeholder="ex: Tomate, Pepino"></div>
    </div>
    <div class="field"><label>Foto (link ou arquivo)</label><input id="fFoto" type="text" placeholder="https://..."></div>
    <div class="field"><input id="fFotoFile" type="file" accept="image/*" style="padding:8px">
      <div id="fFotoPrev"></div></div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="document.getElementById('dialog').close()">Cancelar</button>
      <button class="btn-save" onclick="salvarNovo()">Salvar</button>
    </div>
  </div>
</dialog>

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function carregarListaLegado(){
  const raw = localStorage.getItem(BULARIO_KEY);
  return raw ? JSON.parse(raw) : null;
}

async function apiCall(action, extra){
  const r = await fetch(API_URL, {method:'POST', body: JSON.stringify(Object.assign({tipo:'bulario', action}, extra))});
  return r.json();
}

// Preenche os campos vazios de p com a REFERENCIA. Retorna true se mudou algo.
// Nunca apaga o que você já preencheu à mão.
function aplicarRef(p){
  const ref = REFERENCIA[p.nome];
  if(!ref) return false;
  let mudou = false;
  const vazio = v => !String(v||'').trim();
  if(vazio(p.ingredienteAtivo) && ref.ia){ p.ingredienteAtivo = ref.ia; mudou = true; }
  if(vazio(p.classeToxicologica) && ref.tox){ p.classeToxicologica = ref.tox; mudou = true; }
  if(vazio(p.dose) && ref.dose){ p.dose = ref.dose; mudou = true; }
  if(vazio(p.carencia) && ref.car){ p.carencia = ref.car; mudou = true; }
  if(vazio(p.bulaLink) && ref.link){ p.bulaLink = ref.link; mudou = true; }
  if(ref.cat && p.categoria !== ref.cat){ p.categoria = ref.cat; mudou = true; }
  return mudou;
}

async function semear(){
  const legado = carregarListaLegado();
  const base = legado || BULARIO_SEED.map(([nome,categoria]) => ({
    nome, categoria, ingredienteAtivo:'', classeToxicologica:'', dose:'', carencia:'', obs:'', bulaLink:''
  }));
  base.forEach(aplicarRef);
  for(const p of base){
    try{
      await apiCall('add', { data: {
        nome: p.nome, categoria: p.categoria,
        ingredienteAtivo: p.ingredienteAtivo || '', classeToxicologica: p.classeToxicologica || '',
        dose: p.dose || '', carencia: p.carencia || '', obs: p.obs || '', bulaLink: p.bulaLink || ''
      }});
    }catch(e){ /* segue pro próximo mesmo se um falhar */ }
  }
}

let lista = [];
let filtroCat = 'todos';
let busca = '';

async function lerBulario(){
  if (typeof buscarTipo === 'function') return buscarTipo('bulario');
  const ft = (typeof fetchComTimeout === 'function') ? await fetchComTimeout(`${API_URL}?tipo=bulario`) : await fetch(`${API_URL}?tipo=bulario`);
  return ((await ft.json()).data) || [];
}
async function carregar(){
  try {
    if (typeof cacheLerTipo === 'function') {
      const c = cacheLerTipo('bulario');
      if (c && c.length) { lista = c; render(); }
      else document.getElementById('bu-list').innerHTML = '<div class="empty">Carregando…</div>';
    } else document.getElementById('bu-list').innerHTML = '<div class="empty">Carregando…</div>';
  } catch (e) {}
  try{
    let dadosServidor = await lerBulario();
    if(dadosServidor.length === 0){
      await semear();
      dadosServidor = await lerBulario();
    }
    lista = dadosServidor;
    render();
  }catch(e){
    if (lista && lista.length) { render(); return; }
    document.getElementById('bu-list').innerHTML = '<div class="empty">Demorou demais. <a href="#" onclick="carregar();return false">Tentar de novo</a></div>';
  }
}

function render(){
  const wrap = document.getElementById('bu-list');
  let itens = lista.filter(p => {
    if(filtroCat !== 'todos' && p.categoria !== filtroCat) return false;
    if(busca){
      const q = busca.toLowerCase();
      const alvo = ((p.nome||'')+' '+(p.ingredienteAtivo||'')+' '+(p.alvos||'')).toLowerCase();
      if(!alvo.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => a.nome.localeCompare(b.nome));

  if(itens.length === 0){ wrap.innerHTML = '<div class="empty">Nenhum produto encontrado.</div>'; return; }

  wrap.innerHTML = itens.map(p => `
    <div class="prod" id="prod-${p.id}">
      <div class="prod-head" onclick="toggle('${p.id}')">
        ${p.foto
          ? `<div class="ptile" style="width:60px;height:60px;flex-basis:60px;font-size:20px;background:#fff"><img src="${escapeHtml(p.foto)}" alt="" loading="lazy" onerror="this.remove()"></div>`
          : `<div class="ptile" style="width:60px;height:60px;flex-basis:60px;font-size:20px">${escapeHtml(String(p.nome||'?').trim().charAt(0).toUpperCase())}</div>`}
        <span class="name" style="flex:1">${escapeHtml(p.nome)}<br><small class="bu-sub">${p.categoria==='Fungicida'?'Fungicida':'Inseticida/Acaricida'}${p.frac?' • FRAC '+escapeHtml(p.frac):''}</small><br>${(p.culturas||'').split(',').map(s=>s.trim()).filter(Boolean).map(c=>`<span class="cult">${escapeHtml(c)}</span>`).join('')}</span>
        <span class="cat ${p.categoria === 'Fungicida' ? 'fung' : 'inset'}">${p.categoria === 'Fungicida' ? 'Fungicida' : 'Inset./Acaricida'}</span>
      </div>
      <div class="prod-body">
        <div class="field"><label>Nome</label><input id="nm-${p.id}" value="${escapeHtml(p.nome)}"></div>
        <div class="field">
          <label>Categoria</label>
          <select id="cg-${p.id}">
            <option value="Fungicida" ${p.categoria==='Fungicida'?'selected':''}>Fungicida</option>
            <option value="Inseticida/Acaricida" ${p.categoria==='Inseticida/Acaricida'?'selected':''}>Inseticida/Acaricida</option>
          </select>
        </div>
        <div class="field"><label>Ingrediente ativo</label><input id="ia-${p.id}" value="${escapeHtml(p.ingredienteAtivo||'')}"></div>
        <div class="row2">
          <div class="field"><label>Classe toxicológica</label><input id="ct-${p.id}" value="${escapeHtml(p.classeToxicologica||'')}"></div>
          <div class="field"><label>Carência</label><input id="ca-${p.id}" value="${escapeHtml(p.carencia||'')}"></div>
        </div>
        <div class="field"><label>Dose</label><input id="do-${p.id}" value="${escapeHtml(p.dose||'')}" placeholder="ex: 70 g/100L água (tomate)"></div>
        <div class="field"><label>Pragas / doenças que controla</label><input id="al-${p.id}" value="${escapeHtml(p.alvos||'')}" placeholder="ex: mosca-branca, oídio, tripes"></div>
        <div class="row2">
          <div class="field"><label>FRAC / modo de ação</label><input id="fr-${p.id}" value="${escapeHtml(p.frac||'')}" placeholder="ex: M05"></div>
          <div class="field"><label>Culturas (separar por vírgula)</label><input id="cu-${p.id}" value="${escapeHtml(p.culturas||'')}" placeholder="ex: Tomate, Pepino"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Link da bula oficial</label><input id="bl-${p.id}" value="${escapeHtml(p.bulaLink||'')}" placeholder="https://..."></div>
          <div class="field"><label>Foto (link ou arquivo)</label><input id="ft-${p.id}" value="${escapeHtml(p.foto||'')}" placeholder="https://..."></div>
        </div>
        <div class="field"><input id="ftf-${p.id}" type="file" accept="image/*" style="padding:6px" onchange="fotoThumb(this,'ft-${p.id}','ftp-${p.id}')">
          <div id="ftp-${p.id}">${p.foto?`<img src="${escapeHtml(p.foto)}" style="width:46px;height:46px;border-radius:12px;object-fit:cover;margin-top:6px" onerror="this.remove()">`:''}</div></div>
        ${p.bulaLink ? `<div style="margin:-4px 0 10px;"><a href="${escapeHtml(p.bulaLink)}" target="_blank" rel="noopener" style="font-size:12.5px; color:var(--leaf);">Abrir bula ↗</a></div>` : ''}
        <div class="field"><label>Observação</label><textarea id="ob-${p.id}" rows="2">${escapeHtml(p.obs||'')}</textarea></div>
        <button class="prod-save" onclick="salvarProduto('${p.id}')">Salvar produto</button>
        <button class="prod-del" onclick="excluirProduto('${p.id}')">Excluir produto</button>
      </div>
    </div>
  `).join('');
}

function toggle(id){ document.getElementById('prod-' + id).classList.toggle('open'); }

// Foto por arquivo: comprime para miniatura (96px) e preenche o campo (sem link).
function fotoThumb(fileInput, urlInputId, prevId){
  const f = fileInput.files && fileInput.files[0]; if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    const S = 96, cv = document.createElement('canvas');
    cv.width = S; cv.height = S;
    const cx = cv.getContext('2d');
    const sc = Math.max(S/img.width, S/img.height), w = img.width*sc, h = img.height*sc;
    cx.drawImage(img, (S-w)/2, (S-h)/2, w, h);
    const url = cv.toDataURL('image/jpeg', .72);
    document.getElementById(urlInputId).value = url;
    document.getElementById(prevId).innerHTML = '<img src="'+url+'" style="width:46px;height:46px;border-radius:12px;object-fit:cover;margin-top:6px">';
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
}

async function salvarProduto(id){
  const p = lista.find(x => x.id === id);
  if(!p) return;
  const atualizado = {
    nome: document.getElementById('nm-' + id).value.trim() || p.nome,
    categoria: document.getElementById('cg-' + id).value,
    ingredienteAtivo: document.getElementById('ia-' + id).value,
    classeToxicologica: document.getElementById('ct-' + id).value,
    carencia: document.getElementById('ca-' + id).value,
    dose: document.getElementById('do-' + id).value,
    alvos: document.getElementById('al-' + id).value,
    frac: document.getElementById('fr-' + id).value.trim(),
    culturas: document.getElementById('cu-' + id).value.trim(),
    bulaLink: document.getElementById('bl-' + id).value,
    foto: document.getElementById('ft-' + id).value.trim(),
    obs: document.getElementById('ob-' + id).value
  };
  Object.assign(p, atualizado);
  render();
  const card = document.getElementById('prod-' + id);
  if(card) card.classList.add('open');
  await apiCall('update', { id, data: atualizado });
}
async function excluirProduto(id){
  if(!confirm('Excluir este produto do bulário?')) return;
  lista = lista.filter(x => x.id !== id);
  render();
  await apiCall('delete', { id });
}

document.querySelectorAll('.subnav .chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.subnav .chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  filtroCat = c.dataset.c;
  render();
}));
document.getElementById('bu-search').addEventListener('input', (e) => {

});

  document.getElementById('fNome').value = '';
  document.getElementById('fCategoria').value = 'Fungicida';
  document.getElementById('fAlvos').value = '';
  document.getElementById('fFrac').value = '';
  document.getElementById('fCulturas').value = '';

}

  fotoThumb(this, 'fFoto', 'fFotoPrev');

async function salvarNovo(){
  const nome = document.getElementById('fNome').value.trim();
  if(!nome){ alert('Digite o nome do produto.'); return; }
  const novo = {
    nome, categoria: document.getElementById('fCategoria').value,
    alvos: document.getElementById('fAlvos').value.trim(),
    frac: document.getElementById('fFrac').value.trim(),
    culturas: document.getElementById('fCulturas').value.trim(),
    foto: document.getElementById('fFoto').value.trim(),
    ingredienteAtivo:'', classeToxicologica:'', dose:'', carencia:'', obs:'', bulaLink:''
  };
  aplicarRef(novo);
  document.getElementById('dialog').close();
  const res = await apiCall('add', { data: novo });
  novo.id = res.id;
  lista.push(novo);
  render();
}

let completando = false;
async function completarPadrao(){
  if(completando) return; // ignora clique duplo
  const nomesExistentes = new Set(lista.map(p => p.nome));
  const faltando = BULARIO_SEED.filter(([nome]) => !nomesExistentes.has(nome));
  if(faltando.length === 0){ alert('Já está tudo lá — nenhum produto padrão faltando.'); return; }
  if(!confirm(`Faltam ${faltando.length} produtos da lista padrão. Adicionar agora?`)) return;
  completando = true;
  try{
    for(const [nome, categoria] of faltando){
      if(lista.some(p => p.nome === nome)) continue; // re-checa (segurança contra duplicar)
      const novo = { nome, categoria, ingredienteAtivo:'', classeToxicologica:'', dose:'', carencia:'', obs:'', bulaLink:'', foto:'', alvos:'' };
      aplicarRef(novo);
      try{
        const res = await apiCall('add', { data: novo });
        novo.id = res.id;
        lista.push(novo);
      }catch(e){ /* segue pro próximo */ }
    }
  }finally{
    completando = false;
  }
  render();
  alert('Pronto! Lista completada.');
}

// Preenche os campos vazios de todos os produtos com os dados oficiais.
// Nunca apaga o que você já preencheu à mão.
async function preencherDados(){
  const st = document.getElementById('fillStatus');
  const alvos = lista.filter(aplicarRef);
  if(!alvos.length){ st.textContent = 'Nada a preencher — todos os produtos já estão completos.'; return; }
  if(!confirm(`Preencher os dados faltantes de ${alvos.length} produtos? (o que você preencheu à mão será mantido)`)) {
    await carregar(); // desfaz o preenchimento local
    return;
  }
  st.textContent = `Preenchendo 0/${alvos.length}…`;
  let ok = 0;
  for(const p of alvos){
    try{
      await apiCall('update', { id: p.id, data: {
        categoria: p.categoria, ingredienteAtivo: p.ingredienteAtivo || '',
        classeToxicologica: p.classeToxicologica || '', dose: p.dose || '',
        carencia: p.carencia || '', bulaLink: p.bulaLink || '', foto: p.foto || '', alvos: p.alvos || ''
      }});
      ok++;
      st.textContent = `Preenchendo ${ok}/${alvos.length}…`;
    }catch(e){ /* segue pro próximo */ }
  }
  st.textContent = `Pronto! ${ok} produtos atualizados. Confira abrindo cada um.`;
  render();
}
