<style>
  :root{--bg:#0D1B13; --bg2:#10241A; --card:#152A1F; --card2:#1A3327;
    --line:#24402F; --ink:#E9F2EA; --mut:#9DB8A4; --dim:#6E8A75;
    --leaf:#3D7A5C; --lime:#8FD19A; --gold:#D9A441; --red:#E0785F; --blue:#5C8FD1;}
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(1200px 500px at 80% -10%, #16301f 0%, #0D1B13 55%) fixed, var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:60px;}
  a{color:var(--lime); text-decoration:none;}
  header{background:linear-gradient(180deg,#123024,#0E2318); padding:16px 20px 14px; position:sticky; top:0; z-index:6; border-bottom:1px solid var(--line);}
  header a{color:var(--lime); font-size:13px;}
  header h1{margin:6px 0 0; font-size:20px; font-weight:800; letter-spacing:-.02em;}
  header p{margin:4px 0 0; font-size:12.5px; color:var(--mut);}

  .filtros{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px;}
  .filtros .grp{display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:5px 8px;}
  .filtros label{font-size:11px; color:var(--mut); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .filtros select{background:var(--bg2); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:7px 9px; font-size:13px; font-family:inherit; color-scheme:dark;}
  .filtros select:focus{outline:none; border-color:var(--leaf);}

  .cats{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .cat{flex:0 0 auto; padding:9px 14px; border-radius:12px; font-size:12.5px; font-weight:700; cursor:pointer;
    background:var(--card); border:1px solid var(--line); color:var(--mut); transition:.18s; white-space:nowrap;}
  .cat:hover{background:var(--card2); color:var(--ink);}
  .cat.active{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff; border-color:transparent;}

  .sec-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .sec-head .resumo{font-size:13px; color:var(--mut);}
  .sec-head .resumo b{color:var(--ink); font-weight:800;}
  .per-toggle{display:flex; gap:5px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px;}
  .per-toggle button{background:transparent; color:var(--mut); border:none; border-radius:9px; padding:7px 13px;
    font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;}
  .per-toggle button.ativo{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff;}
  .per-toggle input[type=month]{background:var(--bg2); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:6px 8px; font-size:12.5px; font-family:inherit; color-scheme:dark;}

  .grid{display:grid; gap:14px;}
  .cols2{grid-template-columns:1fr 1fr;}
  .card{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line);
    border-radius:18px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .card h2{margin:0 0 10px; font-size:14.5px; font-weight:700;}
  .card h2 small{font-weight:600; color:var(--mut); font-size:11.5px; margin-left:6px;}
  canvas{max-height:250px;}
  .rank{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13.5px; gap:10px;}
  .rank:last-child{border:none;} .rank b{color:var(--lime); white-space:nowrap;}
  .rank span{color:var(--mut); overflow:hidden; text-overflow:ellipsis;}
  .rank .pct{color:var(--dim); font-size:11.5px; margin-left:6px; font-weight:600;}
  .empty{color:var(--dim); font-size:13px; text-align:center; padding:18px 0;}
  .loading{color:var(--dim); font-size:13px; text-align:center; padding:40px 0;}
  .nota{font-size:12px; color:var(--dim); margin:8px 0 0;}
  .alerta-linha{border-left:3px solid var(--red); padding-left:10px;}
  .ok-linha{border-left:3px solid var(--lime); padding-left:10px;}

  .tbl-wrap{overflow-x:auto; max-height:360px; overflow-y:auto;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{position:sticky; top:0; background:var(--card2); color:var(--mut); text-align:left; font-size:11px;
    text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--line); z-index:1;}
  td{padding:8px 10px; border-bottom:1px dashed var(--line); color:var(--ink);}

  .badge{font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
  .badge.ok{background:rgba(143,209,154,.14); color:var(--lime);}
  .badge.warn{background:rgba(217,164,65,.15); color:var(--gold);}
  .badge.err{background:rgba(224,120,95,.15); color:#F0907A;}
  .badge.info{background:rgba(92,143,209,.15); color:#8FB8E8;}
  .duas{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .sub-tit{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:18px 0 8px;}

  @media (max-width:860px){
    .cols2,.duas{grid-template-columns:1fr;}
  }
  @media (max-width:600px){
    main{padding:14px 12px;}
    .filtros{flex-direction:column; align-items:stretch;}
    .filtros .grp{justify-content:space-between;}
    .sec-head{flex-direction:column; align-items:stretch;}
  }

<body data-page="relatorios">

<main>
  <div class="filtros">
    <div class="grp"><label>Estufa</label><select id="fEstufa"><option value="todas">Todas</option></select></div>
  </div>

  <div class="cats" id="cats">
    <div class="cat active" data-c="pulverizacoes">Pulverizações</div>
    <div class="cat" data-c="nutricao">Nutrição</div>
    <div class="cat" data-c="estoque">Estoque</div>
    <div class="cat" data-c="colheita">Colheita</div>

    <div class="cat" data-c="financeiro">Financeiro</div>
  </div>

  <div id="conteudo"><div class="loading">Carregando dados…</div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
const num = v => { const n = parseFloat(String(v??'').replace(',','.')); return isNaN(n)?0:n; };
const BRL = v => (Math.round(num(v)*100)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoD = v => { if(!v) return ''; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1]+'-'+m[2]+'-'+m[3] : ''; };
const fmtData = v => { const s = isoD(v); return s ? s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : '—'; };
const fmtQtd = v => { const n = num(v); return n % 1 === 0 ? String(n) : n.toFixed(2).replace('.',','); };
const iso = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const hojeISO = () => iso(new Date());

let DADOS = {};
let cat = 'pulverizacoes';
let estufa = 'todas';
const charts = {};
const perSec = {pulv:'semana', nutr:'semana', colh:'semana', fin:'atual'};
let vendMes = hojeISO().slice(0,7);

async function get(t){
  try { if (typeof buscarTipo === 'function') return await buscarTipo(t); }
  catch (e) { const c = (typeof cacheLerTipo === 'function') ? cacheLerTipo(t) : null; if (c) return c; }
  try {
    const ft = (typeof fetchComTimeout === 'function') ? await fetchComTimeout(API_URL+'?tipo='+t) : await fetch(API_URL+'?tipo='+t);
    return ((await ft.json()).data)||[];
  } catch(e){
    const c = (typeof cacheLerTipo === 'function') ? cacheLerTipo(t) : null; return c || [];
  }
}
async function carregarDados(){
  const tipos = ['colheitas','ciclos','pulverizacao','nutricao','estoque','movimentacoes','vendas','boletos'];
  try {
    if (typeof buscarLote === 'function') {
      const d = await buscarLote(tipos);
      tipos.forEach(t => DADOS[t] = d[t] || []);
      return;
    }
  } catch(e){}
  const r = await Promise.all(tipos.map(get));
  tipos.forEach((t,i) => DADOS[t] = r[i] || []);
}

// ---------- períodos ----------
function periodoDe(tipo){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if(tipo === 'semana'){
    const ini = new Date(hoje); ini.setDate(ini.getDate() - 6);
    return {ini: iso(ini), fim: iso(hoje)};
  }
  const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const fim = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  return {ini: iso(ini), fim: iso(fim)};
}
function periodoAnteriorDe(p){
  const a = new Date(p.ini+'T00:00:00'), b = new Date(p.fim+'T00:00:00');
  const dias = Math.round((b - a)/86400000) + 1;
  const f2 = new Date(a); f2.setDate(f2.getDate() - 1);
  const i2 = new Date(f2); i2.setDate(i2.getDate() - dias + 1);
  return {ini: iso(i2), fim: iso(f2)};
}
function noPer(v, p){ const s = isoD(v); return !!s && s >= p.ini && s <= p.fim; }
function estOk(e){ return estufa === 'todas' || String(e ?? '') === estufa; }
function estufasDe(d){
  const s = String(d ?? '').trim();
  if(!s) return [];
  return s.split(',').map(x=>x.trim()).filter(Boolean);
}
function estufaBate(d){
  if(estufa === 'todas') return true;
  return estufasDe(d).includes(estufa);
}

// ---------- flexibilidade de texto (acentos/caixa/typos leves) ----------
function chaveFlex(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}
function distEdit(a,b){
  if(a === b) return 0;
  if(Math.abs(a.length - b.length) > 2) return 99;
  let prev = Array.from({length:b.length+1}, (_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur = [i];
    for(let j=1;j<=b.length;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev = cur;
  }
  return prev[b.length];
}
function toleraTexto(a,b){
  a = chaveFlex(a); b = chaveFlex(b);
  if(!a || !b) return false;
  if(a === b) return true;
  const minLen = Math.min(a.length, b.length);
  if(minLen < 5) return false;
  const lim = Math.min(a.length, b.length) >= 10 ? 2 : 1;
  return distEdit(a,b) <= lim;
}
function fundirChavesFlex(map, mergeFn){
  const keys = Object.keys(map);
  const usadas = new Set();
  const out = {};
  for(const k of keys){
    if(usadas.has(k)) continue;
    let val = map[k];
    for(const k2 of keys){
      if(k2 === k || usadas.has(k2)) continue;
      if(toleraTexto(k, k2)){ val = mergeFn(val, map[k2]); usadas.add(k2); }
    }
    out[k] = val;
    usadas.add(k);
  }
  return out;
}

// ---------- helpers ----------
function prodList(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  const s = String(v).trim();
  if(s.startsWith('[')){ try{ const a = JSON.parse(s); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  return [{nome: s}];
}
function nomeProdOf(o){ return (o && (o.produto || o.nome)) || String(o || ''); }
function alvosLista(alvo){ return String(alvo||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean); }
function parseItensRel(t){
  const v = t.itens;
  if(Array.isArray(v)) return v;
  if(typeof v === 'string' && v.trim().startsWith('[')){ try{ const a = JSON.parse(v); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  return [];
}
function cultDoCiclo(id){ const c = (DADOS.ciclos||[]).find(x => String(x.id) === String(id)); return c ? (c.cultura||'') : ''; }
function cicloDe(id){ return (DADOS.ciclos||[]).find(x => String(x.id) === String(id)) || null; }

function tabela(cols, rows, vazio){
  if(!rows.length) return '<div class="empty">'+(vazio || 'Sem registros no período.')+'</div>';
  return '<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th'+(c.n?' class="num"':'')+'>'+c.t+'</th>').join('')+
    '</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}
function rankHTML(pares, fmt, vazio){
  if(!pares.length) return '<div class="empty">'+(vazio || 'Sem dados no período.')+'</div>';
  return pares.map(([k,v,extra])=>'<div class="rank"><span>'+esc(k)+(extra!=null?'<span class="pct">'+extra+'</span>':'')+'</span><b>'+(fmt?fmt(v):v)+'</b></div>').join('');
}
function novoChart(id, cfg){
  const el = document.getElementById(id);
  if(!el) return;
  if(charts[id]) charts[id].destroy();
  if(!window.Chart) return;
  Chart.defaults.color = '#9DB8A4'; Chart.defaults.borderColor = '#24402F';
  charts[id] = new Chart(el, cfg);
}
const cores = {leaf:'#3D7A5C', lime:'#8FD19A', gold:'#D9A441', red:'#E0785F', blue:'#5C8FD1', dim:'#6E8A75'};
function barOpts(){
  return {plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{color:'#9DB8A4'}, grid:{color:'#24402F'}}, x:{ticks:{color:'#9DB8A4'}, grid:{display:false}}}};
}
function toggleHTML(sec, opcoes, atual){
  return '<div class="per-toggle" data-sec="'+sec+'">'+opcoes.map(o=>
    '<button data-p="'+o[0]+'"'+(o[0]===atual?' class="ativo"':'')+'>'+o[1]+'</button>').join('')+'</div>';
}

// ---------- regra de falha (pulv + nutrição) ----------
function classificarTarefa(t, tipo){
  const st = String(t.status||'').toLowerCase();
  const exec = isoD(t.dataExecucao);
  let plan = '';
  if(tipo === 'nutr'){
    if(st === 'reprogramada') plan = isoD(t.dataOriginal) || '';
    else plan = isoD(t.dataPrevista) || isoD(t.dataOriginal) || '';
    if(st === 'feito' && !isoD(t.dataPrevista)) plan = isoD(t.dataOriginal) || '';
  }else{
    plan = isoD(t.dataPrevista) || '';
  }
  if(st === 'feito'){
    if(plan && exec) return {plan, exec, classe: plan === exec ? 'sucesso' : 'transferida'};
    if(exec) return {plan, exec, classe: plan ? 'transferida' : 'sem-plan'};
    return {plan, exec, classe: 'sem-plan'};
  }
  if(st === 'reprogramada') return {plan, exec:'', classe:'transferida'};
  if(st === 'nao-realizada') return {plan, exec:'', classe:'nao-real'};
  if(st === 'pendente'){
    if(plan && plan < hojeISO()) return {plan, exec:'', classe:'atrasada'};
    return {plan, exec:'', classe:'pendente'};
  }
  if(st === 'cancelado') return {plan, exec:'', classe:'cancelada'};
  return {plan, exec, classe:'outra'};
}
function desempenhoPorDia(lista, tipo, p){
  const map = {};
  const ensure = d => { if(!map[d]) map[d] = {sucesso:0, transferida:0, naoReal:0, atrasada:0, exec:0}; return map[d]; };
  lista.forEach(t => {
    const a = classificarTarefa(t, tipo);
    if(a.plan && a.plan >= p.ini && a.plan <= p.fim){
      const m = ensure(a.plan);
      if(a.classe === 'sucesso') m.sucesso++;
      else if(a.classe === 'transferida') m.transferida++;
      else if(a.classe === 'nao-real') m.naoReal++;
      else if(a.classe === 'atrasada') m.atrasada++;
    }
    if(a.exec && a.exec >= p.ini && a.exec <= p.fim) ensure(a.exec).exec++;
  });
  return map;
}

// ---------- PULVERIZAÇÕES ----------
function pulvNoPeriodo(p){
  return (DADOS.pulverizacao||[]).filter(t => {
    const a = classificarTarefa(t, 'pulv');
    const datas = [a.plan, a.exec].filter(Boolean);
    const noPeriodo = datas.some(d => d >= p.ini && d <= p.fim);
    return noPeriodo && estufaBate(t.estufa);
  });
}
function secPulverizacoes(){
  const p = periodoDe(perSec.pulv);
  const rot = perSec.pulv === 'semana' ? 'Semana' : 'Mês';
  return `
  <div class="sec-head">
    <div class="resumo" id="puResumo">Período: <b>${fmtData(p.ini)}</b> – <b>${fmtData(p.fim)}</b></div>
    ${toggleHTML('pulv', [['semana','Semana'],['mes','Mês']], perSec.pulv)}
  </div>
  <div class="grid cols2">
    <div class="card"><h2>A. Alvos mais visados <small>${rot}</small></h2><canvas id="chAlvos"></canvas><div id="rkAlvos"></div></div>
    <div class="card"><h2>B. Produtos mais utilizados <small>${rot}</small></h2><div id="tbProdutos"></div></div>
  </div>
  <div class="grid cols2" style="margin-top:14px">
    <div class="card"><h2>C. Estufas mais pulverizadas <small>${rot}</small></h2><canvas id="chEstufas"></canvas><div id="rkEstufas"></div></div>
    <div class="card"><h2>D. Desempenho das aplicações por dia <small>${rot}</small></h2><div id="tbDia"></div>
      <p class="nota">Falha = programada para o dia e não executada nele (transferida ou não realizada). Data planejada e de execução são preservadas; transferida não conta como 2 realizadas.</p>
    </div>
  </div>`;
}
function pintarPulverizacoes(){
  const p = periodoDe(perSec.pulv);
  const lista = pulvNoPeriodo(p);
  document.getElementById('puResumo').innerHTML =
    'Período: <b>'+fmtData(p.ini)+'</b> – <b>'+fmtData(p.fim)+'</b> · <b>'+lista.length+'</b> aplicação(ões)';

  // A — alvos (flex: acentos/caixa/typos leves não duplicam)
  const alvoCount = {};
  lista.forEach(t => alvosLista(t.alvo).forEach(a => {
    const k = chaveFlex(a); if(!k) return;
    alvoCount[k] = alvoCount[k] || {nome: String(a).trim(), n:0};
    alvoCount[k].n++;
  }));
  const alvoFund = fundirChavesFlex(alvoCount, (a,b)=>({nome:a.nome, n:a.n+b.n}));
  const rkAlvos = Object.values(alvoFund).sort((a,b)=>b.n-a.n);
  const totalAlvos = rkAlvos.reduce((a,x)=>a+x.n,0) || 1;
  const topA = rkAlvos.slice(0,8);
  novoChart('chAlvos', {type:'bar', data:{labels: topA.map(x=>x.nome), datasets:[{data: topA.map(x=>x.n), backgroundColor:cores.red, borderRadius:6}]}, options:barOpts()});
  document.getElementById('rkAlvos').innerHTML = rkAlvos.length
    ? rankHTML(rkAlvos.slice(0,10).map(x=>[x.nome, x.n, Math.round(x.n/totalAlvos*100)+'%']), v=>v+'×', 'Sem alvos registrados.')
    : '<div class="empty">Sem alvos no período.</div>';

  // B — produtos (mesma flexibilidade + consumo tolerante)
  const prodRaw = {};
  const consumo = {};
  (DADOS.movimentacoes||[]).forEach(m => {
    if(String(m.origem||'').toLowerCase() !== 'pulverizacao' || String(m.tipo) !== 'saida') return;
    if(!noPer(m.data, p)) return;
    const k = chaveFlex(m.produtoNome||'—')+'|'+chaveFlex(m.unidade||'');
    consumo[k] = consumo[k] || {qtd:0, un:m.unidade||'', nome:String(m.produtoNome||'—').trim()};
    consumo[k].qtd += num(m.quantidade);
  });
  lista.forEach(t => prodList(t.produto).forEach(o => {
    const n = nomeProdOf(o); if(!n) return;
    const k = chaveFlex(n); if(!k) return;
    prodRaw[k] = prodRaw[k] || {nome:String(n).trim(), n:0};
    prodRaw[k].n++;
  }));
  const prodFund = fundirChavesFlex(prodRaw, (a,b)=>({nome:a.nome, n:a.n+b.n}));
  const rkProd = Object.entries(prodFund).map(([k,v])=>[k, v]).sort((a,b)=>b[1].n-a[1].n);
  const prodRows = rkProd.map(([k,o]) => {
    let cons = '', un = '';
    for(const ck in consumo){
      const parte = ck.split('|')[0];
      if(parte === k || toleraTexto(parte, k)){ cons = fmtQtd(consumo[ck].qtd); un = consumo[ck].un; delete consumo[ck]; break; }
    }
    return '<tr><td>'+esc(o.nome)+'</td><td class="num">'+o.n+'</td><td class="num">'+(cons||'—')+'</td><td class="mut">'+esc(un||'—')+'</td></tr>';
  });
  document.getElementById('tbProdutos').innerHTML = tabela(
    [{t:'Nome comercial'},{t:'Aplicações',n:1},{t:'Consumido',n:1},{t:'Un.'}], prodRows, 'Sem pulverizações no período.');

  // C — estufas
  const estCount = {};
  lista.forEach(t => estufasDe(t.estufa).forEach(e => { if(e) estCount[e] = (estCount[e]||0)+1; }));
  const rkEst = Object.entries(estCount).sort((a,b)=>num(a[0])-num(b[0]));
  const totEst = rkEst.reduce((a,x)=>a+x[1],0) || 1;
  const topE = rkEst.slice(0,7);
  novoChart('chEstufas', {type:'bar', data:{labels: topE.map(x=>'Estufa '+x[0]), datasets:[{data: topE.map(x=>x[1]), backgroundColor:cores.leaf, borderRadius:6}]}, options:barOpts()});
  document.getElementById('rkEstufas').innerHTML = rkEst.length
    ? rankHTML(rkEst.map(x=>['Estufa '+x[0], x[1], Math.round(x[1]/totEst*100)+'%']), v=>v+'×', 'Sem pulverizações.')
    : '<div class="empty">Sem pulverizações no período.</div>';

  // D — desempenho por dia
  const dias = desempenhoPorDia(lista, 'pulv', p);
  const diasOrd = Object.keys(dias).sort().reverse();
  const diaRows = diasOrd.map(d => {
    const m = dias[d];
    const falhas = m.transferida + m.naoReal + m.atrasada;
    return '<tr'+(falhas?' class="alerta-linha"':(m.sucesso?' class="ok-linha"':''))+'><td>'+fmtData(d)+'</td>'+
      '<td class="num">'+m.sucesso+'</td><td class="num">'+m.transferida+'</td>'+
      '<td class="num">'+m.naoReal+'</td><td class="num">'+m.atrasada+'</td></tr>';
  });
  document.getElementById('tbDia').innerHTML = tabela(
    [{t:'Dia'},{t:'Na data planejada',n:1},{t:'Transferidas',n:1},{t:'Não realizadas',n:1},{t:'Pendentes atrasadas',n:1}],
    diaRows, 'Sem aplicações com data no período.');
}

// ---------- NUTRIÇÃO ----------
function nutrNoPeriodo(p){
  return (DADOS.nutricao||[]).filter(t => {
    const a = classificarTarefa(t, 'nutr');
    const datas = [a.plan, a.exec].filter(Boolean);
    const noPeriodo = datas.some(d => d >= p.ini && d <= p.fim);
    return noPeriodo && estOk(t.estufa);
  });
}
function secNutricao(){
  const p = periodoDe(perSec.nutr);
  const rot = perSec.nutr === 'semana' ? 'Semana' : 'Mês';
  return `
  <div class="sec-head">
    <div class="resumo" id="nuResumo">Período: <b>${fmtData(p.ini)}</b> – <b>${fmtData(p.fim)}</b></div>
    ${toggleHTML('nutr', [['semana','Semana'],['mes','Mês']], perSec.nutr)}
  </div>
  <div class="grid cols2">
    <div class="card"><h2>A. Produtos mais utilizados <small>${rot}</small></h2><div id="tbNutProd"></div></div>
    <div class="card"><h2>B. Dias mais bem-sucedidos <small>${rot}</small></h2><div id="rkBons"></div></div>
  </div>
  <div class="grid cols2" style="margin-top:14px">
    <div class="card"><h2>C. Dias com mais falhas <small>${rot}</small></h2><div id="rkFalhas"></div>
      <p class="nota">Falha = transferida para outra data ou não realizada na data planejada.</p>
    </div>
    <div class="card"><h2>D. Estufas mais atendidas <small>${rot}</small></h2><div id="rkNutEst"></div></div>
  </div>`;
}
function pintarNutricao(){
  const p = periodoDe(perSec.nutr);
  const lista = nutrNoPeriodo(p);
  document.getElementById('nuResumo').innerHTML =
    'Período: <b>'+fmtData(p.ini)+'</b> – <b>'+fmtData(p.fim)+'</b> · <b>'+lista.length+'</b> tarefa(s)';

  // A — produtos (itens com qtd + unidade; flex p/ acentos e typos)
  const prodAgg = {};
  lista.forEach(t => parseItensRel(t).forEach(it => {
    const n = it.produto || it.nome; if(!n) return;
    const un = it.unidade || '';
    const k = chaveFlex(n)+'|'+chaveFlex(un);
    if(!prodAgg[k]) prodAgg[k] = {nome:String(n).trim(), un, qtd:0, tarefas:new Set()};
    prodAgg[k].qtd += num(it.qtd);
    prodAgg[k].tarefas.add(t.id);
  }));
  const prodFund = fundirChavesFlex(prodAgg, (a,b)=>({
    nome:a.nome, un:a.un||b.un, qtd:a.qtd+b.qtd, tarefas:new Set([...a.tarefas, ...b.tarefas])
  }));
  const rkProd = Object.values(prodFund).sort((a,b)=>b.qtd-a.qtd);
  const prodRows = rkProd.map(o =>
    '<tr><td>'+esc(o.nome)+'</td><td class="num">'+fmtQtd(o.qtd)+'</td><td class="mut">'+esc(o.un||'—')+'</td><td class="num">'+o.tarefas.size+'</td></tr>');
  document.getElementById('tbNutProd').innerHTML = tabela(
    [{t:'Nome comercial'},{t:'Qtd. utilizada',n:1},{t:'Un.'},{t:'Aplicações',n:1}], prodRows, 'Sem itens com quantidade no período.');

  // B / C — dias
  const dias = desempenhoPorDia(lista, 'nutr', p);
  const entradas = Object.entries(dias);
  const bons = entradas.filter(([,m])=>m.sucesso>0).sort((a,b)=>b[1].sucesso-a[1].sucesso).slice(0,8);
  const ruins = entradas.map(([d,m])=>[d, m.transferida+m.naoReal+m.atrasada, m])
    .filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  document.getElementById('rkBons').innerHTML = bons.length
    ? rankHTML(bons.map(([d,m])=>[fmtData(d), m.sucesso]), v=>v+' no dia', 'Sem dias com execução na data correta.')
    : '<div class="empty">Sem aplicações realizadas na data planejada.</div>';
  document.getElementById('rkFalhas').innerHTML = ruins.length
    ? rankHTML(ruins.map(([d,n,m])=>[fmtData(d), n, m.transferida+' trans. · '+m.naoReal+' não real. · '+m.atrasada+' atras.']), v=>v+' falha(s)', 'Sem falhas no período.')
    : '<div class="empty">Sem falhas no período.</div>';

  // D — estufas
  const estAgg = {};
  lista.forEach(t => {
    const e = String(t.estufa||'—');
    if(!estAgg[e]) estAgg[e] = {n:0, prods:new Set()};
    estAgg[e].n++;
    parseItensRel(t).forEach(it => { if(it.produto) estAgg[e].prods.add(it.produto); });
    prodList(t.produto).forEach(o => { const n = nomeProdOf(o); if(n) estAgg[e].prods.add(n); });
  });
  const rkEst = Object.entries(estAgg).sort((a,b)=>num(a[0])-num(b[0]));
  document.getElementById('rkNutEst').innerHTML = rkEst.length
    ? rankHTML(rkEst.map(([e,o])=>['Estufa '+e, o.n, o.prods.size+' produto(s)']), v=>v+' tarefa(s)', 'Sem tarefas no período.')
    : '<div class="empty">Sem tarefas no período.</div>';
}

// ---------- ESTOQUE ----------
function secEstoque(){
  return `
  <div class="sec-head">
    <div class="resumo">Somente alertas com base nos <b>limites mínimos cadastrados</b>.</div>
  </div>
  <div class="grid cols2">
    <div class="card"><h2>Estoque zerado</h2><div id="tbZero"></div></div>
    <div class="card"><h2>Estoque baixo</h2><div id="tbBaixo"></div></div>
  </div>`;
}
function pintarEstoque(){
  const est = (DADOS.estoque||[]).slice();
  const zerados = est.filter(e => num(e.estoqueAtual) <= 0)
    .sort((a,b)=>num(a.estoqueAtual)-num(b.estoqueAtual));
  const baixos = est.filter(e => num(e.estoqueAtual) > 0 && num(e.estoqueMinimo) > 0 && num(e.estoqueAtual) <= num(e.estoqueMinimo))
    .sort((a,b)=>(num(a.estoqueAtual)/Math.max(num(a.estoqueMinimo),1))-(num(b.estoqueAtual)/Math.max(num(b.estoqueMinimo),1)));
  const zRows = zerados.map(e =>
    '<tr><td>'+esc(e.nome||'—')+'</td><td class="num">'+fmtQtd(e.estoqueAtual)+'</td><td class="mut">'+esc(e.unidade||'—')+'</td><td><span class="badge err">Zerado</span></td></tr>');
  const bRows = baixos.map(e =>
    '<tr><td>'+esc(e.nome||'—')+'</td><td class="num">'+fmtQtd(e.estoqueAtual)+'</td><td class="mut">'+esc(e.unidade||'—')+'</td><td><span class="badge warn">Abaixo do mínimo</span></td></tr>');
  document.getElementById('tbZero').innerHTML = tabela(
    [{t:'Produto'},{t:'Atual',n:1},{t:'Un.'},{t:'Situação'}], zRows, 'Nenhum produto zerado.');
  document.getElementById('tbBaixo').innerHTML = tabela(
    [{t:'Produto'},{t:'Atual',n:1},{t:'Un.'},{t:'Situação'}], bRows, 'Nenhum produto abaixo do mínimo.');
}

// ---------- COLHEITA ----------
function colheitasNoPeriodo(p){
  return (DADOS.colheitas||[]).filter(h => noPer(h.data, p) && estOk(h.estufa));
}
function somaKG(lista){ return lista.reduce((a,h) => String(h.unidade||'').toUpperCase()==='CX' ? a : a + num(h.quantidade), 0); }
function somaCXX(lista){ return lista.reduce((a,h) => String(h.unidade||'').toUpperCase()==='CX' ? a + num(h.quantidade) : a, 0); }
function kgDe(h){ return String(h.unidade||'').toUpperCase()==='CX' ? 0 : num(h.quantidade); }

function secColheita(){
  const p = periodoDe(perSec.colh);
  return `
  <div class="sec-head">
    <div class="resumo" id="coResumo">Período: <b>${fmtData(p.ini)}</b> – <b>${fmtData(p.fim)}</b></div>
    ${toggleHTML('colh', [['semana','Semana'],['mes','Mês']], perSec.colh)}
  </div>
  <div class="grid cols2">
    <div class="card"><h2>A. Produção das estufas no período <small>não é ranking de desempenho</small></h2><div id="tbProdEst"></div></div>
    <div class="card"><h2>B. Estufas perdendo rendimento <small>vs. período anterior (mesma estufa)</small></h2><div id="tbQueda"></div>
      <p class="nota">Comparação sempre com o histórico da própria estufa, com contexto do ciclo. Sem comparar ciclos de idades diferentes sem identificação.</p>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><h2>C. Média de produção por planta <small>safra inteira — ignora filtro semanal/mensal</small></h2><div id="tbPlanta"></div></div>
  <div class="card" style="margin-top:14px"><h2>D. Precocidade das estufas <small>plantio → 1ª colheita · safra inteira</small></h2><div id="tbPrec"></div></div>`;
}
function pintarColheita(){
  const p = periodoDe(perSec.colh);
  const at = colheitasNoPeriodo(p);
  const ant = colheitasNoPeriodo(periodoAnteriorDe(p));
  document.getElementById('coResumo').innerHTML =
    'Período: <b>'+fmtData(p.ini)+'</b> – <b>'+fmtData(p.fim)+'</b> · <b>'+Math.round(somaKG(at))+'</b> KG · <b>'+somaCXX(at)+'</b> CX';

  // A — produção por estufa (sem competição)
  const porEst = {};
  at.forEach(h => {
    const e = String(h.estufa||'—');
    if(!porEst[e]) porEst[e] = {kg:0, cx:0, n:0};
    porEst[e].kg += kgDe(h);
    if(String(h.unidade||'').toUpperCase()==='CX') porEst[e].cx += num(h.quantidade);
    porEst[e].n++;
  });
  const estOrd = Object.keys(porEst).sort((a,b)=>num(a)-num(b));
  const aRows = estOrd.map(e => {
    const o = porEst[e];
    return '<tr><td>Estufa '+esc(e)+'</td><td class="num">'+Math.round(o.kg).toLocaleString('pt-BR')+'</td>'+
      '<td class="num">'+Math.round(o.cx).toLocaleString('pt-BR')+'</td><td class="num">'+o.n+'</td></tr>';
  });
  document.getElementById('tbProdEst').innerHTML = tabela(
    [{t:'Estufa'},{t:'KG',n:1},{t:'CX',n:1},{t:'Colheitas',n:1}], aRows, 'Sem colheitas no período.');

  // B — quedas vs período anterior (mesma estufa)
  const antPorEst = {};
  ant.forEach(h => { const e = String(h.estufa||'—'); antPorEst[e] = (antPorEst[e]||0) + kgDe(h); });
  const bRows = [];
  estOrd.forEach(e => {
    const atual = porEst[e].kg;
    const anterior = antPorEst[e] || 0;
    if(!(anterior > 0)) return;
    const dif = atual - anterior;
    const pct = Math.round(dif/anterior*100);
    const cicloAt = (DADOS.ciclos||[]).filter(c => String(c.estufa)===e && c.status==='ativa')[0]
      || (DADOS.ciclos||[]).filter(c => String(c.estufa)===e).sort((a,b)=>String(b.dataPlantio||'').localeCompare(String(a.dataPlantio||'')))[0];
    let contexto = '—';
    if(cicloAt){
      const plantio = isoD(cicloAt.dataPlantio);
      const dias = plantio ? Math.max(0, Math.round((new Date(hojeISO()) - new Date(plantio))/86400000)) : null;
      const colhendo = isoD(cicloAt.dataInicio) && !isoD(cicloAt.dataFim);
      contexto = (cicloAt.cultura||'') + (cicloAt.variedade?' · '+cicloAt.variedade:'') +
        (dias!=null?' · dia '+dias+' pós-plantio':'') + (colhendo?' · em colheita':' · fora de colheita');
    }
    const cor = dif < 0 ? 'style="color:var(--red)"' : 'style="color:var(--lime)"';
    bRows.push('<tr'+(dif<0?' class="alerta-linha"':'')+'><td>Estufa '+esc(e)+'</td>'+
      '<td class="num">'+Math.round(atual).toLocaleString('pt-BR')+'</td>'+
      '<td class="num mut">'+Math.round(anterior).toLocaleString('pt-BR')+'</td>'+
      '<td class="num" '+cor+'>'+(dif>=0?'+':'')+Math.round(dif).toLocaleString('pt-BR')+'</td>'+
      '<td class="num" '+cor+'>'+(dif>=0?'+':'')+pct+'%</td>'+
      '<td class="mut">'+esc(contexto)+'</td></tr>');
  });
  document.getElementById('tbQueda').innerHTML = tabela(
    [{t:'Estufa'},{t:'Período atual (KG)',n:1},{t:'Anterior (KG)',n:1},{t:'Diferença',n:1},{t:'Variação',n:1},{t:'Contexto do ciclo'}],
    bRows, 'Sem base de comparação (estufas sem produção no período anterior).');

  // C — média por planta (safra inteira)
  const ciclosRel = (DADOS.ciclos||[]).filter(c => estOk(c.estufa));
  const colhPorCiclo = {};
  (DADOS.colheitas||[]).forEach(h => {
    const id = String(h.cicloId||'');
    if(!colhPorCiclo[id]) colhPorCiclo[id] = {kg:0, cx:0, n:0};
    colhPorCiclo[id].kg += kgDe(h);
    if(String(h.unidade||'').toUpperCase()==='CX') colhPorCiclo[id].cx += num(h.quantidade);
    colhPorCiclo[id].n++;
  });
  const cRows = [], semQtd = [];
  ciclosRel.forEach(c => {
    const t = colhPorCiclo[String(c.id)] || {kg:0, cx:0, n:0};
    const qp = parseInt(c.qtdPlantas, 10);
    const linha = {
      estufa: c.estufa, cultura: c.cultura||'—', variedade: c.variedade||'',
      plantio: fmtData(c.dataPlantio), status: c.status||'—',
      kg: t.kg, cx: t.cx, n: t.n, qp: (qp>0?qp:0), ciclo: c
    };
    if(qp > 0 && t.n > 0) cRows.push(linha);
    else if(qp > 0) cRows.push(linha);
    else semQtd.push(linha);
  });
  cRows.sort((a,b)=> (b.kg/(b.qp||1)) - (a.kg/(a.qp||1)));
  const cTab = cRows.map(o =>
    '<tr><td>Estufa '+esc(String(o.estufa))+'</td><td>'+esc(o.cultura)+(o.variedade?' <span class="mut">('+esc(o.variedade)+')</span>':'')+'</td>'+
    '<td class="mut">'+o.plantio+'</td><td class="num">'+o.qp+'</td>'+
    '<td class="num">'+Math.round(o.kg).toLocaleString('pt-BR')+'</td>'+
    '<td class="num">'+(o.kg>0?(o.kg/o.qp).toFixed(2).replace('.',','):'—')+'</td>'+
    '<td class="num">'+(o.cx>0?(o.cx/o.qp).toFixed(2).replace('.',','):'—')+'</td>'+
    '<td class="mut">'+esc(o.status)+'</td></tr>');
  const semTab = semQtd.map(o =>
    '<tr><td>Estufa '+esc(String(o.estufa))+'</td><td>'+esc(o.cultura)+(o.variedade?' <span class="mut">('+esc(o.variedade)+')</span>':'')+'</td>'+
    '<td class="mut">'+o.plantio+'</td><td><span class="badge warn">sem qtd.</span></td>'+
    '<td class="num">'+Math.round(o.kg).toLocaleString('pt-BR')+'</td><td class="num mut">—</td><td class="num mut">—</td>'+
    '<td class="mut">'+esc(o.status)+'</td></tr>');
  document.getElementById('tbPlanta').innerHTML =
    tabela([{t:'Estufa'},{t:'Cultura'},{t:'Plantio'},{t:'Plantas',n:1},{t:'KG acum.',n:1},{t:'KG/planta',n:1},{t:'CX/planta',n:1},{t:'Status'}],
      cTab, 'Sem ciclos com quantidade de plantas cadastrada.') +
    (semTab.length ? '<div class="sub-tit">Ciclos sem quantidade de plantas cadastrada (preencha na edição do ciclo)</div>'+
      tabela([{t:'Estufa'},{t:'Cultura'},{t:'Plantio'},{t:'Plantas',n:1},{t:'KG acum.',n:1},{t:'KG/planta',n:1},{t:'CX/planta',n:1},{t:'Status'}], semTab, '') : '');

  // D — precocidade
  const prec = [];
  ciclosRel.forEach(c => {
    const plantio = isoD(c.dataPlantio);
    const cols = (DADOS.colheitas||[]).filter(h => String(h.cicloId)===String(c.id) && isoD(h.data)).sort((a,b)=>isoD(a.data).localeCompare(isoD(b.data)));
    if(!plantio || !cols.length) return;
    const primeira = isoD(cols[0].data);
    const dias = Math.round((new Date(primeira+'T00:00:00') - new Date(plantio+'T00:00:00'))/86400000);
    if(dias < 0) return;
    prec.push({estufa:c.estufa, plantio, primeira, dias, cultura:c.cultura||'—', variedade:c.variedade||''});
  });
  prec.sort((a,b)=>a.dias-b.dias);
  const pRows = prec.map((o,i) =>
    '<tr><td class="num">'+(i+1)+'</td><td>Estufa '+esc(String(o.estufa))+'</td>'+
    '<td>'+esc(o.cultura)+(o.variedade?' <span class="mut">('+esc(o.variedade)+')</span>':'')+'</td>'+
    '<td class="mut">'+fmtData(o.plantio)+'</td><td class="mut">'+fmtData(o.primeira)+'</td>'+
    '<td class="num"><b>'+o.dias+'</b> dias</td></tr>');
  document.getElementById('tbPrec').innerHTML = tabela(
    [{t:'#',n:1},{t:'Estufa'},{t:'Cultura'},{t:'Plantio'},{t:'1ª colheita'},{t:'Dias até colher',n:1}],
    pRows, 'Sem ciclos com plantio e colheita registrados.');
}

// ---------- VENDAS ----------
function semanaDeData(ds){
  const d = new Date(ds+'T00:00:00');
  const dow = (d.getDay()+6)%7; // 0=seg
  const seg = new Date(d); seg.setDate(d.getDate()-dow);
  const dom = new Date(seg); dom.setDate(seg.getDate()+6);
  return {ini: iso(seg), fim: iso(dom), rot: 'Sem. '+fmtData(iso(seg)).slice(0,5)};
}
function secVendas(){
  const [a,m] = vendMes.split('-').map(Number);
  const fim = new Date(a, m, 0);
  return `
  <div class="sec-head">
    <div class="resumo" id="veResumo">Mês: <b>${m}/${a}</b></div>
    <div class="per-toggle"><input type="month" id="veMes" value="${vendMes}"></div>
  </div>
  <div class="grid cols2">
    <div class="card"><h2>A. Quantidade vendida <small>mês</small></h2><div id="tbQtdV"></div></div>
    <div class="card"><h2>B. Melhor semana do mês</h2><div id="tbSemana"></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>C. Preço médio do mês <small>média ponderada pelo volume</small></h2><div id="tbPreco"></div>
    <p class="nota">Média ponderada = Σ total ÷ Σ volume. Culturas/unidades separadas quando necessário — nunca média simples de preços.</p>
  </div>`;
}
function pintarVendas(){
  const ym = vendMes;
  const lista = (DADOS.vendas||[]).filter(v => isoD(v.data).slice(0,7) === ym);
  const [a,m] = ym.split('-').map(Number);
  document.getElementById('veResumo').innerHTML = 'Mês: <b>'+m+'/'+a+'</b> · <b>'+lista.length+'</b> venda(s)';

  // A — quantidades
  let kg = 0, cx = 0;
  lista.forEach(v => {

    if(String(v.unidade||'').toUpperCase()==='CX') cx += q; else kg += q;
  });
  document.getElementById('tbQtdV').innerHTML = tabela(
    [{t:'Indicador'},{t:'Total',n:1}],
    ['<tr><td>Total de KG vendidos</td><td class="num"><b>'+Math.round(kg).toLocaleString('pt-BR')+'</b> KG</td></tr>',
     '<tr><td>Total de CAIXAS vendidas</td><td class="num"><b>'+Math.round(cx).toLocaleString('pt-BR')+'</b> CX</td></tr>'],
    'Sem vendas no mês.');

  // B — melhor semana (segunda a domingo, dentro do mês)
  const sems = {};
  lista.forEach(v => {
    const ds = isoD(v.data); if(!ds) return;
    const s = semanaDeData(ds);
    const chave = s.ini;
    if(!sems[chave]) sems[chave] = {rot:s.rot, ini:s.ini, fim:s.fim, kg:0, cx:0, fat:0, n:0};
    const q = num(v.qtdPaga) || num(v.quantidade);
    if(String(v.unidade||'').toUpperCase()==='CX') sems[chave].cx += q; else sems[chave].kg += q;
    sems[chave].fat += num(v.total);
    sems[chave].n++;
  });
  const semList = Object.values(sems).sort((a,b)=>(b.kg+b.cx*10)-(a.kg+a.cx*10));
  const sRows = semList.map((s,i) =>
    '<tr'+(i===0?' class="ok-linha"':'')+'><td>'+esc(s.rot)+'</td><td class="mut">'+fmtData(s.ini)+' – '+fmtData(s.fim)+'</td>'+
    '<td class="num">'+Math.round(s.kg).toLocaleString('pt-BR')+'</td><td class="num">'+Math.round(s.cx).toLocaleString('pt-BR')+'</td>'+
    '<td class="num">'+(s.fat>0?BRL(s.fat):'—')+'</td><td class="num">'+s.n+'</td></tr>');
  document.getElementById('tbSemana').innerHTML = tabela(
    [{t:'Semana'},{t:'Período'},{t:'KG',n:1},{t:'CX',n:1},{t:'Faturamento',n:1},{t:'Vendas',n:1}],
    sRows, 'Sem vendas no mês.') +
    (semList.length ? '<p class="nota">Melhor semana: <b style="color:var(--lime)">'+esc(semList[0].rot)+'</b></p>' : '');

  // C — preço médio ponderado por cultura+unidade
  const agg = {};
  lista.forEach(v => {
    const vol = num(v.qtdPaga) || num(v.quantidade);
    if(vol <= 0) return;
    const k = (v.cultura||'—')+'|'+String(v.unidade||'KG').toUpperCase();
    if(!agg[k]) agg[k] = {cultura:v.cultura||'—', un:String(v.unidade||'KG').toUpperCase(), fat:0, vol:0, n:0};
    agg[k].fat += num(v.total);
    agg[k].vol += vol;
    agg[k].n++;
  });
  const pRows = Object.values(agg).sort((a,b)=>b.fat-a.fat).map(o => {
    const media = o.vol > 0 ? o.fat/o.vol : 0;
    return '<tr><td>'+esc(o.cultura)+'</td><td class="mut">'+esc(o.un)+'</td>'+
      '<td class="num">'+fmtQtd(o.vol)+'</td><td class="num">'+BRL(o.fat)+'</td>'+
      '<td class="num"><b>'+BRL(media)+'</b></td><td class="num">'+o.n+'</td></tr>';
  });
  document.getElementById('tbPreco').innerHTML = tabela(
    [{t:'Cultura'},{t:'Un.'},{t:'Volume',n:1},{t:'Faturamento',n:1},{t:'Preço médio ponderado',n:1},{t:'Vendas',n:1}],
    pRows, 'Sem vendas com volume no mês.');
}

// ---------- FINANCEIRO ----------
function situacaoBoleto(b){
  const st = String(b.status||'').toLowerCase();
  if(st === 'pago') return {cls:'ok', txt:'Pago'};
  const v = isoD(b.vencimento);
  if(v && v < hojeISO()) return {cls:'err', txt:'Vencido'};
  return {cls:'warn', txt:'Pendente'};
}
function boletosNoMes(ym){
  const vistos = new Set();
  const out = [];
  (DADOS.boletos||[]).forEach(b => {
    const id = String(b.id||''); if(id && vistos.has(id)) return; if(id) vistos.add(id);
    if(isoD(b.vencimento).slice(0,7) === ym) out.push(b);
  });
  return out.sort((a,b)=>isoD(a.vencimento).localeCompare(isoD(b.vencimento)));
}
function mesOffset(delta){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+delta);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function rotMes(ym){ const [a,m] = ym.split('-'); return m+'/'+a; }
function secFinanceiro(){
  return `
  <div class="sec-head">
    <div class="resumo" id="fiResumo"></div>
    ${toggleHTML('fin', [['atual','Mês atual'],['proximo','Próximo mês']], perSec.fin)}
  </div>
  <div class="grid cols2">
    <div class="card"><h2 id="fiTitA">A. Boletos do mês</h2><div id="tbBoletos"></div>
      <p class="nota" id="fiTotais"></p>
    </div>
    <div class="card"><h2>Situação</h2><div id="fiResumoCard"></div>
      <p class="nota">Pagos não entram no total a pagar. Registros duplicados são ignorados.</p>
    </div>
  </div>`;
}
function pintarFinanceiro(){
  const ym = perSec.fin === 'atual' ? mesOffset(0) : mesOffset(1);
  const lista = boletosNoMes(ym);
  const rot = rotMes(ym);
  const pagos = lista.filter(b=>String(b.status).toLowerCase()==='pago');
  const abertos = lista.filter(b=>String(b.status).toLowerCase()!=='pago');
  const totalPagar = abertos.reduce((a,b)=>a+num(b.valor),0);
  const totalPago = pagos.reduce((a,b)=>a+num(b.valor),0);
  document.getElementById('fiResumo').innerHTML = 'Período: <b>'+rot+'</b> · <b>'+lista.length+'</b> boleto(s)';
  document.getElementById('fiTitA').textContent = (perSec.fin==='atual'?'A. Boletos do mês atual':'A. Boletos do próximo mês')+' · '+rot;

  const rows = lista.map(b => {
    const s = situacaoBoleto(b);
    const valLbl = String(b.status||'').toLowerCase()==='pago' ? 'valor' : 'valor previsto';
    return '<tr><td>'+esc(b.nome||b.empresa||'—')+'</td><td class="num">'+BRL(b.valor)+'</td>'+
      '<td class="mut">'+fmtData(b.vencimento)+'</td><td><span class="badge '+s.cls+'">'+s.txt+'</span></td></tr>';
  });
  document.getElementById('tbBoletos').innerHTML = tabela(
    [{t:'Loja / fornecedor'},{t:'Valor',n:1},{t:'Vencimento'},{t:'Situação'}], rows,
    'Nenhum boleto com vencimento neste mês.');
  document.getElementById('fiTotais').innerHTML =
    '<b>'+lista.length+'</b> boleto(s) · Total a pagar: <b style="color:var(--gold)">'+BRL(totalPagar)+'</b>'+
    (totalPago>0 ? ' · Já pago: <b style="color:var(--lime)">'+BRL(totalPago)+'</b>' : '');

  const nPend = abertos.filter(b=>situacaoBoleto(b).txt==='Pendente').length;
  const nVenc = abertos.filter(b=>situacaoBoleto(b).txt==='Vencido').length;
  document.getElementById('fiResumoCard').innerHTML = rankHTML([
    ['Pendentes (a pagar)', nPend, BRL(abertos.filter(b=>situacaoBoleto(b).txt==='Pendente').reduce((a,b)=>a+num(b.valor),0))],
    ['Vencidos', nVenc, BRL(abertos.filter(b=>situacaoBoleto(b).txt==='Vencido').reduce((a,b)=>a+num(b.valor),0))],
    ['Pagos no mês', pagos.length, BRL(totalPago)]
  ], v=>v+' boleto(s)', 'Sem boletos.');
}

// ---------- orquestração ----------
const SECS = {
  pulverizacoes: {html: secPulverizacoes, pintar: pintarPulverizacoes},
  nutricao: {html: secNutricao, pintar: pintarNutricao},
  estoque: {html: secEstoque, pintar: pintarEstoque},
  colheita: {html: secColheita, pintar: pintarColheita},
  vendas: {html: secVendas, pintar: pintarVendas},
  financeiro: {html: secFinanceiro, pintar: pintarFinanceiro}
};
function render(){
  const s = SECS[cat];
  if(!s) return;
  document.getElementById('conteudo').innerHTML = s.html();
  s.pintar();
}
function popularFiltros(){
  const estufas = new Set();
  ['colheitas','ciclos','pulverizacao','nutricao','movimentacoes'].forEach(t =>
    (DADOS[t]||[]).forEach(r => { const e = String(r.estufa ?? '').trim(); if(e) estufas.add(e); }));
  const listaE = [...estufas].sort((a,b)=>num(a)-num(b));
  const selE = document.getElementById('fEstufa');
  selE.innerHTML = '<option value="todas">Todas</option>'+listaE.map(e=>'<option value="'+esc(e)+'">Estufa '+esc(e)+'</option>').join('');
}

document.getElementById('fEstufa').addEventListener('change', e => { estufa = e.target.value; render(); });
document.getElementById('cats').addEventListener('click', e => {
  const c = e.target.closest('.cat'); if(!c) return;
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
  cat = c.dataset.c;
  render();
});
document.getElementById('conteudo').addEventListener('click', e => {
  const btn = e.target.closest('.per-toggle button[data-p]'); if(!btn) return;
  const wrap = btn.closest('.per-toggle'); const sec = wrap.dataset.sec;
  perSec[sec] = btn.dataset.p;
  render();
});
document.getElementById('conteudo').addEventListener('change', e => {
  if(e.target.id === 'veMes' && e.target.value){
    vendMes = e.target.value;
    render();
  }
});

(async function init(){
  try{
    await carregarDados();
    popularFiltros();
    render();
  }catch(e){
    document.getElementById('conteudo').innerHTML = '<div class="loading">Não consegui carregar os dados. <a href="#" onclick="location.reload();return false">Tentar de novo</a></div>';
  }
})();
</script>
