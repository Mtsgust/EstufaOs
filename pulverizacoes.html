<html lang="pt-BR">
<head>

<link rel="apple-touch-icon" href="logo.png">

<style>
  :root{
    --bg:#0A0E0C; --bg2:#0F1512; --card:#131A16; --card2:#18221C;
    --line:#1E2E25; --ink:#E8F0EA; --mut:#7A9184; --dim:#4A5E52;
    --leaf:#3D7A5C; --lime:#8FD19A; --gold:#D9A441; --red:#E0785F;
    --r:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:100px; -webkit-font-smoothing:antialiased;}
  a{color:var(--lime); text-decoration:none;}

  .page{max-width:860px; margin:0 auto; padding:32px 20px 80px;}
  .hdr{margin-bottom:24px;}
  .hdr h1{font-size:26px; font-weight:800; letter-spacing:-.03em;}
  .hdr p{color:var(--mut); font-size:13px; margin-top:4px;}

  .tabs{display:flex; gap:8px; margin-bottom:20px;}
  .tab{flex:1; text-align:center; padding:11px 0; border-radius:12px; font-size:13px; font-weight:600;
    background:var(--card); border:1px solid var(--line); cursor:pointer; color:var(--mut); transition:.18s;}
  .tab:hover{background:var(--card2); color:var(--ink);}
  .tab.active{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff; border-color:transparent;}

  .estufa-filter{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .estufa-filter label{font-size:12px; color:var(--mut); font-weight:600;}
  .estufa-filter select{flex:1; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
    font-size:13px; background:var(--card); color:var(--ink); font-family:inherit;}
  .estufa-filter select option{background:var(--card); color:var(--ink);}

  .empty{text-align:center; color:var(--dim); font-size:14px; padding:60px 0;}
  .loading{text-align:center; color:var(--dim); font-size:13px; padding:40px 0;}

  .item{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-bottom:12px;
    transition:border-color .18s;}
  .item:hover{border-color:#2A4A35;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .badge{font-size:12px; font-weight:600; background:var(--card2); color:var(--lime); padding:4px 10px;
    border-radius:8px; white-space:nowrap; border:1px solid var(--line);}
  .status{font-size:11px; padding:4px 10px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .status.pendente{background:rgba(217,164,65,.15); color:var(--gold);}
  .status.feito{background:rgba(61,122,92,.2); color:var(--lime);}
  .status.atrasado{background:rgba(224,120,95,.15); color:var(--red);}
  .group-header{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--dim); margin:24px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);}
  .group-header:first-child{margin-top:0;}
  .item h3{margin:0 0 6px; font-size:16px; font-weight:600;}
  .item p{margin:0; font-size:13px; color:var(--mut); line-height:1.5;}
  .item .meta{font-size:12px; color:var(--dim); margin-top:8px;}
  .item .actions{display:flex; gap:8px; margin-top:14px;}
  .item .actions button{flex:1; border:none; border-radius:10px; padding:10px 0; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; transition:.15s;}
  .btn-done{background:var(--leaf); color:#fff;}
  .btn-done:hover{background:#4A8F6A;}
  .btn-edit{background:transparent; color:var(--lime); border:1px solid var(--line) !important;}
  .btn-edit:hover{border-color:var(--leaf) !important; background:rgba(61,122,92,.1);}
  .btn-del{background:transparent; color:var(--red); border:1px solid var(--line) !important;}
  .btn-del:hover{border-color:var(--red) !important; background:rgba(224,120,95,.1);}

  .prod-list{margin:8px 0 0; padding:0; list-style:none;}
  .prod-list li{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0;
    border-bottom:1px dashed var(--line);}
  .prod-list li:last-child{border-bottom:none;}
  .prod-list .p-nome{color:var(--ink); font-weight:500;}
  .prod-list .p-dose{color:var(--mut); font-size:12px; white-space:nowrap; text-align:right;}
  .prod-list .p-total{color:var(--lime); font-size:11px; display:block; font-weight:600; margin-top:2px;}

  .fab{position:fixed; bottom:22px; right:20px; left:20px; max-width:420px; margin:0 auto;
    background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff; border:none; border-radius:14px;
    padding:16px; font-size:16px; font-weight:600; cursor:pointer; font-family:inherit;
    box-shadow:0 8px 24px rgba(61,122,92,.4); transition:.2s; z-index:50;}
  .fab:hover{transform:translateY(-2px); box-shadow:0 12px 28px rgba(61,122,92,.5);}

  dialog{border:none; border-radius:20px; width:min(94vw,480px); padding:0; background:var(--card);
    border:1px solid var(--line); box-shadow:0 24px 64px rgba(0,0,0,.6);}
  dialog::backdrop{background:rgba(0,0,0,.7); backdrop-filter:blur(4px);}
  .sheet{padding:24px; max-height:85vh; overflow-y:auto;}
  .sheet h2{margin:0 0 4px; font-size:18px; font-weight:700;}
  .sheet .sub{font-size:12px; color:var(--mut); margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--mut); margin-bottom:6px; font-weight:600;}
  .field select,.field input,.field textarea{width:100%; padding:11px 14px; border:1px solid var(--line);
    border-radius:10px; font-size:14px; background:var(--card2); color:var(--ink); font-family:inherit;}
  .field select:focus,.field input:focus,.field textarea:focus{outline:none; border-color:var(--leaf);}
  .field input::placeholder,.field textarea::placeholder{color:var(--dim);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .sheet-actions button{flex:1; padding:13px; border-radius:10px; border:none; font-size:14px;
    font-weight:600; cursor:pointer; font-family:inherit; transition:.15s;}
  .btn-cancel{background:var(--card2); color:var(--mut); border:1px solid var(--line) !important;}
  .btn-cancel:hover{color:var(--ink);}
  .btn-save{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff;}
  .btn-save:hover{opacity:.9;}

  .estufa-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .estufa-chip{width:46px; height:46px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:600; color:var(--mut); cursor:pointer; user-select:none; transition:.15s;}
  .estufa-chip:hover{border-color:var(--leaf); color:var(--ink);}
  .estufa-chip.sel{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff; border-color:transparent;
    box-shadow:0 4px 12px rgba(61,122,92,.35);}

  .litros-grid{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .litros-row{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line);
    border-radius:10px; padding:10px 14px;}
  .litros-row label{flex:0 0 70px; font-size:13px; font-weight:600; color:var(--lime);}
  .litros-row input{flex:1; padding:8px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; background:var(--card); color:var(--ink); font-family:inherit;}
  .litros-row input:focus{outline:none; border-color:var(--leaf);}
  .litros-total{display:flex; justify-content:space-between; align-items:center; padding:12px 14px;
    background:rgba(61,122,92,.1); border:1px solid rgba(61,122,92,.2); border-radius:10px; margin-top:4px;}
  .litros-total span{font-size:13px; color:var(--mut);}
  .litros-total b{font-size:18px; color:var(--lime); font-weight:700;}

  .prod-row{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;}
  .prod-row-top{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .prod-row-top input{flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; background:var(--card); color:var(--ink); font-family:inherit;}
  .prod-row-top input:focus{outline:none; border-color:var(--leaf);}
  .rm-row{flex:0 0 auto; width:34px; height:34px; border:none; background:rgba(224,120,95,.15);
    color:var(--red); border-radius:8px; font-size:18px; cursor:pointer; transition:.15s;}
  .rm-row:hover{background:rgba(224,120,95,.25);}
  .prod-row-bottom{display:flex; gap:8px; align-items:center;}
  .prod-row-bottom input.dose100-input{flex:0 0 80px; padding:9px 12px; border:1px solid var(--line);
    border-radius:8px; font-size:14px; background:var(--card); color:var(--ink); font-family:inherit;}
  .prod-row-bottom input.dose100-input:focus{outline:none; border-color:var(--leaf);}
  .prod-row-bottom select.unidade-input{flex:0 0 70px; padding:9px 8px; border:1px solid var(--line);
    border-radius:8px; font-size:13px; background:var(--card); color:var(--ink); font-family:inherit;}
  .prod-calc{flex:1; font-size:12px; color:var(--lime); font-weight:600; text-align:right; line-height:1.4;}
  .add-row{width:100%; padding:10px; border:1px dashed var(--line); border-radius:10px;
    background:transparent; color:var(--mut); font-size:13px; font-weight:600; cursor:pointer;
    font-family:inherit; transition:.15s; margin-bottom:14px;}
  .add-row:hover{border-color:var(--leaf); color:var(--lime); background:rgba(61,122,92,.05);}

  @media (max-width:600px){
    .page{padding:24px 14px 80px;}
    .hdr h1{font-size:22px;}
    .row2{flex-direction:column;}
    .prod-row-bottom{flex-wrap:wrap;}
    .prod-calc{flex:1 1 100%; text-align:left; margin-top:4px;}
  }
</style>

<script src="config.js"></script>
<datalist id="dlEstoque"></datalist>
<script>
let dados = [];
let filtro = 'pendente';
let filtroEstufa = 'todas';
let editandoId = null;
let estufasSelecionadas = new Set();
let litrosPorEstufa = {};
let prodRowCount = 0;

// ===== Helpers =====
const num = v => { const n = parseFloat(String(v??'').replace(',','.')); return isNaN(n)?0:n; };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => (Math.round(n*100)/100).toString().replace('.',',');
const hojeISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function fmtData(v){
  if(!v) return '—';
  const s = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(s) return s[3]+'/'+s[2]+'/'+s[1];
  return String(v);
}
function dataParaISO(v){
  if(!v) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  const d = new Date(v);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return String(v);
}

// ===== Estoque =====
async function baixarEstoque(produtoNome, quantidade, unidade, origem, origemId, obs) {
  try {
    const qtd = num(quantidade);
    if (!produtoNome || !qtd || qtd <= 0) return;
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({
      action: 'movimentar',
      data: { produtoNome, tipo: 'saida', quantidade: qtd, unidade: unidade || '',
              origem: origem || 'manual', origemId: origemId || '', obs: obs || '' }
    })});
    const j = await r.json().catch(()=>null);
    if (j && j.aviso) alert('Atenção no estoque (' + produtoNome + '): ' + j.aviso);
  } catch(e) { console.warn('Falha ao dar baixa no estoque:', produtoNome, e); }
}

async function carregarNomesEstoque(){
  try{
    const arr = (typeof buscarTipo === 'function') ? await buscarTipo('estoque') : ((await (await fetch(`${API_URL}?tipo=estoque`)).json()).data || []);
    const dl = document.getElementById('dlEstoque');
    if(dl) dl.innerHTML = arr.map(p => `<option value="${esc(p.nome)}">`).join('');
  }catch(e){}
}
carregarNomesEstoque();

// ===== Carregamento =====
async function carregar(){
  try {
    if (typeof cacheLerTipo === 'function') {
      const c = cacheLerTipo('pulverizacao');
      if (c && c.length) { dados = c.sort((a,b)=> new Date(b.dataCriacao) - new Date(a.dataCriacao)); render(); }
      else document.getElementById('list').innerHTML = '<div class="loading">Carregando…</div>';
    } else document.getElementById('list').innerHTML = '<div class="loading">Carregando…</div>';
  } catch (e) {}
  try{
    const arr = (typeof buscarTipo === 'function') ? await buscarTipo('pulverizacao') : ((await (await fetch(`${API_URL}?tipo=pulverizacao`)).json()).data || []);
    dados = (arr || []).sort((a,b)=> new Date(b.dataCriacao) - new Date(a.dataCriacao));
    render();
  }catch(e){
    const c = (typeof cacheLerTipo === 'function') ? cacheLerTipo('pulverizacao') : null;
    if (c && c.length) { dados = c; render(); return; }
    document.getElementById('list').innerHTML = '<div class="loading">Demorou demais. <a href="#" onclick="carregar();return false" style="color:var(--lime)">Tentar de novo</a></div>';
  }
}

// ===== Lógica =====
function isAtrasado(d){
  if(d.status === 'feito' || !d.dataPrevista) return false;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return new Date(d.dataPrevista + 'T00:00:00') < hoje;
}

function parseProdutos(d){
  if(!d.produto) return [];
  try{
    const parsed = JSON.parse(d.produto);
    if(Array.isArray(parsed)) return parsed;
  }catch(e){}
  return [{ nome: d.produto, dose: d.dose || '' }];
}

function estufasArray(d){
  const raw = d.estufa;
  if (raw === null || raw === undefined || raw === '') return [];
  const s = String(raw).trim();
  const mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (mIso) {
    const out = [];
    [parseInt(mIso[3], 10), parseInt(mIso[2], 10), parseInt(mIso[1].slice(2), 10)].forEach(n => {
      if (n >= 1 && n <= 7 && !out.includes(String(n))) out.push(String(n));
    });
    if (out.length) return out.sort((a, b) => a - b);
    return [];
  }
  return s.replace(/\./g, ',').split(',').map(x => x.trim()).filter(x => /^[1-7]$/.test(x)).sort((a, b) => a - b);
}

function parseLitrosPorEstufa(d){
  if(d.litrosPorEstufa){
    try{ return JSON.parse(d.litrosPorEstufa); }catch(e){}
  }
  // Compatível com registro antigo: litrosAgua único
  const estufas = estufasArray(d);
  const litros = num(d.litrosAgua);
  if(litros > 0 && estufas.length){
    const por = {};
    const igual = litros / estufas.length;
    estufas.forEach(e => por[e] = fmtN(igual));
    return por;
  }
  return {};
}

function calcProdutoPorEstufa(p, litros){
  const dose = num(p.dose100);
  const l = num(litros);
  if(!p.dose100 || dose <= 0 || l <= 0) return null;
  return (dose/100)*l;
}

// ===== Render =====
function itemCard(d){
  const atrasado = isAtrasado(d);
  const statusLabel = d.status === 'feito' ? 'Feito' : (atrasado ? 'Atrasado' : 'Pendente');
  const statusClass = d.status === 'feito' ? 'feito' : (atrasado ? 'atrasado' : 'pendente');
  const produtos = parseProdutos(d);
  const estufas = estufasArray(d);
  const litrosMap = parseLitrosPorEstufa(d);
  const badgeTxt = estufas.length > 1 ? `Estufas ${estufas.join(', ')}` : `Estufa ${estufas[0] || '?'}`;
  const tituloProdutos = produtos.length ? produtos.map(p => esc(p.nome)).join(' + ') : '(produto não informado)';

  // Calcula total de água
  const totalAgua = estufas.reduce((s,e) => s + num(litrosMap[e]), 0);

  // Lista de produtos com cálculo por estufa
  let listaProdutos = '';
  if(produtos.length){
    listaProdutos = '<ul class="prod-list">' + produtos.map(p => {
      let doseTxt = '';
      if(p.dose100 !== undefined && p.dose100 !== ''){
        doseTxt = `${esc(p.dose100)} ${p.unidade || ''}/100L`;
      } else if(p.dose){
        doseTxt = esc(p.dose);
      }

      // Calcula por estufa
      let detalhe = '';
      if(p.dose100 && estufas.length > 1){
        const partes = estufas.map(e => {
          const t = calcProdutoPorEstufa(p, litrosMap[e]);
          return t ? `E${e}: ${fmtN(t)} ${p.unidade||''}` : null;
        }).filter(Boolean);
        if(partes.length) detalhe = partes.join(' · ');
      }

      // Total geral
      const totalGeral = totalAgua > 0 ? calcProdutoPorEstufa(p, totalAgua) : null;
      const totalTxt = totalGeral ? `<span class="p-total">Total: ${fmtN(totalGeral)} ${p.unidade||''}</span>` : '';

      return `<li>
        <span class="p-nome">${esc(p.nome)}</span>
        <span class="p-dose">${doseTxt}${detalhe ? '<br>'+detalhe : ''}${totalTxt}</span>
      </li>`;
    }).join('') + '</ul>';
  }

  // Litros por estufa (se múltiplas)
  let litrosTxt = '';
  if(estufas.length > 1 && totalAgua > 0){
    const partes = estufas.map(e => `E${e}: ${fmtN(num(litrosMap[e]))} L`).join(' · ');
    litrosTxt = `<p>💧 Água: ${partes} = <b>${fmtN(totalAgua)} L</b></p>`;
  } else if(totalAgua > 0){
    litrosTxt = `<p>💧 Água usada: ${fmtN(totalAgua)} L</p>`;
  }

  return `
    <div class="item">
      <div class="item-top">
        <div><span class="badge">${badgeTxt}</span></div>
        <span class="status ${statusClass}">${statusLabel}</span>
      </div>
      <h3>${tituloProdutos}</h3>
      ${listaProdutos}
      ${litrosTxt}
      ${d.alvo ? `<p>Alvo: ${esc(d.alvo)}</p>` : ''}
      ${d.obs ? `<p>${esc(d.obs)}</p>` : ''}
      <div class="meta">${d.status === 'feito' ? (d.dataExecucao ? 'Feito em ' + fmtData(d.dataExecucao) : '') : (d.dataPrevista ? 'Previsto para ' + fmtData(d.dataPrevista) : 'Sem data definida')}</div>
      <div class="actions">
        ${d.status !== 'feito' ? `<button class="btn-done" onclick="marcarFeito('${d.id}')">Marcar como feito</button>` : ''}
        <button class="btn-edit" onclick="editarItem('${d.id}')">Editar</button>
        <button class="btn-del" onclick="excluir('${d.id}')">Excluir</button>
      </div>
    </div>
  `;
}

function render(){
  const list = document.getElementById('list');
  let itens = dados.filter(d => d.status === filtro);
  if(filtroEstufa !== 'todas') itens = itens.filter(d => estufasArray(d).includes(filtroEstufa));

  if(itens.length === 0){
    list.innerHTML = '<div class="empty">Nada por aqui.</div>';
    return;
  }

  if(filtro === 'feito'){
    itens = itens.sort((a,b) => new Date(b.dataExecucao||b.dataCriacao) - new Date(a.dataExecucao||a.dataCriacao));
    list.innerHTML = itens.map(itemCard).join('');
    return;
  }

  itens = itens.sort((a,b) => {
    if(!a.dataPrevista) return 1;
    if(!b.dataPrevista) return -1;
    return new Date(a.dataPrevista) - new Date(b.dataPrevista);
  });
  let html = '';
  let grupoAtual = null;
  itens.forEach(d => {
    const chave = d.dataPrevista || 'sem-data';
    if(chave !== grupoAtual){
      grupoAtual = chave;
      const titulo = d.dataPrevista ? fmtData(d.dataPrevista) : 'Sem data definida';
      html += `<div class="group-header">${titulo}</div>`;
    }
    html += itemCard(d);
  });
  list.innerHTML = html;
}

// ===== Tabs =====
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  filtro = t.dataset.f;
  render();
}));

document.getElementById('filtroEstufaSel').addEventListener('change', (e) => {
  filtroEstufa = e.target.value;
  render();
});

// ===== Estufas no form =====
document.querySelectorAll('#estufaGrid .estufa-chip').forEach(chip => chip.addEventListener('click', () => {
  const e = chip.dataset.e;
  if(estufasSelecionadas.has(e)){ estufasSelecionadas.delete(e); chip.classList.remove('sel'); }
  else { estufasSelecionadas.add(e); chip.classList.add('sel'); }
  atualizarCamposLitros();
}));

function setEstufasSelecionadas(lista){
  estufasSelecionadas = new Set(lista);
  document.querySelectorAll('#estufaGrid .estufa-chip').forEach(chip => {
    chip.classList.toggle('sel', estufasSelecionadas.has(chip.dataset.e));
  });
  atualizarCamposLitros();
}

// ===== Campos de litros por estufa =====
function atualizarCamposLitros(){
  const grid = document.getElementById('litrosGrid');
  const field = document.getElementById('litrosField');
  const lista = Array.from(estufasSelecionadas).sort((a,b) => a-b);

  if(lista.length === 0){
    field.style.display = 'none';
    return;
  }
  field.style.display = '';

  // Mantém valores já digitados
  const antigos = {...litrosPorEstufa};
  litrosPorEstufa = {};
  lista.forEach(e => {
    litrosPorEstufa[e] = antigos[e] || '';
  });

  grid.innerHTML = lista.map(e => `
    <div class="litros-row">
      <label>Estufa ${e}</label>
      <input type="number" step="any" inputmode="decimal" data-e="${e}"
        placeholder="litros" value="${litrosPorEstufa[e] || ''}"
        oninput="onLitrosInput(this)">
    </div>
  `).join('');

  atualizarTotalLitros();
  atualizarTotaisProdutos();
}

function onLitrosInput(input){
  const e = input.dataset.e;
  litrosPorEstufa[e] = input.value;
  atualizarTotalLitros();
  atualizarTotaisProdutos();
}

function atualizarTotalLitros(){
  const total = Object.values(litrosPorEstufa).reduce((s,v) => s + num(v), 0);
  document.getElementById('litrosTotal').textContent = fmtN(total) + ' L';
}

// ===== Produtos =====
function addProdutoRow(nome, dose100, unidade){
  prodRowCount++;
  const id = 'row' + prodRowCount;
  const wrap = document.getElementById('produtosList');
  const row = document.createElement('div');
  row.className = 'prod-row';
  row.id = id;
  const un = unidade || 'mL';
  row.innerHTML = `
    <div class="prod-row-top">
      <input type="text" class="nome-input" list="dlEstoque" placeholder="Produto (ex: Amistar Top)" value="${nome ? esc(nome) : ''}" autocomplete="off">
      <button type="button" class="rm-row" onclick="removeProdutoRow('${id}')">×</button>
    </div>
    <div class="prod-row-bottom">
      <input type="number" step="any" inputmode="decimal" class="dose100-input" placeholder="Dose/100L" value="${dose100 !== undefined && dose100 !== '' ? esc(String(dose100)) : ''}">
      <select class="unidade-input">
        <option value="mL" ${un==='mL'?'selected':''}>mL</option>
        <option value="g" ${un==='g'?'selected':''}>g</option>
        <option value="L" ${un==='L'?'selected':''}>L</option>
        <option value="kg" ${un==='kg'?'selected':''}>kg</option>
      </select>
      <span class="prod-calc"></span>
    </div>
  `;
  wrap.appendChild(row);
  atualizarTotaisProdutos();
}
function removeProdutoRow(id){
  const row = document.getElementById(id);
  if(row) row.remove();
  if(document.querySelectorAll('#produtosList .prod-row').length === 0) addProdutoRow();
}
function resetProdutosRows(){
  document.getElementById('produtosList').innerHTML = '';
  prodRowCount = 0;
  addProdutoRow();
  addProdutoRow();
  addProdutoRow();
}

function atualizarTotaisProdutos(){
  const totalAgua = Object.values(litrosPorEstufa).reduce((s,v) => s + num(v), 0);
  const lista = Array.from(estufasSelecionadas).sort((a,b) => a-b);

  document.querySelectorAll('#produtosList .prod-row').forEach(row => {
    const dose = num(row.querySelector('.dose100-input').value);
    const unidade = row.querySelector('.unidade-input').value;
    const calcEl = row.querySelector('.prod-calc');

    if(dose <= 0 || totalAgua <= 0){
      calcEl.textContent = '';
      return;
    }

    if(lista.length <= 1){
      const t = (dose/100)*totalAgua;
      calcEl.textContent = `= ${fmtN(t)} ${unidade}`;
    } else {
      const partes = lista.map(e => {
        const l = num(litrosPorEstufa[e]);
        const t = l > 0 ? (dose/100)*l : 0;
        return `E${e}: ${fmtN(t)}`;
      });
      const total = (dose/100)*totalAgua;
      calcEl.innerHTML = `${partes.join(' · ')}<br><b>Total: ${fmtN(total)} ${unidade}</b>`;
    }
  });
}

document.getElementById('produtosList').addEventListener('input', atualizarTotaisProdutos);
document.getElementById('produtosList').addEventListener('change', atualizarTotaisProdutos);

// ===== Form =====
function openForm(){
  editandoId = null;
  document.getElementById('dlgTitle').textContent = 'Nova pulverização';
  document.getElementById('fStatus').value='pendente';
  document.getElementById('fAlvo').value='';
  document.getElementById('fData').value=hojeISO();
  document.getElementById('fObs').value='';
  litrosPorEstufa = {};
  setEstufasSelecionadas(['1']);
  resetProdutosRows();
  document.getElementById('dialog').showModal();
}

function editarItem(id){
  const d = dados.find(x => x.id === id);
  if(!d) return;
  editandoId = id;
  document.getElementById('dlgTitle').textContent = 'Editar pulverização';
  document.getElementById('fStatus').value = d.status || 'pendente';
  document.getElementById('fAlvo').value = d.alvo || '';
  const status = d.status || 'pendente';
  let dataOriginal = '';
  if(status === 'feito' && d.dataExecucao) dataOriginal = dataParaISO(d.dataExecucao);
  if(status !== 'feito' && d.dataPrevista) dataOriginal = dataParaISO(d.dataPrevista);
  document.getElementById('fData').value = dataOriginal || hojeISO();
  document.getElementById('fObs').value = d.obs || '';

  // Litros por estufa
  litrosPorEstufa = parseLitrosPorEstufa(d);
  setEstufasSelecionadas(estufasArray(d));

  // Produtos
  document.getElementById('produtosList').innerHTML = '';
  prodRowCount = 0;
  const produtos = parseProdutos(d);
  if(produtos.length){
    produtos.forEach(p => {
      if(p.dose100 !== undefined){
        addProdutoRow(p.nome, p.dose100, p.unidade);
      } else {
        const m = String(p.dose || '').match(/([\d.,]+)\s*([a-zA-Zµ]+)/);
        if(m) addProdutoRow(p.nome, m[1].replace(',', '.'), m[2].toLowerCase().startsWith('kg') ? 'kg' : m[2].toLowerCase().startsWith('l') ? 'L' : m[2].toLowerCase().startsWith('g') ? 'g' : 'mL');
        else addProdutoRow(p.nome, '', 'mL');
      }
    });
  } else {
    addProdutoRow();
  }
  addProdutoRow();

  document.getElementById('dialog').showModal();
}

function closeForm(){ document.getElementById('dialog').close(); }

async function salvar(){
  if(estufasSelecionadas.size === 0){ alert('Selecione ao menos uma estufa.'); return; }
  const lista = Array.from(estufasSelecionadas).sort((a,b) => a-b);

  // Valida litros
  const temLitros = lista.some(e => num(litrosPorEstufa[e]) > 0);
  if(!temLitros){ alert('Informe o volume de água de pelo menos uma estufa.'); return; }

  let rawData = document.getElementById('fData').value;
  if(rawData && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(rawData)){
    const m = rawData.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    rawData = `${m[3]}-${m[2]}-${m[1]}`;
  }
  const data = rawData || '';
  const statusVal = document.getElementById('fStatus').value;

  const totalAgua = Object.values(litrosPorEstufa).reduce((s,v) => s + num(v), 0);

  const produtos = Array.from(document.querySelectorAll('#produtosList .prod-row')).map(row => ({
    nome: row.querySelector('.nome-input').value.trim(),
    dose100: row.querySelector('.dose100-input').value.trim(),
    unidade: row.querySelector('.unidade-input').value
  })).filter(p => p.nome);

  const campos = {
    estufa: lista.join(','),
    produto: JSON.stringify(produtos),
    alvo: document.getElementById('fAlvo').value,
    dose: '',
    litrosAgua: fmtN(totalAgua),
    litrosPorEstufa: JSON.stringify(litrosPorEstufa),
    obs: document.getElementById('fObs').value,
    status: statusVal,
    dataPrevista: statusVal === 'pendente' ? data : '',
    dataExecucao: statusVal === 'feito' ? data : ''
  };

  closeForm();
  let origemId = editandoId;

  if(editandoId){
    await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'update', id: editandoId, data: campos})});
  } else {
    try {
      const resp = await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'add', data: campos})});
      origemId = (await resp.json()).id || null;
    } catch(e) {
      await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'add', data: campos})});
    }
  }

  // Baixa no estoque (só ao salvar como feito E não era feito antes)
  const eraFeito = editandoId ? (dados.find(x=>x.id===editandoId)||{}).status === 'feito' : false;
  if(statusVal === 'feito' && !eraFeito){
    for(const p of produtos){
      const dose100 = num(p.dose100);
      if(dose100 > 0 && totalAgua > 0){
        const gasto = (dose100/100)*totalAgua;
        await baixarEstoque(p.nome, gasto, p.unidade, 'pulverizacao', origemId,
          `Pulverizacao estufa(s) ${campos.estufa} - ${fmtN(totalAgua)}L agua`);
      }
    }
  }

  carregar();
}

async function marcarFeito(id){
  const d = dados.find(x => x.id === id);
  await fetch(API_URL, {method:'POST', body: JSON.stringify({
    tipo:'pulverizacao', action:'update', id,
    data:{ status:'feito', dataExecucao: hojeISO() }
  })});
  if(d){
    const produtos = parseProdutos(d);
    const litrosMap = parseLitrosPorEstufa(d);
    const totalAgua = Object.values(litrosMap).reduce((s,v) => s + num(v), 0);
    for(const p of produtos){
      const dose100 = num(p.dose100);
      if(dose100 > 0 && totalAgua > 0){
        await baixarEstoque(p.nome, (dose100/100)*totalAgua, p.unidade || 'mL', 'pulverizacao', id,
          `Pulverizacao estufa(s) ${d.estufa}`);
      }
    }
  }
  carregar();
}

async function excluir(id){
  const d = dados.find(x => x.id === id);
  if(!d) return;
  if(!confirm('Excluir este registro?')) return;

  // Se era feito, devolve o produto ao estoque
  if(d.status === 'feito'){
    const produtos = parseProdutos(d);
    const litrosMap = parseLitrosPorEstufa(d);
    const totalAgua = Object.values(litrosMap).reduce((s,v) => s + num(v), 0);
    for(const p of produtos){
      const dose100 = num(p.dose100);
      if(dose100 > 0 && totalAgua > 0){
        const gasto = (dose100/100)*totalAgua;
        try{
          await fetch(API_URL, { method:'POST', body: JSON.stringify({
            action:'movimentar',
            data:{ produtoNome: p.nome, tipo:'entrada', quantidade: gasto,
                   unidade: p.unidade || 'mL', origem:'pulverizacao', origemId: id,
                   obs:'Devolução - exclusão de pulverização' }
          })});
        }catch(e){}
      }
    }
  }

  await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'delete', id})});
  carregar();
}

carregar();
</script>
