<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hábitos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0F14">
<link rel="apple-touch-icon" href="ícone-192.png">
<link rel="icon" href="ícone-192.png">
<link rel="manifest" href="manifesto.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ESTUFAOS HÁBITOS — DESIGN SYSTEM "DARK PREMIUM"
   ============================================================ */
:root{
  --bg:#0B0F14;
  --sidebar:#101720;
  --card:#151E29;
  --card-2:#1B2633;
  --card-3:#223041;
  --border:#263342;
  --border-soft:#1F2B38;
  --text:#F1F5F9;
  --text-dim:#94A3B8;
  --text-faint:#64748B;
  --green:#22C55E;
  --green-2:#4ADE80;
  --green-soft:rgba(34,197,94,.14);
  --blue:#3B82F6;
  --blue-soft:rgba(59,130,246,.14);
  --purple:#A78BFA;
  --purple-soft:rgba(167,139,250,.14);
  --red:#F87171;
  --red-soft:rgba(248,113,113,.12);
  --amber:#FBBF24;
  --amber-soft:rgba(251,191,36,.12);
  --on-green:#052E16;
  --fisico:#22C55E;
  --disciplina:#94A3B8;
  --mental:#A78BFA;
  --intelecto:#FBBF24;
  --produtividade:#3B82F6;
  --financeiro:#FB923C;
  --r-xs:7px; --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:22px;
  --sh:0 1px 2px rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.55);
  --sh-lg:0 2px 4px rgba(0,0,0,.3), 0 20px 48px -16px rgba(0,0,0,.65);
  --side-w:252px;
  --side-w-c:74px;
  --top-h:66px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;}
html{background:var(--bg);height:100%;overscroll-behavior-y:none;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100%;overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input,select,textarea{-webkit-user-select:text;user-select:text;}
::selection{background:rgba(34,197,94,.3);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2A3949;border-radius:99px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:#38495e;}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;}

/* ============ LAYOUT ============ */
.app{min-height:100vh;}
.main{min-width:0;transition:margin-left .28s var(--ease);}
.wrap{max-width:1240px;margin:0 auto;padding:26px 30px 60px;}

/* ============ SIDEBAR ============ */
.side-nav{
  display:none;position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:60;
  flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border-soft);
  padding:20px 14px 16px;transition:width .28s var(--ease);overflow:hidden;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px;flex-shrink:0;}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#22C55E,#15803D);
  color:#052E16;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.05rem;box-shadow:0 6px 16px -6px rgba(34,197,94,.55);
}
.brand-text{font-weight:800;font-size:1rem;letter-spacing:.01em;line-height:1.15;white-space:nowrap;}
.brand-text small{display:block;font-size:.62rem;font-weight:600;color:var(--text-faint);letter-spacing:.14em;text-transform:uppercase;margin-top:2px;}
.nav-group{display:flex;flex-direction:column;gap:3px;}
.nav-label{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);padding:14px 10px 7px;white-space:nowrap;}
.side-nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-dim);
  padding:10px 11px;border-radius:var(--r-sm);font-size:.9rem;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:background .16s,color .16s;position:relative;
}
.side-nav button:hover{background:var(--card-2);color:var(--text);}
.side-nav button.active{background:var(--green-soft);color:var(--green);}
.side-nav button.active::before{
  content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
  background:var(--green);border-radius:0 3px 3px 0;
}
.side-nav .ic{flex-shrink:0;}
.side-foot{margin-top:auto;font-size:.66rem;color:var(--text-faint);padding:12px 10px 0;border-top:1px solid var(--border-soft);line-height:1.55;white-space:nowrap;overflow:hidden;}
.side-collapse{
  position:absolute;top:24px;right:-1px;transform:translateX(50%);
  width:22px;height:22px;border-radius:50%;border:1px solid var(--border);
  background:var(--card-2);color:var(--text-dim);font-size:.62rem;cursor:pointer;
  display:none;align-items:center;justify-content:center;z-index:61;padding:0;line-height:1;
}
.side-collapse:hover{color:var(--green);border-color:var(--green);}
@media(min-width:1000px){
  .side-nav{display:flex;}
  .side-collapse{display:flex;}
  .main{margin-left:var(--side-w);}
  body.side-collapsed .side-nav{width:var(--side-w-c);padding-left:10px;padding-right:10px;}
  body.side-collapsed .main{margin-left:var(--side-w-c);}
  body.side-collapsed .brand-text,
  body.side-collapsed .nav-label,
  body.side-collapsed .side-nav button span,
  body.side-collapsed .side-foot{opacity:0;visibility:hidden;}
  body.side-collapsed .side-nav button{justify-content:center;padding:11px 0;}
  body.side-collapsed .brand{justify-content:center;padding-left:0;padding-right:0;}
  body.side-collapsed .brand-mark{width:36px;height:36px;}
}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:40;height:var(--top-h);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 30px;background:rgba(11,15,20,.86);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft);
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
.topbar-title{font-size:1.02rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:.74rem;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub .g-accent{color:var(--green);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:linear-gradient(135deg,var(--card-3),var(--card-2));
  border:1px solid var(--border);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:700;transition:border-color .16s,transform .16s;
}
.avatar:hover{border-color:var(--green);transform:scale(1.05);}
.avatar.lg{width:56px;height:56px;font-size:1.15rem;}
.brand-mobile{display:none;align-items:center;gap:9px;font-weight:800;font-size:.95rem;}
.brand-mobile .brand-mark{width:30px;height:30px;font-size:.85rem;border-radius:9px;}

/* ============ BOTTOM NAV (mobile) ============ */
.bottom-nav{
  display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(16,23,32,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--border-soft);
  padding:.5rem .4rem calc(.5rem + env(safe-area-inset-bottom));
}
.bottom-nav button{
  flex:1;background:none;border:none;color:var(--text-faint);
  padding:.4rem .1rem;border-radius:12px;font-size:.6rem;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  transition:color .16s,background .16s;min-height:52px;justify-content:center;
}
.bottom-nav button .ic{width:19px;height:19px;}
.bottom-nav button.active{color:var(--green);background:var(--green-soft);}
@media(max-width:999px){
  .bottom-nav{display:flex;}
  .brand-mobile{display:flex;}
  .wrap{padding:20px 16px calc(86px + env(safe-area-inset-bottom));}
  .topbar{padding:0 16px;height:60px;}
}

/* ============ GRID ============ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start;}
.grid-23{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start;}
.grid-32{display:grid;grid-template-columns:1fr 1.6fr;gap:20px;align-items:start;}
.col{display:flex;flex-direction:column;gap:20px;min-width:0;}
.col-tight{gap:14px;}
@media(max-width:1180px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-23,.grid-32{grid-template-columns:1fr;}
}
@media(max-width:860px){
  .grid-2,.grid-3{grid-template-columns:1fr;}
}

/* ============ CARD ============ */
.card{
  background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg);
  padding:20px 22px 22px;margin-bottom:0;box-shadow:var(--sh);
  animation:fadeUp .4s var(--ease) both;
}
.card.pad-0{padding:0;overflow:hidden;}
.card.flat{box-shadow:none;background:var(--card-2);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.card-title{
  display:flex;align-items:center;gap:.5rem;font-size:.7rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);
}
.card-title .ic{color:var(--green);width:15px;height:15px;}
.card-title .ic.dim{color:var(--text-faint);}
.card-count{font-size:.76rem;color:var(--text-faint);font-weight:600;white-space:nowrap;}
.card-link{background:none;border:none;color:var(--green);font-size:.78rem;font-weight:700;cursor:pointer;padding:4px 0;}
.card-link:hover{text-decoration:underline;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:6px 0 16px;flex-wrap:wrap;}
.section-head h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;}
.section-head p{font-size:.82rem;color:var(--text-faint);margin-top:3px;}
.section-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.eyebrow{font-size:.64rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin-bottom:6px;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 18px;border-radius:var(--r-sm);border:1px solid transparent;
  font-size:.87rem;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:background .16s,border-color .16s,color .16s,transform .12s,box-shadow .16s;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--green);color:var(--on-green);box-shadow:0 6px 18px -8px rgba(34,197,94,.6);}
.btn-primary:hover{background:var(--green-2);box-shadow:0 8px 22px -8px rgba(34,197,94,.7);}
.btn-ghost{background:var(--card-2);border-color:var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--text-faint);background:var(--card-3);}
.btn-soft{background:var(--green-soft);border-color:rgba(34,197,94,.3);color:var(--green);}
.btn-soft:hover{background:rgba(34,197,94,.22);}
.btn-danger{background:transparent;border-color:rgba(248,113,113,.4);color:var(--red);}
.btn-danger:hover{background:var(--red-soft);border-color:var(--red);}
.btn-blue{background:var(--blue-soft);border-color:rgba(59,130,246,.35);color:#93C5FD;}
.btn-blue:hover{background:rgba(59,130,246,.24);}
.btn-lg{height:48px;padding:0 26px;font-size:.95rem;border-radius:12px;}
.btn-block{width:100%;}
.btn-icon{
  width:38px;height:38px;padding:0;border-radius:var(--r-sm);
  background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:color .16s,border-color .16s,background .16s;
}
.btn-icon:hover{color:var(--text);border-color:var(--text-faint);}
.btn-icon.danger:hover{color:var(--red);border-color:var(--red);}
.btn-sm{height:32px;padding:0 13px;font-size:.78rem;border-radius:8px;}
.add-row{display:flex;gap:.6rem;margin-bottom:.75rem;flex-wrap:wrap;}
.add-row input[type=text],.add-row input[type=time],.add-row input[type=number]{
  flex:1;min-width:0;background:var(--card-2);border:1px solid var(--border);color:var(--text);
  padding:.68rem .9rem;border-radius:var(--r-sm);font-size:.9rem;font-family:inherit;
  transition:border-color .16s,box-shadow .16s;
}
.add-row input::placeholder{color:var(--text-faint);}
.add-row input:focus,.add-row select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15);}
.add-row select{
  background:var(--card-2);border:1px solid var(--border);color:var(--text);
  padding:.68rem .7rem;border-radius:var(--r-sm);font-size:.84rem;font-family:inherit;max-width:150px;
}
.add-row button{height:40px;}
.big-btn{
  width:100%;background:var(--green);color:var(--on-green);border:none;border-radius:14px;
  padding:1.05rem;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 28px -10px rgba(34,197,94,.65);
  transition:transform .12s,background .16s,box-shadow .16s;
}
.big-btn:hover{background:var(--green-2);}
.big-btn:active{transform:scale(.98);}

/* ============ FORMS / TOGGLES ============ */
.type-toggle{display:flex;gap:.45rem;margin-bottom:.75rem;flex-wrap:wrap;}
.type-toggle button{
  flex:1;min-width:64px;background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);
  padding:.55rem .6rem;border-radius:var(--r-sm);font-size:.8rem;font-weight:600;cursor:pointer;
  transition:all .16s;
}
.type-toggle button:hover{color:var(--text);border-color:var(--text-faint);}
.type-toggle button.active{background:var(--green-soft);border-color:rgba(34,197,94,.45);color:var(--green);}
#day-pick button{padding:.55rem 0;font-size:.8rem;min-width:0;}
.modo-tip{font-size:.8rem;color:var(--text-dim);margin-top:.7rem;line-height:1.55;}
.extra-fields{display:flex;gap:.6rem;margin-bottom:.75rem;flex-wrap:wrap;}
.extra-fields input,.extra-fields select{
  background:var(--card-2);border:1px solid var(--border);color:var(--text);
  padding:.6rem .75rem;border-radius:var(--r-sm);font-size:.86rem;font-family:inherit;
}
.extra-fields input:focus,.extra-fields select:focus{outline:none;border-color:var(--green);}
.extra-fields input[type=time]{flex:1;min-width:110px;}
.extra-fields .qty-field{flex:1;min-width:120px;}
.extra-fields .qty-field input,.extra-fields .qty-field select{width:100%;}
.extra-fields select{width:100%;}
.field-label{font-size:.64rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700;display:block;margin-bottom:.3rem;}
.hidden{display:none !important;}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:18px;}
.chip{
  background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);
  padding:.44rem .95rem;border-radius:99px;font-size:.78rem;font-weight:600;cursor:pointer;
  transition:all .16s;display:inline-flex;align-items:center;gap:.4rem;
}
.chip:hover{color:var(--text);border-color:var(--text-faint);}
.chip.active{background:var(--green-soft);border-color:rgba(34,197,94,.45);color:var(--green);}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.period-toggle{display:flex;gap:.35rem;background:var(--card-2);padding:3px;border-radius:10px;border:1px solid var(--border);}
.period-toggle button{
  background:transparent;border:none;color:var(--text-dim);padding:.34rem .8rem;
  border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer;transition:all .16s;
}
.period-toggle button.active{background:var(--green);color:var(--on-green);}

/* ============ TASK ROWS / HABITS ============ */
.task-row{
  display:flex;align-items:center;gap:.75rem;padding:.72rem .7rem;border-radius:12px;
  cursor:pointer;transition:background .15s;border:1px solid transparent;
}
.task-row:hover{background:var(--card-2);border-color:var(--border-soft);}
.task-row.done{opacity:.62;}
.task-row.done:hover{opacity:.85;}
.checkbox{
  width:24px;height:24px;border-radius:8px;border:2px solid var(--text-faint);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .18s var(--ease);background:transparent;
}
.checkbox:hover{border-color:var(--green);}
.checkbox.done{background:var(--green);border-color:var(--green);box-shadow:0 4px 12px -4px rgba(34,197,94,.55);}
.checkbox.done i{color:var(--on-green);font-size:13px;font-style:normal;animation:pop .28s var(--ease);}
@keyframes pop{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
.task-main{flex:1;min-width:0;}
.task-name{font-size:.92rem;font-weight:600;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.task-row.done .task-name{color:var(--text-faint);text-decoration:line-through;text-decoration-color:var(--text-faint);}
.task-time{font-size:.7rem;color:var(--blue);font-weight:700;margin-top:2px;letter-spacing:.03em;}
.task-time.late{color:var(--red);}
.task-qty-bar{height:7px;background:var(--card-3);border-radius:99px;overflow:hidden;margin-top:.45rem;width:100%;}
.task-qty-fill{height:100%;background:linear-gradient(90deg,var(--blue),#60A5FA);border-radius:99px;transition:width .55s var(--ease);}
.task-qty-fill.g{background:linear-gradient(90deg,var(--green),var(--green-2));}
.task-qty-label{font-size:.7rem;color:var(--text-faint);margin-top:3px;font-weight:500;}
.task-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.qty-plus{
  background:var(--card-3);border:1px solid var(--border);color:var(--blue);
  width:30px;height:30px;border-radius:50%;font-size:1rem;font-weight:700;cursor:pointer;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.qty-plus:hover{background:var(--blue-soft);border-color:var(--blue);transform:scale(1.08);}
.row-actions{display:flex;gap:.2rem;flex-shrink:0;}
.del-x,.edit-x{
  background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:.85rem;
  padding:.3rem .38rem;border-radius:7px;visibility:hidden;transition:all .15s;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
}
.task-row:hover .del-x,.task-row:hover .edit-x{visibility:visible;}
.del-x:hover{color:var(--red);background:var(--red-soft);}
.edit-x:hover{color:var(--blue);background:var(--blue-soft);}
.more-toggle{text-align:center;color:var(--green);font-size:.8rem;font-weight:700;padding:.7rem 0 0;cursor:pointer;}
.more-toggle:hover{text-decoration:underline;}

/* ============ KPI / STATS ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;}
.stat-card{
  background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg);
  padding:18px 18px 16px;box-shadow:var(--sh);position:relative;overflow:hidden;
  animation:fadeUp .4s var(--ease) both;
}
.stat-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent,var(--green));opacity:.75;
}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.stat-ic{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft,var(--green-soft));color:var(--accent,var(--green));flex-shrink:0;
}
.stat-ic .ic{width:17px;height:17px;}
.stat-label{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);}
.stat-val{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--text);}
.stat-val small{font-size:.85rem;font-weight:700;color:var(--text-dim);margin-left:2px;}
.stat-sub{font-size:.72rem;color:var(--text-dim);margin-top:5px;display:flex;align-items:center;gap:5px;}
.stat-sub .up{color:var(--green);font-weight:700;}
.stat-sub .down{color:var(--red);font-weight:700;}
.kpi{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:.7rem .5rem;text-align:center;}
.kpi .lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--text-faint);margin-bottom:.25rem;}
.kpi .val{font-size:1.2rem;font-weight:800;}
.kpi .sub{font-size:.64rem;color:var(--text-dim);margin-top:.15rem;}

/* ============ RING ============ */
.ring{
  --p:0;--ring-c:var(--green);
  width:74px;height:74px;border-radius:50%;flex-shrink:0;position:relative;
  background:conic-gradient(var(--ring-c) calc(var(--p)*1%),var(--card-3) 0);
  display:flex;align-items:center;justify-content:center;
}
.ring::before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--card);}
.ring span{position:relative;font-size:.95rem;font-weight:800;letter-spacing:-.02em;}
.ring.sm{width:52px;height:52px;}
.ring.sm::before{inset:5px;}
.ring.sm span{font-size:.75rem;}
.ring.lg{width:96px;height:96px;}
.ring.lg::before{inset:9px;}
.ring.lg span{font-size:1.3rem;}
.ring.b{--ring-c:var(--blue);}
.ring.p{--ring-c:var(--purple);}

/* ============ BADGES ============ */
.badge{
  display:inline-flex;align-items:center;gap:.3rem;font-size:.66rem;font-weight:700;
  padding:.22rem .6rem;border-radius:99px;letter-spacing:.03em;white-space:nowrap;
}
.badge-green{background:var(--green-soft);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.badge-blue{background:var(--blue-soft);color:#93C5FD;border:1px solid rgba(59,130,246,.3);}
.badge-purple{background:var(--purple-soft);color:var(--purple);border:1px solid rgba(167,139,250,.3);}
.badge-red{background:var(--red-soft);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.badge-amber{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(251,191,36,.3);}
.badge-dim{background:var(--card-3);color:var(--text-dim);border:1px solid var(--border);}
.streak-pill{
  display:inline-flex;align-items:center;gap:.28rem;
  background:var(--amber-soft);border:1px solid rgba(251,191,36,.35);color:var(--amber);
  font-size:.64rem;font-weight:800;padding:.16rem .55rem;border-radius:99px;letter-spacing:.02em;
}
.streak-pill .ic{width:11px;height:11px;}

/* ============ INSIGHTS ============ */
.insight-line{
  display:flex;gap:.7rem;padding:.68rem 0;border-bottom:1px solid var(--border-soft);
  font-size:.85rem;line-height:1.55;color:var(--text-dim);
}
.insight-line:last-child{border-bottom:none;}
.insight-line b{color:var(--text);font-weight:700;}
.insight-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:.5rem;}
.empty-state{text-align:center;color:var(--text-dim);font-size:.88rem;padding:2rem 1rem;line-height:1.6;}
.empty-state .ic{width:34px;height:34px;color:var(--text-faint);margin-bottom:.6rem;}
.loading{color:var(--text-faint);text-align:center;padding:4rem 0;font-weight:600;}
.sec-empty{font-size:.8rem;color:var(--text-faint);text-align:center;padding:.7rem 0 .3rem;}

/* ============ HISTORY TABLE ============ */
.hist-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.hist{border-collapse:separate;border-spacing:0 3px;width:100%;min-width:340px;}
table.hist th{font-size:.6rem;color:var(--text-faint);font-weight:700;padding-bottom:.5rem;text-align:center;letter-spacing:.05em;}
table.hist th.today{color:var(--green);}
.hist-name{
  text-align:left !important;font-size:.8rem;font-weight:600;padding-right:.7rem !important;
  white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;color:var(--text-dim);
}
.hist-cell-wrap{padding:2px;}
.hist-cell{
  width:24px;height:24px;border-radius:7px;background:var(--card-2);border:1px solid var(--border);
  cursor:pointer;margin:0 auto;transition:all .15s;
}
.hist-cell:hover{border-color:var(--text-faint);transform:scale(1.1);}
.hist-cell.done{background:var(--green);border-color:var(--green);box-shadow:0 3px 8px -3px rgba(34,197,94,.5);}
.hist-cell.reduz{background:var(--blue);border-color:var(--blue);}
.hist-cell.rec{background:rgba(251,191,36,.3);border-color:var(--amber);}
.hist-cell.off{background:transparent;border-style:dashed;opacity:.35;cursor:default;}
.hist-cell.off:hover{transform:none;border-color:var(--border);}
.hist-cell.future{opacity:.25;cursor:default;}
.hist-cell.future:hover{transform:none;border-color:var(--border);}
.hist-cell.treino{position:relative;}
.hist-cell.treino::after{
  content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--blue);border:2px solid var(--card);
}

/* ============ RADAR / SCORES ============ */
.radar-wrap{display:flex;justify-content:center;margin:.6rem 0 .8rem;}
.score-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.7rem;}
.score-cell{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:.7rem .4rem;text-align:center;}
.score-cell .lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;margin-bottom:.25rem;}
.score-cell .val{font-size:1.2rem;font-weight:800;}

/* ============ EXEC ============ */
.exec-demo{font-size:3.2rem;text-align:center;margin:.3rem 0 .4rem;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4));}
.rest-num{font-size:4.4rem;font-weight:800;text-align:center;margin:.5rem 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.rest-num small{font-size:1.2rem;font-weight:700;color:var(--text-faint);}
.rest-flash{animation:flash .6s ease 3;}
@keyframes flash{50%{background:var(--green-soft);}}
.exec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.exec-step{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);}
.series-pills{display:flex;gap:7px;flex-wrap:wrap;margin:.8rem 0;}
.series-pill{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:800;background:var(--card-3);border:1.5px solid var(--border);
  color:var(--text-faint);transition:all .2s var(--ease);
}
.series-pill.done{background:var(--green);border-color:var(--green);color:var(--on-green);box-shadow:0 5px 14px -6px rgba(34,197,94,.6);}
.series-pill.now{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);animation:blink 1.6s ease infinite;}
.series-pill.skip{opacity:.4;text-decoration:line-through;}
@keyframes blink{50%{box-shadow:0 0 0 4px rgba(59,130,246,.18);}}
.exec-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.9rem 0;}
.exec-grid .qty-field{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:.7rem .8rem;}
.exec-grid .qty-field input{
  width:100%;background:transparent;border:none;color:var(--text);font-size:1.35rem;font-weight:800;
  padding:0;outline:none;font-variant-numeric:tabular-nums;
}
.exec-nav{display:flex;gap:.6rem;margin-top:.7rem;}
.exec-nav .btn{flex:1;}
.ex-status{display:flex;flex-direction:column;gap:.4rem;margin:.7rem 0;}
.ex-status-row{
  display:flex;align-items:center;gap:.65rem;padding:.5rem .65rem;border-radius:10px;
  background:var(--card-2);border:1px solid var(--border-soft);font-size:.8rem;
}
.ex-status-row .n{
  width:22px;height:22px;border-radius:7px;background:var(--card-3);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;color:var(--text-faint);
}
.ex-status-row.cur{border-color:rgba(59,130,246,.45);background:var(--blue-soft);}
.ex-status-row.cur .n{background:var(--blue);color:#fff;}
.ex-status-row.ok .n{background:var(--green);color:var(--on-green);}
.ex-status-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.ex-status-row .st{font-size:.68rem;font-weight:700;color:var(--text-faint);flex-shrink:0;}

/* ============ RPE ============ */
.rpe{display:flex;gap:.5rem;}
.rpe button{
  flex:1;background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);
  border-radius:11px;padding:.75rem 0;font-size:.95rem;font-weight:800;cursor:pointer;
  transition:all .16s;
}
.rpe button:hover{border-color:var(--text-faint);color:var(--text);}
.rpe button.on{background:var(--green-soft);border-color:var(--green);color:var(--green);}

/* ============ CALENDAR ============ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:.5rem;}
.cal-dow{font-size:.62rem;color:var(--text-faint);text-align:center;padding:.2rem 0;font-weight:700;letter-spacing:.06em;}
.cal-d{
  min-height:40px;border-radius:11px;background:var(--card-2);border:1px solid var(--border-soft);
  font-size:.76rem;display:flex;align-items:center;justify-content:center;color:var(--text-dim);
  cursor:pointer;transition:all .15s;position:relative;font-weight:600;
}
.cal-d:hover{border-color:var(--text-faint);color:var(--text);}
.cal-d.has{background:var(--green-soft);border-color:rgba(34,197,94,.4);color:var(--text);font-weight:800;}
.cal-d.treino{box-shadow:inset 0 -3px 0 var(--blue);}
.cal-d.ambos{background:linear-gradient(135deg,var(--green-soft),var(--blue-soft));border-color:rgba(34,197,94,.45);font-weight:800;}
.cal-d.sel{outline:2px solid var(--green);outline-offset:1px;}
.cal-d.out{opacity:.3;cursor:default;}
.cal-d.out:hover{border-color:var(--border-soft);color:var(--text-dim);}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:.8rem;font-size:.7rem;color:var(--text-faint);font-weight:600;}
.cal-legend span{display:inline-flex;align-items:center;gap:.4rem;}
.cal-legend i{width:11px;height:11px;border-radius:4px;display:inline-block;}

/* ============ CHARTS ============ */
.chart-box{background:var(--card-2);border:1px solid var(--border-soft);border-radius:14px;padding:.85rem .7rem .45rem;margin:.4rem 0 .3rem;}
.chart-box svg{display:block;width:100%;height:auto;}
.chart-cap{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.7rem;color:var(--text-faint);font-weight:600;padding:0 .4rem .5rem;}
.chart-cap b{color:var(--text);font-weight:700;}
.bar7{display:flex;align-items:flex-end;gap:7px;height:84px;margin:.6rem 0 .4rem;}
.bar7 .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;height:100%;justify-content:flex-end;}
.bar7 .b i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--green),#15803D);min-height:4px;opacity:.9;transition:height .55s var(--ease);}
.bar7 .b.off i{background:var(--card-3);}
.bar7 .b.treino i{background:linear-gradient(180deg,var(--blue),#1D4ED8);}
.bar7 .b span{font-size:.58rem;color:var(--text-faint);font-weight:700;}
.bar7 .b.hoje span{color:var(--green);}
.rsec{
  font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text-faint);margin:1.1rem 0 .5rem;display:flex;align-items:center;justify-content:space-between;
}
.rrow{display:flex;align-items:center;gap:.6rem;font-size:.8rem;margin-bottom:.45rem;color:var(--text-dim);}
.rrow .rn{flex:0 0 92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.76rem;}
.rrow .rbar{flex:1;height:9px;background:var(--card-3);border-radius:99px;overflow:hidden;}
.rrow .rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-2));border-radius:99px;transition:width .55s var(--ease);}
.rrow .rv{flex:0 0 26px;text-align:right;font-weight:800;font-size:.78rem;color:var(--text);}

/* ============ GOTO / PENDING ============ */
.goto-row{display:flex;gap:.6rem;margin-top:.9rem;}
.goto-row button{flex:1;height:40px;}
.pending-list .task-row{padding-left:.35rem;padding-right:.35rem;}

/* ============ MODAL / TOOLTIP ============ */
.modal-back{
  position:fixed;inset:0;background:rgba(4,7,11,.72);backdrop-filter:blur(6px);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:1.2rem;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);
  max-width:440px;width:100%;padding:1.6rem;box-shadow:var(--sh-lg);
  animation:modalIn .3s var(--ease);max-height:88vh;overflow-y:auto;
}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:none;}}
.modal h3{font-size:1.05rem;font-weight:800;margin-bottom:.3rem;}
.modal p{font-size:.84rem;color:var(--text-dim);margin-bottom:1.1rem;line-height:1.55;}
.modal-actions{display:flex;gap:.6rem;margin-top:1.2rem;}
.modal-actions .btn{flex:1;}
[data-tip]{position:relative;}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#0A0E13;color:var(--text);font-size:.7rem;font-weight:600;padding:.4rem .7rem;
  border-radius:8px;white-space:nowrap;z-index:90;border:1px solid var(--border);
  box-shadow:var(--sh);pointer-events:none;
}

/* ============ SETUP OVERLAY ============ */
#setup-overlay .modal{max-width:400px;text-align:center;}
#setup-overlay h2{margin-bottom:.4rem;}
#setup-overlay p{margin-bottom:1.2rem;}

/* ============ HERO (dashboard) ============ */
.hero{
  background:
    radial-gradient(1000px 400px at 8% -20%,rgba(34,197,94,.14),transparent 60%),
    radial-gradient(800px 380px at 95% 10%,rgba(59,130,246,.12),transparent 55%),
    var(--card);
  border:1px solid var(--border-soft);border-radius:var(--r-xl);
  padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:22px;
  box-shadow:var(--sh);margin-bottom:20px;animation:fadeUp .4s var(--ease) both;flex-wrap:wrap;
}
.hero-greet{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;}
.hero-greet .hl{color:var(--green);}
.hero-date{font-size:.84rem;color:var(--text-dim);margin-top:5px;font-weight:500;}
.hero-phrase{
  display:inline-flex;align-items:center;gap:.5rem;margin-top:12px;font-size:.8rem;font-weight:600;
  color:var(--purple);background:var(--purple-soft);border:1px solid rgba(167,139,250,.3);
  padding:.42rem .9rem;border-radius:99px;
}
.hero-right{display:flex;align-items:center;gap:14px;}
.hero-user{text-align:right;}
.hero-user .nm{font-size:.95rem;font-weight:700;}
.hero-user .rl{font-size:.7rem;color:var(--text-faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

/* ============ CATEGORY SECTIONS (habits) ============ */
.cat-block{margin-bottom:22px;animation:fadeUp .4s var(--ease) both;}
.cat-head{
  display:flex;align-items:center;gap:.6rem;padding:.55rem .2rem .6rem;
  border-bottom:1px solid var(--border-soft);margin-bottom:.5rem;
}
.cat-head .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cat-head .cat-nm{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}
.cat-head .cat-meta{margin-left:auto;font-size:.7rem;color:var(--text-faint);font-weight:700;display:flex;gap:10px;align-items:center;}
.cat-head .cat-pct{color:var(--green);}
.cat-body{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:8px 10px;box-shadow:var(--sh);}
.cat-body .task-row + .task-row{border-top:1px solid var(--border-soft);}
.cat-body .task-row:first-child{border-top:none;}

/* ============ FICHA CARDS (treino) ============ */
.ficha-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
@media(max-width:860px){.ficha-grid{grid-template-columns:1fr;}}
.ficha-card{
  background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--sh);position:relative;overflow:hidden;
  transition:border-color .2s,transform .2s,box-shadow .2s;animation:fadeUp .4s var(--ease) both;
}
.ficha-card:hover{border-color:var(--border);transform:translateY(-2px);box-shadow:var(--sh-lg);}
.ficha-card.reco{border-color:rgba(34,197,94,.45);background:linear-gradient(160deg,rgba(34,197,94,.07),var(--card) 45%);}
.ficha-card.reco::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--green),var(--blue));
}
.ficha-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.ficha-nm{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;line-height:1.3;}
.ficha-meta{display:flex;gap:.45rem;flex-wrap:wrap;margin:8px 0 12px;}
.ficha-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.ficha-stat{background:var(--card-2);border:1px solid var(--border-soft);border-radius:10px;padding:.55rem .5rem;text-align:center;}
.ficha-stat .v{font-size:.95rem;font-weight:800;}
.ficha-stat .l{font-size:.58rem;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.ficha-exs{font-size:.74rem;color:var(--text-faint);line-height:1.55;margin-bottom:14px;}
.ficha-actions{display:flex;gap:.5rem;align-items:center;}
.ficha-actions .btn{flex:1;}
.ficha-actions .btn-icon{flex-shrink:0;}

/* ============ EXECUTE HERO ============ */
.ex-hero{
  background:
    radial-gradient(600px 240px at 50% -30%,rgba(59,130,246,.16),transparent 65%),
    var(--card);
  border:1px solid var(--border-soft);border-radius:var(--r-xl);padding:24px;
  box-shadow:var(--sh);animation:fadeUp .35s var(--ease) both;
}
.ex-prog{display:flex;align-items:center;gap:14px;margin:14px 0 6px;}
.ex-prog .bar{flex:1;height:9px;background:var(--card-3);border-radius:99px;overflow:hidden;}
.ex-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .55s var(--ease);}
.ex-prog .pct{font-size:.8rem;font-weight:800;color:var(--green);min-width:38px;text-align:right;}

/* ============ HISTORY SESSION ROW ============ */
.sess-row{
  background:var(--card);border:1px solid var(--border-soft);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .16s;
  animation:fadeUp .35s var(--ease) both;
}
.sess-row:hover{border-color:var(--border);background:var(--card-2);}
.sess-top{display:flex;align-items:center;gap:10px;}
.sess-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0;}
.sess-nm{font-size:.92rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sess-when{font-size:.72rem;color:var(--text-faint);font-weight:600;white-space:nowrap;}
.sess-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:.74rem;color:var(--text-dim);font-weight:600;}
.sess-stats b{color:var(--text);font-weight:700;}
.sess-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);}
.delta{font-size:.72rem;font-weight:700;margin-top:6px;}
.delta.pos{color:var(--green);}
.delta.neg{color:var(--red);}

/* ============ LEGEND / MISC ============ */
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.72rem;color:var(--text-faint);font-weight:600;margin-top:10px;}
.legend-row span{display:inline-flex;align-items:center;gap:.45rem;}
.legend-row i{width:12px;height:12px;border-radius:4px;display:inline-block;}
.divider{height:1px;background:var(--border-soft);margin:16px 0;}
.mt-0{margin-top:0;}
.mb-0{margin-bottom:0;}
.mt-1{margin-top:10px;}
.mt-2{margin-top:18px;}
.text-dim{color:var(--text-dim);}
.text-faint{color:var(--text-faint);}
.text-green{color:var(--green);}
.center{text-align:center;}
.w-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.w-row .grow{flex:1;min-width:160px;}
.sync-row{display:flex;gap:.6rem;flex-wrap:wrap;}
.sync-row .btn{flex:1;min-width:120px;}
.msg{font-size:.76rem;color:var(--text-faint);margin-top:.55rem;min-height:1.1em;font-weight:600;}
.msg.ok{color:var(--green);}
.msg.err{color:var(--red);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.name-card{
  display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border-soft);
  border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh);margin-bottom:20px;
  animation:fadeUp .4s var(--ease) both;flex-wrap:wrap;
}
.name-card .info{flex:1;min-width:200px;}
.name-card .info .t{font-size:1.05rem;font-weight:800;}
.name-card .info .s{font-size:.78rem;color:var(--text-faint);margin-top:3px;}

function todayISO(){ const d=new Date(); return fmt(d); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoFromOffset(o){ const d=new Date(); d.setDate(d.getDate()+o); return fmt(d); }
function dowIndex(iso){ return new Date(iso+'T00:00:00').getDay(); }
function dayNum(iso){ return parseInt(iso.split('-')[2],10); }
function esc(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function mostrarSetupInicial(){
  const ov = document.getElementById('setup-overlay');
  if(!ov) return;
  ov.style.display = 'flex';
  document.getElementById('setup-sync-btn').addEventListener('click', ()=>{
    document.getElementById('setup-sync-form').style.display = 'block';
    document.getElementById('setup-sync-chave').focus();
  });
  document.getElementById('setup-sync-go').addEventListener('click', ()=>{
    const chave = document.getElementById('setup-sync-chave').value.trim();
    if(!chave){ document.getElementById('setup-sync-msg').textContent = 'Digite a chave.'; return; }
    try{
      localStorage.setItem('habitos-sync-url', SYNC_URL_PADRAO);
      localStorage.setItem('habitos-sync-chave', chave);
    }catch(e){}
    document.getElementById('setup-sync-msg').textContent = 'Conectado! Baixando dados...';
    baixarAgora().then(()=>{ iniciarAutoPull(); ov.style.display = 'none'; }).catch(()=>{
      document.getElementById('setup-sync-msg').textContent = 'Falha. Confira a chave e internet.';
    });
  });
  document.getElementById('setup-import-btn').addEventListener('click', ()=>{
    document.getElementById('setup-file').click();
  });
  document.getElementById('setup-file').addEventListener('change', ()=>{
    const f = document.getElementById('setup-file').files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const o = JSON.parse(r.result);
        if(!o || !o.dados) throw 0;
        Object.keys(o.dados).filter(k=>['habits-v3','habitos-aba','treino-v1','treino-v2','evolucao-v1'].includes(k)).forEach(k=>{
          try{ localStorage.setItem(k, o.dados[k]); }catch(e){}
        });
        ov.style.display = 'none';
        location.reload();
      }catch(e){ document.getElementById('setup-sync-msg').textContent = 'Arquivo inválido.'; }
    };
    r.readAsText(f);
  });
  document.getElementById('setup-fresh-btn').addEventListener('click', ()=>{
    ov.style.display = 'none';
    try{ localStorage.setItem('habitos-setup-ok', '1'); }catch(e){}
  });
}
async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(!state.habits) state.habits = [];
      if(!state.checkins) state.checkins = {};
      if(!state.modos) state.modos = {};
      const CAT_MAP = {intelecto:'mental', produtividade:'disciplina', financeiro:'disciplina'};
      state.habits.forEach(h=>{ if(CAT_MAP[h.category]) h.category = CAT_MAP[h.category]; });
    }
  }catch(e){ state = { habits: [], checkins: {}, modos: {} }; }
  setHeader();
  loadTreino2();
  bindNav();
  render();
  iniciarAutoPull();
  baixarSeNovo();
  // iPhone PWA: aparelho sem dados e sem sync configurado → mostra setup
  const temDados = !!(state.habits && state.habits.length) || !!(localStorage.getItem('treino-v2'));
  const temSync = !!syncCfg();
  if(!temDados && !temSync && !localStorage.getItem('habitos-setup-ok')){
    mostrarSetupInicial();
  }
}

function addHabit(data){
  const id = 'h'+Date.now()+Math.floor(Math.random()*1000);
  const h = { id, name: data.name.trim(), category: data.category, type: data.type, createdAt: todayISO() };
  if(data.type==='time') h.time = data.time || '08:00';
  if(data.type==='quantity'){
    h.target = data.target || 1;
    h.unit = (data.unit || '').trim() || 'un';
    h.step = data.step || Math.max(1, Math.round(h.target/10));
  }
  if(data.days && data.days.length && data.days.length<7) h.days = [...data.days].sort((a,b)=>a-b);
  state.habits.push(h);
  persist(); render();
}
function updateHabit(id, data){
  const h = state.habits.find(x=>x.id===id);
  if(!h) return;
  h.name = data.name.trim();
  h.category = data.category;
  h.type = data.type;
  delete h.time; delete h.target; delete h.unit; delete h.step; delete h.days;
  if(data.type==='time') h.time = data.time || '08:00';
  if(data.type==='quantity'){
    h.target = data.target || 1;
    h.unit = (data.unit || '').trim() || 'un';
    h.step = data.step || Math.max(1, Math.round(h.target/10));
  }
  if(data.days && data.days.length && data.days.length<7) h.days = [...data.days].sort((a,b)=>a-b);
  persist(); render();
}
function isScheduled(h, iso){

// ===== MODO DO DIA: normal | corrido (versões reduzidas valem) | recuperacao (dia neutro) =====
function modoDe(iso){

}
function motivoDe(iso){

}
function setModo(iso, modo){

function setMotivo(iso, motivo){

}
function diaNeutro(iso){
  return modoDe(iso)==='recuperacao';
}
function estadoDe(h, iso){
  if(h.type==='quantity') return isDoneOn(h, iso) ? 'done' : '';
  const v = state.checkins[iso] && state.checkins[iso][h.id];
  if(v==='R') return 'reduz';
  return v ? 'done' : '';
}

function toggleCheckin(habitId, iso){

function addQty(habitId, iso, delta){
  if(iso > todayISO()) return;
  const hh = state.habits.find(x=>x.id===habitId);
  if(hh && !isScheduled(hh, iso)) return;
  if(!state.checkins[iso]) state.checkins[iso] = {};
  const cur = state.checkins[iso][habitId] || 0;
  const next = Math.max(0, cur + delta);
  if(next===0) delete state.checkins[iso][habitId];
  else state.checkins[iso][habitId] = next;
  persist(); render();
}
function setQty(h, iso){
  if(!isScheduled(h, iso)) return;
  const cur = (state.checkins[iso] && state.checkins[iso][h.id]) || 0;
  const val = prompt(`Quanto de ${h.unit} você já fez hoje (${h.name})?`, cur);
  if(val===null) return;
  const num = parseFloat(val.replace(',','.'));
  if(isNaN(num) || num<0) return;
  if(!state.checkins[iso]) state.checkins[iso] = {};
  if(num===0) delete state.checkins[iso][h.id];
  else state.checkins[iso][h.id] = num;
  persist(); render();
}

function habitDays(n){
  const days = [];
  for(let i=n-1;i>=0;i--) days.push(isoFromOffset(-i));
  return days;
}
function isDoneOn(h, iso){
  if(h.type==='quantity') return ((state.checkins[iso]&&state.checkins[iso][h.id])||0) >= h.target;
  return !!(state.checkins[iso] && state.checkins[iso][h.id]);
}
function qtyOn(h, iso){ return (state.checkins[iso] && state.checkins[iso][h.id]) || 0; }

function catCompletion(catKey, days){
  const habits = state.habits.filter(h=>h.category===catKey);
  if(habits.length===0) return 0;
  let done=0, total=0;
  for(const h of habits){
    for(const iso of days){
      if(!isScheduled(h, iso) || diaNeutro(iso)) continue;
      total++; if(isDoneOn(h, iso)) done++;
    }
  }
  return total ? Math.round((done/total)*100) : 0;
}
function habitStats(h, days){
  const base = days.filter(iso=>isScheduled(h,iso) && !diaNeutro(iso));
  const dd = base.length ? base : days.filter(iso=>isScheduled(h,iso));
  let done=0, running=0, currentStreak=0, bestStreak=0;
  for(const iso of dd){
    const ok = isDoneOn(h, iso);
    if(ok){ done++; running++; bestStreak=Math.max(bestStreak,running); } else running=0;
  }
  for(let i=dd.length-1;i>=0;i--){
    if(isDoneOn(h, dd[i])) currentStreak++; else break;
  }
  return { done, pct: dd.length?Math.round((done/dd.length)*100):0, currentStreak, bestStreak };
}

function radarSVG(scores){
  const cx=140, cy=140, maxR=95;
  const rings=[0.25,0.5,0.75,1];
  let svg = `<svg width="280" height="280" viewBox="0 0 280 280">`;
  for(const lvl of rings){
    let pts = CATS.map(c=>{
      const r = maxR*lvl; const rad = c.angle*Math.PI/180;
      return (cx+r*Math.cos(rad)).toFixed(1)+','+(cy+r*Math.sin(rad)).toFixed(1);
    }).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="#263342" stroke-width="1"/>`;
  }
  for(const c of CATS){
    const rad = c.angle*Math.PI/180;
    const x = cx+maxR*Math.cos(rad), y = cy+maxR*Math.sin(rad);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#263342" stroke-width="1"/>`;
  }
  let dataPts = CATS.map(c=>{
    const score = scores[c.key]||0;
    const r = Math.max(maxR*(score/100), score>0?6:0);
    const rad = c.angle*Math.PI/180;
    return (cx+r*Math.cos(rad)).toFixed(1)+','+(cy+r*Math.sin(rad)).toFixed(1);
  }).join(' ');
  svg += `<polygon points="${dataPts}" fill="rgba(34,197,94,.18)" stroke="#22C55E" stroke-width="2"/>`;
  for(const c of CATS){
    const rad = c.angle*Math.PI/180;
    const lx = cx+(maxR+26)*Math.cos(rad), ly = cy+(maxR+26)*Math.sin(rad);
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="${CAT_HEX[c.key]}" font-size="10" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">${c.label.toUpperCase()}</text>`;
  }
  const overall = Math.round(CATS.reduce((s,c)=>s+(scores[c.key]||0),0)/CATS.length);
  svg += `<text x="${cx}" y="${cy-6}" fill="#F1F5F9" font-size="30" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">${overall}</text>`;
  svg += `<text x="${cx}" y="${cy+16}" fill="#94A3B8" font-size="9" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="1">SCORE</text>`;
  svg += `</svg>`;
  return svg;
}

function buildInsights(days){
  if(state.habits.length===0) return [];
  const lines = [];
  const stats = state.habits.map(h=>({h, s:habitStats(h, days)}));
  const sorted = [...stats].sort((a,b)=>b.s.pct-a.s.pct);
  if(sorted[0] && sorted[0].s.pct>=70){
    lines.push({c:'var(--green)', html:`<b>${esc(sorted[0].h.name)}</b> está indo bem — ${sorted[0].s.pct}% nos últimos ${days.length} dias.`});
  }
  const worst = sorted[sorted.length-1];
  if(worst && worst.s.pct<=40 && stats.length>1){
    lines.push({c:'var(--red)', html:`<b>${esc(worst.h.name)}</b> está com só ${worst.s.pct}% de conclusão. Pode ser hora de simplificar.`});
  }
  for(const {h,s} of stats){
    if(s.currentStreak>=3) lines.push({c:'var(--green)', html:`<b>${esc(h.name)}</b> está numa sequência de ${s.currentStreak} dias.`});
  }
  const dowNames=['domingos','segundas','terças','quartas','quintas','sextas','sábados'];
  const miss=[0,0,0,0,0,0,0], tot=[0,0,0,0,0,0,0];
  for(const {h} of stats){
    for(const iso of days){
      if(!isScheduled(h, iso) || diaNeutro(iso)) continue;
      const d = dowIndex(iso); tot[d]++;
      if(!isDoneOn(h, iso)) miss[d]++;
    }
  }
  let wi=-1, wr=0;
  for(let i=0;i<7;i++){ if(tot[i]<2) continue; const r=miss[i]/tot[i]; if(r>wr){wr=r;wi=i;} }
  if(wi>=0 && wr>=0.5) lines.push({c:'var(--red)', html:`Você falha mais aos <b>${dowNames[wi]}</b> — ${Math.round(wr*100)}% de falta.`});
  if(lines.length===0) lines.push({c:'var(--text-faint)', html:'Continue marcando os dias para ver padrões aqui.'});
  return lines;
}

function sortedTodayList(){
  const list = [...state.habits];
  list.sort((a,b)=>{
    const at = a.type==='time' ? a.time : '99:99';
    const bt = b.type==='time' ? b.time : '99:99';
    if(at!==bt) return at<bt?-1:1;
    return 0;
  });
  return list;
}

function migrarTreinoV1(){
  try{
    const raw = localStorage.getItem('treino-v1');
    if(!raw) return;
    const v1 = JSON.parse(raw);
    const exs = v1.exercicios || [];
    if(!exs.length) return;
    const fid = 'f'+Date.now();
    treino2.fichas.push({
      id: fid, nome: 'Meu treino', categoria: 'Geral', descricao: 'Importado do treino anterior',
      criadoEm: todayISO(),
      exercicios: exs.map(e=>({ nome: e.nome, grupo: e.grupo||'Outro', equip: 'Peso livre', dif: 'Iniciante',
        tipo: 'reps', series: e.series||3, reps: e.reps||12, tempoSeg: 60, distanciaM: 400,
        descansoSeg: 60, carga: e.carga||0, obs: '', demo: '🏋️', inst: '' }))
    });
    Object.keys(v1.sessoes||{}).forEach(iso=>{
      const ses = v1.sessoes[iso] || {};
      const ids = Object.keys(ses);
      if(!ids.length) return;
      treino2.sessoes.push({
        id: 's'+iso.replace(/-/g,'')+Math.floor(Math.random()*100),
        fichaId: fid, fichaNome: 'Meu treino', inicio: iso+'T12:00:00', fim: iso+'T12:30:00',
        status: 'concluida', esforco: 0, energia: 0, obs: 'Importado do treino anterior',
        ativoMs: 0, segIni: null, descanso: null, exIdx: 0, serieIdx: 0,
        itens: ids.map(id=>{
          const ex = exs.find(x=>x.id===id);
          if(!ex) return null;
          const f = Math.min(ses[id].feitas||0, ex.series||3);
          const arr = [];
          for(let i=0;i<f;i++) arr.push({ n:i+1, feita:true, pulada:false, repsFeitas:ex.reps||12, tempoFeitoSeg:0, distFeitaM:0, carga:ex.carga||0, ts:iso+'T12:00:00' });
          return { nome: ex.nome, grupo: ex.grupo||'Outro', tipo: 'reps',
            meta: {series: ex.series||3, reps: ex.reps||12}, series: arr };
        }).filter(Boolean)
      });
    });
    saveTreino2();
  }catch(e){}
}

function sessaoAtiva(){

  return (s && (s.status==='ativa' || s.status==='pausada')) ? s : null;

function fmtDur(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), r = s%60;
  return (h? h+':' +String(m).padStart(2,'0') : m) + ':' + String(r).padStart(2,'0');
}
function fmtHora(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function volSessao(s){
  let v = 0;
  (s.itens||[]).forEach(it=>{ (it.series||[]).forEach(x=>{ if(x.feita && !x.pulada) v += (x.repsFeitas||0)*(x.carga||0); }); });
  return v;
}
function seriesFeitasSessao(s){
  let f = 0, t = 0;
  (s.itens||[]).forEach(it=>{ (it.series||[]).forEach(x=>{ t++; if(x.feita && !x.pulada) f++; }); });
  return {f, t};
}
// Relógio de tempo ativo: só conta enquanto segIni estiver ligado (pausas não contam).
function pararAtivo(s){ if(s.segIni!=null){ s.ativoMs = (s.ativoMs||0) + (Date.now()-s.segIni); s.segIni = null; } }
function andarAtivo(s){ if(s.status==='ativa' && s.segIni==null){ s.segIni = Date.now(); } }
function durAtiva(s){ return (s.ativoMs||0) + (s.segIni!=null ? (Date.now()-s.segIni) : 0); }
function bip(dur){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const c = new C(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'sine'; o.frequency.value = 880;
    const t = c.currentTime, d = dur||0.6;
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t+0.03);
    [0, 0.25].forEach(k=>{ o.frequency.setValueAtTime(k?1174:880, t+k); });
    g.gain.exponentialRampToValueAtTime(0.001, t+d);
    o.start(t); o.stop(t+d+0.05);
    setTimeout(()=>{ try{ c.close(); }catch(e){} }, 900);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}

function posAtual(s){
  for(let i=0;i<s.itens.length;i++){
    const it = s.itens[i];
    const total = it.meta.series;
    const feitas = it.series.filter(x=>x.feita||x.pulada).length;
    if(feitas < total) return { ex: i, sr: feitas };
  }
  return { ex: s.itens.length, sr: 0 };
}
function metaCurta(it){
  if(it.tipo==='tempo') return `${it.meta.series}x${it.meta.tempoSeg}s`;
  if(it.tipo==='distancia') return `${it.meta.series}x${it.meta.distanciaM}m`;
  return `${it.meta.series}x${it.meta.reps}${it.meta.carga?' · '+formatNum(it.meta.carga)+'kg':''}`;
}

    <div class="task-qty-bar"><div class="task-qty-fill" style="width:${tot.t?Math.round(tot.f/tot.t*100):0}%"></div></div>
    <div class="task-qty-label">Sessão: ${tot.f}/${tot.t} séries</div>
    <div class="extra-fields" style="margin-top:.8rem;">

  });

    for(let k=pos.sr;k<it.meta.series;k++) it.series.push({ n:k+1, feita:false, pulada:true, repsFeitas:0, tempoFeitoSeg:0, distFeitaM:0, carga:0, ts:new Date().toISOString() });
    saveTreino2(); render();
  });
  document.getElementById('ex-fix').addEventListener('click', ()=>corrigirUltima(s));

function exDemo(it){ return it.demo || '🏋️'; }
function exInst(it){ return it.inst || ''; }
function concluirSerie(s, pos, feito, carga){
  const it = s.itens[pos.ex];
  if(!it) return;
  const reg = { n: pos.sr+1, feita: true, pulada: false, repsFeitas: 0, tempoFeitoSeg: 0, distFeitaM: 0, carga: carga||0, ts: new Date().toISOString() };
  if(it.tipo==='reps') reg.repsFeitas = feito;
  else if(it.tipo==='tempo') reg.tempoFeitoSeg = Math.round(feito);
  else reg.distFeitaM = feito;
  it.series.push(reg);
  const faltam = it.meta.series - it.series.filter(x=>x.feita||x.pulada).length;
  if(faltam > 0 && (it.meta.descansoSeg||0) > 0){
    s.serieIdx = pos.sr+1;
    s.descanso = { fimTs: Date.now()+(it.meta.descansoSeg*1000), durSeg: it.meta.descansoSeg, pausado: false, restanteMs: 0, troca: false, prox: '' };
  } else if(faltam <= 0 && pos.ex+1 < s.itens.length){
    // Troca de exercício: descanso configurável na ficha
    const troca = Math.max(0, s.descansoTroca!=null ? s.descansoTroca : 90);
    s.exIdx = pos.ex+1; s.serieIdx = 0;
    s.descanso = troca > 0
      ? { fimTs: Date.now()+(troca*1000), durSeg: troca, pausado: false, restanteMs: 0, troca: true, prox: s.itens[pos.ex+1].nome }
      : null;
  } else if(faltam <= 0){
    s.exIdx = pos.ex+1; s.serieIdx = 0;
  } else {
    s.serieIdx = pos.sr+1;
  }
  saveTreino2(); render();
}
function addDescanso(s, ms){
  const d = s.descanso;
  if(!d) return;
  if(d.pausado) d.restanteMs += ms;
  else d.fimTs += ms;
  d.durSeg += Math.round(ms/1000);
  saveTreino2(); render();
}
function fimDescanso(s, pulado){
  s.descanso = null;
  try{ msStop(); }catch(e){}
  saveTreino2();
  if(!pulado){
    bip(0.7);
    const card = document.getElementById('rest-card');
    if(card){ card.classList.add('rest-flash'); }
  }
  render();
}
// Timer na tela bloqueada (Media Session): mostra o descanso no Android/iOS
// sem precisar desbloquear. Requer o áudio silencioso tocando (loop).
let tSilURL = '', tMSOk = false, tMSec = -1;
function msSilence(){
  if(tSilURL) return tSilURL;
  const n = 4000, buf = new ArrayBuffer(44+n), v = new DataView(buf);
  const ws = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4,36+n,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
  ws(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  tSilURL = URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  return tSilURL;
}
function msStart(s, d){
  try{
    if(!('mediaSession' in navigator)) return;
    const a = document.getElementById('t-silence');
    if(a){ if(!a.src) a.src = msSilence(); a.play().catch(()=>{}); }
    if(!tMSOk){
      tMSOk = true;
      try{ navigator.mediaSession.setActionHandler('play', ()=>{ const x=document.getElementById('t-rpause'); if(x) x.click(); }); }catch(e){}
      try{ navigator.mediaSession.setActionHandler('pause', ()=>{ const x=document.getElementById('t-rpause'); if(x) x.click(); }); }catch(e){}
      try{ navigator.mediaSession.setActionHandler('previoustrack', ()=>{ const x=document.getElementById('t-rskip'); if(x) x.click(); }); }catch(e){}
    }
    tMSec = -1;
    navigator.mediaSession.playbackState = 'playing';
    msTickSessao(s, d);
  }catch(e){}
}
function msTickSessao(s, d){
  try{
    if(!('mediaSession' in navigator) || !d) return;
    const total = Math.max(1, d.durSeg||0);
    const rest = d.pausado ? d.restanteMs : Math.max(0, d.fimTs-Date.now());
    const sec = Math.ceil(rest/1000);
    if(sec===tMSec) return;
    tMSec = sec;
    const el = Math.min(total, Math.max(0, total-Math.round(rest/1000)));
    try{ navigator.mediaSession.setPositionState({ duration: total, playbackRate: d.pausado?0:1, position: el }); }catch(e){}
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Descanso ' + fmtDur(rest),
        artist: (d.troca ? 'Próximo: ' + (d.prox||'') : 'Treino') + ' · ' + (s.fichaNome||''),
        album: 'Treino'
      });
    }catch(e){}
    navigator.mediaSession.playbackState = d.pausado ? 'paused' : 'playing';
  }catch(e){}
}
function msStop(){
  try{
    const a = document.getElementById('t-silence');
    if(a) a.pause();
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
    tMSec = -1;
  }catch(e){}
}
function ligarTick(s){
  if(tTick) clearInterval(tTick);
  tTick = setInterval(()=>{
    if(!document.getElementById('t-dur')){ clearInterval(tTick); tTick = null; return; }
    document.getElementById('t-dur').textContent = 'Tempo ativo ' + fmtDur(durAtiva(s));
    const d = s.descanso;
    if(d && !d.pausado){
      const rest = d.fimTs - Date.now();
      const num = document.getElementById('t-rest-num');
      const fill = document.getElementById('t-rest-fill');
      if(num) num.textContent = Math.max(0, Math.ceil(rest/1000)) + 's';
      if(fill) fill.style.width = Math.max(0, Math.min(100, rest/(d.durSeg*1000)*100)) + '%';
      msTickSessao(s, d);
      if(rest <= 0) fimDescanso(s, false);
    } else if(d && d.pausado){
      const num = document.getElementById('t-rest-num');
      if(num) num.textContent = Math.ceil(d.restanteMs/1000) + 's ⏸';
      msTickSessao(s, d);
    }
  }, 250);

function corrigirUltima(s){
  for(let i=s.itens.length-1;i>=0;i--){
    const it = s.itens[i];
    for(let k=it.series.length-1;k>=0;k--){
      if(it.series[k].feita || it.series[k].pulada){
        it.series.splice(k,1);
        s.exIdx = i; s.serieIdx = k;
        s.descanso = null;

    }
  }

function calMes(){
  const h = new Date();
  const ano = h.getFullYear(), mes = h.getMonth();
  const diasNoMes = new Date(ano, mes+1, 0).getDate();
  const off = (new Date(ano, mes, 1).getDay()+6)%7;
  const comTreino = {};
  treino2.sessoes.filter(x=>x.status==='concluida').forEach(s=>{
    const m = String(s.inicio||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m && +m[1]===ano && (+m[2]-1)===mes) comTreino[`${m[1]}-${m[2]}-${m[3]}`] = true;
  });
  const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  let html = `<div class="rsec" style="text-transform:capitalize;">${nomes[mes]} ${ano}${tHistDia?' · <span style="color:var(--green)">'+tHistDia.slice(8)+'/'+tHistDia.slice(5,7)+' ✕</span>':''}</div><div class="cal-grid">`;
  ['S','T','Q','Q','S','S','D'].forEach(d=>{ html += `<div class="cal-dow">${d}</div>`; });
  for(let i=0;i<off;i++) html += `<div></div>`;
  for(let d=1;d<=diasNoMes;d++){
    const iso = ano+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    html += `<div class="cal-d${comTreino[iso]?' has':''}${tHistDia===iso?' sel':''}" data-calday="${iso}">${d}</div>`;
  }
  return html + `</div>`;
}

function streakAtual(h){

    if(!isScheduled(h, iso) || diaNeutro(iso)) continue;

function evolucaoSemanal(n){
  const conc = treino2.sessoes.filter(x=>x.status==='concluida');
  const out = [];
  for(let i=n-1;i>=0;i--){
    const ref = new Date(); ref.setDate(ref.getDate()-i*7);
    const s0 = new Date(ref); s0.setDate(ref.getDate()-((ref.getDay()+6)%7)); s0.setHours(0,0,0,0);
    const s1 = new Date(s0); s1.setDate(s0.getDate()+7);
    const ss = conc.filter(x=>{ const d = new Date(x.fim||x.inicio); return d>=s0 && d<s1; });
    out.push({
      n: ss.length,
      vol: ss.reduce((a,x)=>a+volSessao(x),0),
      lbl: String(s0.getDate()).padStart(2,'0')+'/'+String(s0.getMonth()+1).padStart(2,'0')
    });
  }
  return out;
}
function chartLinhaSVG(vals, labels){
  const n = vals.length;
  if(!n) return '';
  const W=320, H=132, padX=16, padTop=12, padBot=22;
  const max = Math.max(1, ...vals);
  const x = i => n===1 ? W/2 : padX + i*(W-2*padX)/(n-1);
  const y = v => (H-padBot) - (v/max)*(H-padTop-padBot);
  const pts = vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const area = `${padX},${H-padBot} ${pts} ${x(n-1).toFixed(1)},${H-padBot}`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linha">
    <polygon points="${area}" fill="rgba(34,197,94,.15)"></polygon>
    <line x1="${padX}" y1="${H-padBot}" x2="${W-padX}" y2="${H-padBot}" stroke="#263342" stroke-width="1"></line>
    <polyline points="${pts}" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#22C55E"></circle>`).join('')}
    ${(labels||[]).map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${H-6}" font-size="8" fill="#94A3B8" text-anchor="middle">${l}</text>`).join('')}
    <text x="${padX}" y="${padTop+2}" font-size="8" fill="#94A3B8" font-weight="700">${formatNum(Math.round(max))}</text>
  </svg>`;
}
function chartBarrasSVG(vals, labels){
  const n = vals.length;
  if(!n) return '';
  const W=320, H=132, padX=16, padTop=12, padBot=22;
  const max = Math.max(1, ...vals);
  const slot = (W-2*padX)/n;
  const bw = Math.min(26, slot*0.6);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras">
    <line x1="${padX}" y1="${H-padBot}" x2="${W-padX}" y2="${H-padBot}" stroke="#263342" stroke-width="1"></line>
    ${vals.map((v,i)=>{
      const h = Math.max(v>0?4:2, (v/max)*(H-padTop-padBot));
      const cx = padX + slot*i + slot/2;
      return `<rect x="${(cx-bw/2).toFixed(1)}" y="${(H-padBot-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${v>0?'#22C55E':'#263342'}"></rect>`;
    }).join('')}
    ${(labels||[]).map((l,i)=>{
      const cx = padX + slot*i + slot/2;
      return `<text x="${cx.toFixed(1)}" y="${H-6}" font-size="8" fill="#94A3B8" text-anchor="middle">${l}</text>`;
    }).join('')}
    <text x="${padX}" y="${padTop+2}" font-size="8" fill="#94A3B8" font-weight="700">${formatNum(Math.round(max))}</text>
  </svg>`;
}
// ===== EVOLUÇÃO (peso/medidas — dado real do usuário, chave nova evolucao-v1) =====
const EVOL_KEY = 'evolucao-v1';
function evolStore(){
  try{
    const r = localStorage.getItem(EVOL_KEY);
    if(r){ const o = JSON.parse(r); return { pesos: o.pesos||{}, medidas: o.medidas||{} }; }
  }catch(e){}
  return { pesos:{}, medidas:{} };
}
function salvarEvol(o){
  try{ localStorage.setItem(EVOL_KEY, JSON.stringify(o)); tocarLocal(); }catch(e){}
}
function addPeso(iso, kg){
  const o = evolStore();
  const v = parseFloat(String(kg).replace(',','.'));
  if(!iso || !(v>0)) return false;
  o.pesos[iso] = Math.round(v*10)/10;
  salvarEvol(o);
  return true;
}
function addMedida(iso, campo, valor){
  const o = evolStore();
  const v = parseFloat(String(valor).replace(',','.'));
  if(!iso || !campo || !(v>0)) return false;
  if(!o.medidas[iso]) o.medidas[iso] = {};
  o.medidas[iso][campo] = Math.round(v*10)/10;
  salvarEvol(o);
  return true;
}
function pesosOrdenados(){

}
function medidasRecentes(){
