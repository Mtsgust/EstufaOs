<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estufas">
<meta name="theme-color" content="#0D1B13">
<title>Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E0C; --bg2:#0F1512; --card:#131A16; --card2:#18221C;
    --line:#1E2E25; --ink:#E8F0EA; --mut:#7A9184; --dim:#4A5E52;
    --leaf:#3D7A5C; --lime:#8FD19A; --gold:#D9A441; --red:#E0785F; --blue:#4A9BD9;
    --r:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:110px; -webkit-font-smoothing:antialiased;}
  a{color:var(--lime); text-decoration:none;}

  .page{max-width:900px; margin:0 auto; padding:32px 20px 80px;}
  .hdr{margin-bottom:18px;}
  .hdr h1{font-size:26px; font-weight:800; letter-spacing:-.03em;}
  .hdr p{color:var(--mut); font-size:13px; margin-top:4px;}

  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px;}
  .kpi-row.qty{grid-template-columns:repeat(2,1fr); margin-bottom:18px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center;}
  .kpi-val{font-size:20px; font-weight:800; color:var(--lime); line-height:1.2; word-break:break-word;}
  .kpi-val.small{font-size:15px;}
  .kpi-val.gold{color:var(--gold);}
  .kpi-val.mut{color:var(--mut);}
  .kpi-lab{font-size:11px; color:var(--mut); margin-top:4px; font-weight:500;}

  .tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .tab{flex:1; min-width:90px; text-align:center; padding:10px 8px; border-radius:12px; font-size:12.5px; font-weight:600;
    background:var(--card); border:1px solid var(--line); cursor:pointer; color:var(--mut); transition:.18s; white-space:nowrap;}
  .tab:hover{background:var(--card2); color:var(--ink);}
  .tab.active{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff; border-color:transparent;}

  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center;}
  .filters select,.filters input{padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:13px; background:var(--card); color:var(--ink); font-family:inherit;}
  .filters select:focus,.filters input:focus{outline:none; border-color:var(--leaf);}
  .filters select option{background:var(--card); color:var(--ink);}
  .filters label{font-size:11px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .filters .f-group{display:flex; align-items:center; gap:6px;}
  .filters input[type=date]{color-scheme:dark;}
  .filters .f-busca{flex:1; min-width:160px;}

  .empty{text-align:center; color:var(--dim); font-size:14px; padding:60px 0;}
  .loading{text-align:center; color:var(--dim); font-size:13px; padding:40px 0;}

  /* Cartão de venda */
  .item{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 18px 18px 22px; margin-bottom:12px;
    transition:border-color .18s; position:relative; overflow:hidden;}
  .item:hover{border-color:#2A4A35;}
  .v-bar{position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--gold);}
  .item.recebido .v-bar{background:var(--lime);}
  .item-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .cat{font-size:11px; padding:4px 12px; border-radius:20px; font-weight:700; background:rgba(143,209,154,.14); color:var(--lime);
    text-transform:uppercase; letter-spacing:.04em; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .alert{font-size:10.5px; padding:4px 11px; border-radius:20px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
  .alert.ok{background:rgba(143,209,154,.14); color:var(--lime);}
  .alert.low{background:rgba(217,164,65,.15); color:var(--gold);}
  .v-line1{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:10px;}
  .v-who{font-size:16px; font-weight:700; letter-spacing:-.01em;}
  .v-meta{font-size:12.5px; color:var(--mut); margin-top:3px;}
  .v-calc{font-size:13.5px; color:var(--mut); margin-top:8px;}
  .v-calc b{color:var(--ink); font-weight:600;}
  .v-total{font-size:22px; font-weight:800; color:var(--lime); white-space:nowrap;}
  .v-money{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .vm{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px 12px;}
  .vm span{display:block; font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
  .vm b{font-size:15px; font-weight:700;}
  .vm b.ok{color:var(--lime);}
  .vm b.wait{color:var(--gold);}
  .vm b.zero{color:var(--dim);}

  .v-det{margin-top:12px; border-top:1px solid var(--line); padding-top:8px;}
  .v-det summary{cursor:pointer; font-size:12px; color:var(--mut); font-weight:600; list-style:none; user-select:none;}
  .v-det summary::-webkit-details-marker{display:none;}
  .v-det summary::before{content:'▸ '; color:var(--dim);}
  .v-det[open] summary::before{content:'▾ ';}
  .v-det-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .v-det-grid .dg{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px 12px;}
  .v-det-grid span{display:block; font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .v-det-grid b{font-size:14px; color:var(--ink); font-weight:600;}
  .v-obs{font-size:12.5px; color:var(--mut); margin-top:8px;}

  .actions{display:flex; gap:8px; margin-top:12px;}
  .actions button{flex:1; border-radius:10px; padding:10px 0; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; border:none; transition:.15s;}
  .btn-in{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff;}
  .btn-in:hover{background:#4A8F6A;}
  .btn-out{background:transparent; color:var(--gold); border:1px solid rgba(217,164,65,.4)!important;}
  .btn-out:hover{background:rgba(217,164,65,.1);}
  .btn-edit{background:transparent; color:var(--mut); border:1px solid var(--line)!important; flex:0 0 44px!important;}
  .btn-edit:hover{border-color:var(--leaf)!important; color:var(--lime);}

  /* FAB */
  .fab{position:fixed; bottom:22px; right:20px; left:20px; max-width:420px; margin:0 auto;
    background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff; border:none; border-radius:14px;
    padding:16px; font-size:16px; font-weight:600; cursor:pointer; font-family:inherit;
    box-shadow:0 8px 24px rgba(61,122,92,.4); transition:.2s; z-index:50;}
  .fab:hover{transform:translateY(-2px);}

  /* Diálogo */
  dialog{border:none; border-radius:20px; width:min(94vw,480px); padding:0; background:var(--card);
    color:var(--ink); box-shadow:0 24px 60px rgba(0,0,0,.5);}
  dialog::backdrop{background:rgba(0,0,0,.7); backdrop-filter:blur(4px);}
  .sheet{padding:24px; max-height:85vh; overflow-y:auto;}
  .sheet h2{margin:0 0 4px; font-size:18px; font-weight:700;}
  .sheet .sub{font-size:12.5px; color:var(--mut); margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--mut); margin-bottom:5px; font-weight:600;}
  .field input,.field select{width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; font-size:15px;
    background:var(--bg2); color:var(--ink); font-family:inherit;}
  .field input:focus,.field select:focus{outline:none; border-color:var(--leaf);}
  .field select option{background:var(--card); color:var(--ink);}
  .field input[type=date]{color-scheme:dark;}
  .row2{display:flex; gap:10px;} .row2 .field{flex:1;}
  .prev{background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:15px; font-weight:700; margin-bottom:12px;}
  .prev small{font-weight:400; color:var(--mut); font-size:12px; display:block;}
  .prev span{color:var(--lime);}
  .sheet-actions{display:flex; gap:10px; margin-top:14px;}
  .sheet-actions button{flex:1; padding:12px; border-radius:9px; border:none; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;}
  .btn-cancel{background:var(--card2); color:var(--ink); border:1px solid var(--line)!important;}
  .btn-save{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff;}
  .prod-del{width:100%; padding:10px; border:1px solid var(--red); border-radius:9px; background:transparent;
    color:var(--red); font-size:13.5px; font-weight:600; margin-top:10px; cursor:pointer; font-family:inherit;}

  @media (max-width:600px){
    .page{padding:24px 14px 80px;}
    .hdr h1{font-size:22px;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .row2{flex-direction:column;}
    .filters{flex-direction:column; align-items:stretch;}
    .filters .f-group{width:100%;}
    .filters .f-group select{flex:1;}
    .filters select,.filters input{width:100%;}
    .filters .f-busca{min-width:0;}
    .v-money{grid-template-columns:1fr;}
    .v-det-grid{grid-template-columns:1fr;}
    .actions button{min-width:calc(50% - 4px);}
  }
</style>
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="theme.css">
</head>
<body data-page="vendas" class="tdark">
<div class="page">
  <div class="hdr">
    <h1>Vendas</h1>
    <p>Quem comprou, quantos KG/CX, preço e o que já entrou.</p>
  </div>

  <div class="kpi-row">
    <div class="kpi"><div class="kpi-val" id="tTot">—</div><div class="kpi-lab">Total vendido</div></div>
    <div class="kpi"><div class="kpi-val" id="tRec">—</div><div class="kpi-lab">Total recebido</div></div>
    <div class="kpi"><div class="kpi-val gold" id="tPen">—</div><div class="kpi-lab">Total a receber</div></div>
    <div class="kpi"><div class="kpi-val small" id="tSem">—</div><div class="kpi-lab">Vendido na semana</div></div>
  </div>
  <div class="kpi-row qty">
    <div class="kpi"><div class="kpi-val small mut" id="qKg">—</div><div class="kpi-lab">KG vendidos</div></div>
    <div class="kpi"><div class="kpi-val small mut" id="qCx">—</div><div class="kpi-lab">CX vendidas</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-f="todas">Todas</div>
  </div>

  <div class="filters">
    <div class="f-group"><label for="fComp">Comprador</label><select id="fComp"><option value="">Todos</option></select></div>
    <div class="f-group"><label for="fCult">Cultura</label><select id="fCult"><option value="">Todas</option></select></div>
    <div class="f-group"><label for="fStat">Status</label>
      <select id="fStat">
        <option value="">Todos</option>
        <option value="recebido">Recebidas</option>
        <option value="pendente">A receber</option>
      </select>
    </div>
    <div class="f-group"><label for="fDe">De</label><input id="fDe" type="date"></div>
    <div class="f-group"><label for="fAte">Até</label><input id="fAte" type="date"></div>
    <input id="busca" class="f-busca" type="text" placeholder="Buscar comprador ou cultura...">
  </div>

  <main id="list"><div class="loading">Carregando…</div></main>
</div>

<button class="fab" onclick="openVenda()">+ Nova venda</button>

<dialog id="dlgVenda">
  <div class="sheet">
    <h2 id="dlgVendaTitle">Nova venda</h2>
    <p class="sub">Total = quantidade paga × preço.</p>
    <div class="row2">
      <div class="field"><label>Data</label><input id="vData" type="date"></div>
      <div class="field"><label>Status</label>
        <select id="vStatus"><option value="pendente">A receber</option><option value="recebido">Recebido</option></select>
      </div>
    </div>
    <div class="field"><label>Comprador</label><input id="vComprador" type="text" list="dlComp" placeholder="ex: GEAN">
      <datalist id="dlComp"></datalist></div>
    <div class="row2">
      <div class="field"><label>Cultura</label>
        <select id="vCultura"><option>Tomate</option><option>Pepino</option><option>Outra</option></select>
      </div>
      <div class="field"><label>Unidade</label>
        <select id="vUn"><option value="KG">KG</option><option value="CX">CX</option></select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Quantidade</label><input id="vQtd" type="number" step="any" inputmode="decimal" placeholder="ex: 475"></div>
      <div class="field"><label>Qtd. paga (opcional)</label><input id="vQtdPaga" type="number" step="any" inputmode="decimal" placeholder="= quantidade"></div>
    </div>
    <div class="field"><label>Preço unitário (R$)</label><input id="vPreco" type="number" step="any" inputmode="decimal" placeholder="ex: 5,50"></div>
    <div class="prev"><small>Total da venda</small><span id="vTotalPrev">—</span></div>
    <div class="field"><label>Observação</label><input id="vObs" type="text" placeholder="opcional"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="document.getElementById('dlgVenda').close()">Cancelar</button>
      <button class="btn-save" onclick="salvarVenda()">Salvar</button>
    </div>
    <button class="prod-del" id="btnExcluirVenda" style="display:none" onclick="excluirVenda()">Excluir venda</button>
  </div>
</dialog>

<script src="config.js"></script>
<script>
let vendas = [];
let filtro = 'todas';
let editId = null;

function num(v){ if(v===''||v==null) return 0; const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function BRL(v){ return (Math.round(num(v)*100)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtData(v){ if(!v) return '—'; const s = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); if(s) return s[3]+'/'+s[2]+'/'+s[1];
  const d = new Date(v); return isNaN(d) ? v : d.toLocaleDateString('pt-BR'); }
function hojeISO(){ const d = new Date(); return d.toISOString().slice(0,10); }
function isoData(v){ if(!v) return ''; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1]+'-'+m[2]+'-'+m[3] : ''; }
function fmtQtd(q, u){ const n = Math.round(num(q)*100)/100; return n.toString().replace('.',',')+' '+(u||'KG'); }
function dataLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function semanaAtual(){
  const hoje = new Date();
  const dia = hoje.getDay();
  const ini = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - (dia === 0 ? 6 : dia - 1));
  const fim = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + 6);
  return [dataLocal(ini), dataLocal(fim)];
}
async function apiGet(tipo){
  if (typeof buscarTipo === 'function') {
    try { return { ok: true, data: await buscarTipo(tipo) }; }
    catch (e) { const c = cacheLerTipo(tipo); if (c) return { ok: true, data: c }; throw e; }
  }
  const r = (typeof fetchComTimeout === 'function') ? await fetchComTimeout(API_URL+'?tipo='+tipo) : await fetch(API_URL+'?tipo='+tipo);
  return r.json();
}
async function apiPost(body){
  if (typeof postarSeguro === 'function') return postarSeguro(body);
  const r = (typeof fetchComTimeout === 'function') ? await fetchComTimeout(API_URL, {method:'POST', body: JSON.stringify(body)}) : await fetch(API_URL, {method:'POST', body: JSON.stringify(body)});
  return r.json();
}

async function carregar(){
  try {
    if (typeof cacheLerTipo === 'function') {
      const c = cacheLerTipo('vendas');
      if (c && c.length) { vendas = c; vendas.sort((a,b)=> String(b.data||'') < String(a.data||'') ? -1 : 1); render(); }
      else document.getElementById('list').innerHTML = '<div class="loading">Carregando…</div>';
    } else document.getElementById('list').innerHTML = '<div class="loading">Carregando…</div>';
  } catch (e) {}
  try{
    const r = await apiGet('vendas');
    vendas = r.data || [];
    vendas.sort((a,b)=> String(b.data||'') < String(a.data||'') ? -1 : 1);
    popularFiltros();
    render();
  }catch(e){
    if (vendas && vendas.length) { popularFiltros(); render(); return; }
    document.getElementById('list').innerHTML = '<div class="loading">Demorou demais. <a href="#" onclick="carregar();return false">Tentar de novo</a></div>';
  }
}
function popularFiltros(){
  const comps = [...new Set(vendas.map(v=>v.comprador).filter(Boolean))].sort();
  const cults = [...new Set(vendas.map(v=>v.cultura).filter(Boolean))].sort();
  const selC = document.getElementById('fComp');
  const selU = document.getElementById('fCult');
  const curC = selC.value, curU = selU.value;
  selC.innerHTML = '<option value="">Todos</option>' + comps.map(c=>'<option value="'+esc(c)+'"'+(c===curC?' selected':'')+'>'+esc(c)+'</option>').join('');
  selU.innerHTML = '<option value="">Todas</option>' + cults.map(c=>'<option value="'+esc(c)+'"'+(c===curU?' selected':'')+'>'+esc(c)+'</option>').join('');
  document.getElementById('dlComp').innerHTML = comps.map(c=>'<option value="'+esc(c)+'">').join('');
}
function totais(){
  let rec = 0, pen = 0, sem = 0, kg = 0, cx = 0;
  const [iniSem, fimSem] = semanaAtual();
  vendas.forEach(v=>{
    const total = num(v.total);
    if(String(v.status)==='recebido') rec += total; else pen += total;
    const d = isoData(v.data);
    if(d && d >= iniSem && d <= fimSem) sem += total;
    const qp = num(v.qtdPaga) > 0 ? num(v.qtdPaga) : num(v.quantidade);
    if(String(v.unidade).toUpperCase()==='CX') cx += qp; else kg += qp;
  });
  document.getElementById('tTot').textContent = BRL(rec+pen);
  document.getElementById('tRec').textContent = BRL(rec);
  document.getElementById('tPen').textContent = BRL(pen);
  document.getElementById('tSem').textContent = BRL(sem);
  const fq = n => (Math.round(n*100)/100).toString().replace('.',',');
  document.getElementById('qKg').textContent = fq(kg)+' KG';
  document.getElementById('qCx').textContent = fq(cx)+' CX';
}
function render(){
  totais();
  const q = document.getElementById('busca').value.trim().toLowerCase();
  const fComp = document.getElementById('fComp').value;
  const fCult = document.getElementById('fCult').value;
  const fStat = document.getElementById('fStat').value;
  const fDe = document.getElementById('fDe').value;
  const fAte = document.getElementById('fAte').value;
  const list = vendas.filter(v=>{
    if(filtro!=='todas' && String(v.status)!==filtro) return false;
    if(fComp && String(v.comprador||'')!==fComp) return false;
    if(fCult && String(v.cultura||'')!==fCult) return false;
    if(fStat && String(v.status||'')!==fStat) return false;
    const d = isoData(v.data);
    if(fDe && (!d || d < fDe)) return false;
    if(fAte && (!d || d > fAte)) return false;
    if(q && !(String(v.comprador||'').toLowerCase().includes(q) || String(v.cultura||'').toLowerCase().includes(q))) return false;
    return true;
  });
  if(!list.length){ document.getElementById('list').innerHTML = '<div class="empty">Nenhuma venda.</div>'; return; }
  document.getElementById('list').innerHTML = list.map(cardV).join('');
}
function cardV(v){
  const rec = String(v.status)==='recebido';
  const qp = num(v.qtdPaga) > 0 ? num(v.qtdPaga) : num(v.quantidade);
  const total = num(v.total);
  const recebido = rec ? total : 0;
  const saldo = rec ? 0 : total;
  const qtdInfo = num(v.qtdPaga) > 0 && num(v.qtdPaga) !== num(v.quantidade)
    ? fmtQtd(v.quantidade, v.unidade)+' <span style="color:var(--dim)">(pago: '+fmtQtd(v.qtdPaga, v.unidade)+')</span>'
    : fmtQtd(v.quantidade, v.unidade);
  return '<div class="item '+(rec?'recebido':'aguard')+'">' +
    '<i class="v-bar"></i>' +
    '<div class="item-top"><span class="cat">'+esc(v.comprador||'—')+'</span>' +
    '<span class="alert '+(rec?'ok':'low')+'">'+(rec?'Recebido':'A receber')+'</span></div>' +
    '<div class="v-line1"><span class="v-meta" style="margin-top:0">'+fmtData(v.data)+' · '+esc(v.cultura||'')+'</span>' +
    '<b class="v-total">'+BRL(total)+'</b></div>' +
    '<div class="v-calc">'+qtdInfo+' × <b>'+BRL(v.preco)+'</b></div>' +
    '<div class="v-money">' +
      '<div class="vm"><span>Valor recebido</span><b class="'+(recebido>0?'ok':'zero')+'">'+BRL(recebido)+'</b></div>' +
      '<div class="vm"><span>Saldo pendente</span><b class="'+(saldo>0?'wait':'zero')+'">'+BRL(saldo)+'</b></div>' +
    '</div>' +
    '<details class="v-det"><summary>Detalhes</summary>' +
      '<div class="v-det-grid">' +
        '<div class="dg"><span>Comprador</span><b>'+esc(v.comprador||'—')+'</b></div>' +
        '<div class="dg"><span>Data da venda</span><b>'+fmtData(v.data)+'</b></div>' +
        '<div class="dg"><span>Cultura</span><b>'+esc(v.cultura||'—')+'</b></div>' +
        '<div class="dg"><span>Quantidade</span><b>'+fmtQtd(v.quantidade, v.unidade)+'</b></div>' +
        '<div class="dg"><span>Preço unitário</span><b>'+BRL(v.preco)+'</b></div>' +
        '<div class="dg"><span>Qtd. paga</span><b>'+fmtQtd(qp, v.unidade)+'</b></div>' +
      '</div>' +
      (v.obs ? '<div class="v-obs">Obs: '+esc(v.obs)+'</div>' : '') +
    '</details>' +
    '<div class="actions">' +
      (rec
        ? '<button class="btn-out" onclick="alternarStatus(\''+v.id+'\')">Voltar p/ a receber</button>'
        : '<button class="btn-in" onclick="alternarStatus(\''+v.id+'\')">Marcar recebido</button>') +
      '<button class="btn-edit" onclick="openVenda(\''+v.id+'\')">✎</button>' +
    '</div></div>';
}

function openVenda(id){
  editId = id || null;
  const v = id ? vendas.find(x=>String(x.id)===String(id)) : null;
  document.getElementById('dlgVendaTitle').textContent = v ? 'Editar venda' : 'Nova venda';
  document.getElementById('vData').value = v ? isoData(v.data) : hojeISO();
  document.getElementById('vStatus').value = v ? (v.status||'pendente') : 'pendente';
  document.getElementById('vComprador').value = v ? (v.comprador||'') : '';
  document.getElementById('vCultura').value = v ? (v.cultura||'Tomate') : 'Tomate';
  document.getElementById('vUn').value = v ? (v.unidade||'KG') : 'KG';
  document.getElementById('vQtd').value = v ? (v.quantidade||'') : '';
  document.getElementById('vQtdPaga').value = v && num(v.qtdPaga) > 0 ? v.qtdPaga : '';
  document.getElementById('vPreco').value = v && num(v.preco) > 0 ? v.preco : '';
  document.getElementById('vObs').value = v ? (v.obs||'') : '';
  document.getElementById('btnExcluirVenda').style.display = v ? 'block' : 'none';
  calcPrev();
  document.getElementById('dlgVenda').showModal();
}
function calcPrev(){
  const qp = num(document.getElementById('vQtdPaga').value) > 0
    ? num(document.getElementById('vQtdPaga').value) : num(document.getElementById('vQtd').value);
  const p = num(document.getElementById('vPreco').value);
  document.getElementById('vTotalPrev').textContent = (qp > 0 && p > 0) ? BRL(qp*p) : 'a definir';
}
['vQtd','vQtdPaga','vPreco'].forEach(id=>document.getElementById(id).addEventListener('input', calcPrev));
async function salvarVenda(){
  const comp = document.getElementById('vComprador').value.trim();
  const qtd = num(document.getElementById('vQtd').value);
  if(!comp){ alert('Informe o comprador.'); return; }
  if(!(qtd > 0)){ alert('Informe a quantidade.'); return; }
  const qp = num(document.getElementById('vQtdPaga').value) > 0 ? num(document.getElementById('vQtdPaga').value) : qtd;
  const preco = num(document.getElementById('vPreco').value);
  const data = {
    data: document.getElementById('vData').value || hojeISO(),
    status: document.getElementById('vStatus').value,
    comprador: comp, cultura: document.getElementById('vCultura').value,
    unidade: document.getElementById('vUn').value, quantidade: qtd, qtdPaga: qp,
    preco: preco, total: Math.round(qp*preco*100)/100,
    obs: document.getElementById('vObs').value.trim()
  };
  const r = editId
    ? await apiPost({tipo:'vendas', action:'update', id:editId, data})
    : await apiPost({tipo:'vendas', action:'add', data});
  if(r.ok){ document.getElementById('dlgVenda').close(); carregar(); }
  else alert('Erro: '+(r.error||'falha ao salvar'));
}
async function alternarStatus(id){
  const v = vendas.find(x=>String(x.id)===String(id));
  if(!v) return;
  const novo = String(v.status)==='recebido' ? 'pendente' : 'recebido';
  const r = await apiPost({tipo:'vendas', action:'update', id, data:{status:novo}});
  if(r.ok) carregar(); else alert('Erro: '+(r.error||'falha'));
}
async function excluirVenda(){
  if(!editId) return;
  if(!confirm('Excluir esta venda?')) return;
  const r = await apiPost({tipo:'vendas', action:'delete', id:editId});
  if(r.ok){ document.getElementById('dlgVenda').close(); carregar(); }
  else alert('Erro: '+(r.error||'falha'));
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); filtro = t.dataset.f; render();
});
['busca','fComp','fCult','fStat','fDe','fAte'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

carregar();
</script>
<script src="sidebar.js"></script>
