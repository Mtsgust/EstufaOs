<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hábitos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0C0B">
<link rel="apple-touch-icon" href="ícone-192.png">
<link rel="icon" href="ícone-192.png">
<link rel="manifest" href="manifesto.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C0B;
    --card:#151716;
    --card-2:#1C1F1D;
    --border:#272A28;
    --text:#F2F2F0;
    --text-dim:#9A9D99;
    --text-faint:#5C605C;
    --green:#4ADE80;
    --red:#E8543F;
    --blue:#6EC6E8;
    --fisico:#5FC77E;
    --disciplina:#D8D8D8;
    --mental:#B18CF5;
    --intelecto:#E8C34D;
    --produtividade:#6EC6E8;
    --financeiro:#E8963D;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);height:100%;overscroll-behavior-y:none;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter', sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100%;overscroll-behavior-y:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  input, select{-webkit-user-select:text;user-select:text;}
  .wrap{
    max-width:460px;margin:0 auto;
    padding:calc(1.75rem + env(safe-area-inset-top)) 1.1rem calc(3rem + env(safe-area-inset-bottom));
  }
  .greeting-icon{
    width:64px;height:64px;border-radius:50%;margin:0 auto 1rem;
    background:radial-gradient(circle at 50% 40%, rgba(74,222,128,.22), transparent 70%);
    border:1px solid rgba(74,222,128,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .greeting-icon i{color:var(--green);font-size:26px;font-style:normal;}
  h1{
    text-align:center;font-size:1.15rem;font-weight:700;letter-spacing:.02em;
    margin:0 0 .25rem;text-transform:uppercase;
  }
  .date-line{text-align:center;color:var(--text-faint);font-size:.8rem;margin:0 0 1.6rem;}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:1.1rem 1.1rem 1.2rem;margin-bottom:1rem;
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;}
  .card-title{
    display:flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);
  }
  .card-title i{color:var(--red);font-size:14px;font-style:normal;}
  .card-count{font-size:.78rem;color:var(--text-faint);}

  .add-row{display:flex;gap:.5rem;margin-bottom:.6rem;}
  .add-row input[type=text]{
    flex:1;background:var(--card-2);border:1px solid var(--border);color:var(--text);
    padding:.6rem .8rem;border-radius:8px;font-size:.85rem;font-family:'Inter', sans-serif;
  }
  .add-row select{
    background:var(--card-2);border:1px solid var(--border);color:var(--text);
    padding:.6rem .5rem;border-radius:8px;font-size:.78rem;font-family:'Inter', sans-serif;
    max-width:110px;
  }
  .add-row input:focus, .add-row select:focus{outline:none;border-color:var(--green);}
  .add-row button{
    background:var(--green);color:#0B2016;border:none;border-radius:8px;
    padding:0 .9rem;font-weight:700;font-size:.85rem;cursor:pointer;
  }
  .type-toggle{display:flex;gap:.4rem;margin-bottom:.6rem;}
  .type-toggle button{
    flex:1;background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);
    padding:.4rem .3rem;border-radius:8px;font-size:.74rem;cursor:pointer;font-family:'Inter', sans-serif;
  }
  .type-toggle button.active{background:rgba(74,222,128,.14);border-color:var(--green);color:var(--green);}
  #day-pick button{padding:.4rem 0;font-size:.72rem;}
  .modo-tip{font-size:.78rem;color:var(--text-dim);margin-top:.6rem;line-height:1.5;}
  .hist-cell.reduz{background:var(--blue);border-color:var(--blue);}
  .hist-cell.rec{background:rgba(232,150,61,.28);border-color:#E8963D;}
  .hist-cell.off{background:transparent;border-style:dashed;opacity:.4;cursor:default;}
  .aba-nav{display:flex;gap:.5rem;margin:0 0 1rem;}
  .aba-nav button{
    flex:1;background:var(--card);border:1px solid var(--border);color:var(--text-dim);
    padding:.65rem .3rem;border-radius:10px;font-size:.8rem;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;cursor:pointer;font-family:'Inter', sans-serif;
  }
  .aba-nav button.active{background:rgba(74,222,128,.14);border-color:var(--green);color:var(--green);}
  .extra-fields{display:flex;gap:.5rem;margin-bottom:.6rem;}
  .extra-fields input{
    background:var(--card-2);border:1px solid var(--border);color:var(--text);
    padding:.55rem .6rem;border-radius:8px;font-size:.8rem;font-family:'Inter', sans-serif;
  }
  .extra-fields input[type=time]{flex:1;}
  .extra-fields .qty-field{flex:1;min-width:0;}
  .extra-fields .qty-field input{width:100%;}
  .field-label{font-size:.62rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:.2rem;}
  .hidden{display:none !important;}

  .task-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .5rem;border-radius:8px;cursor:pointer;}
  .task-row:hover{background:var(--card-2);}
  .checkbox{
    width:19px;height:19px;border-radius:50%;border:1.5px solid var(--text-faint);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .checkbox.done{background:var(--green);border-color:var(--green);}
  .checkbox.done i{color:#0B2016;font-size:12px;font-style:normal;}
  .task-main{flex:1;min-width:0;}
  .task-name{font-size:.88rem;}
  .task-row.done .task-name{color:var(--text-faint);text-decoration:line-through;}
  .task-time{font-size:.68rem;color:var(--blue);font-weight:600;margin-top:1px;}
  .task-time.late{color:var(--red);}
  .task-qty-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:.35rem;width:100%;}
  .task-qty-fill{height:100%;background:var(--blue);border-radius:2px;}
  .task-qty-label{font-size:.68rem;color:var(--text-dim);margin-top:2px;}
  .task-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .qty-plus{
    background:var(--card-2);border:1px solid var(--border);color:var(--blue);
    width:26px;height:26px;border-radius:50%;font-size:.95rem;font-weight:700;cursor:pointer;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .row-actions{display:flex;gap:.15rem;flex-shrink:0;}
  .del-x, .edit-x{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:.8rem;padding:.2rem .3rem;visibility:hidden;}
  .task-row:hover .del-x, .task-row:hover .edit-x{visibility:visible;}
  .del-x:hover{color:var(--red);}
  .edit-x:hover{color:var(--blue);}
  .more-toggle{text-align:center;color:var(--text-dim);font-size:.78rem;padding:.5rem 0 0;cursor:pointer;}
  .more-toggle:hover{color:var(--text);}

  .period-toggle{display:flex;gap:.35rem;}
  .period-toggle button{
    background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);
    padding:.3rem .65rem;border-radius:16px;font-size:.72rem;cursor:pointer;font-family:'Inter', sans-serif;
  }
  .period-toggle button.active{background:var(--red);border-color:var(--red);color:#fff;}

  .radar-wrap{display:flex;justify-content:center;margin:.4rem 0 .6rem;}
  .score-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.6rem;}
  .score-cell{background:var(--card-2);border-radius:8px;padding:.55rem .3rem;text-align:center;}
  .score-cell .lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.03em;font-weight:700;margin-bottom:.2rem;}
  .score-cell .val{font-size:1.1rem;font-weight:700;}

  .hist-scroll{overflow-x:auto;}
  table.hist{border-collapse:separate;border-spacing:0 2px;width:100%;min-width:300px;}
  table.hist th{font-size:.6rem;color:var(--text-faint);font-weight:500;padding-bottom:.4rem;text-align:center;}
  table.hist th.today{color:var(--green);}
  .hist-name{
    text-align:left !important;font-size:.78rem;padding-right:.5rem !important;
    white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;
  }
  .hist-cell-wrap{padding:1px;}
  .hist-cell{width:22px;height:22px;border-radius:4px;background:var(--card-2);border:1px solid var(--border);cursor:pointer;margin:0 auto;}
  .hist-cell.done{background:var(--green);border-color:var(--green);}
  .hist-cell.future{opacity:.3;cursor:default;}

  .insight-line{
    display:flex;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--border);
    font-size:.83rem;line-height:1.5;color:var(--text-dim);
  }
  .insight-line:last-child{border-bottom:none;}
  .insight-line b{color:var(--text);font-weight:600;}
  .insight-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:.45rem;}

  .empty-state{text-align:center;color:var(--text-dim);font-size:.85rem;padding:1.5rem 1rem;}
  .loading{color:var(--text-faint);text-align:center;padding:3rem 0;}

  .big-btn{width:100%;background:var(--green);color:#0B2016;border:none;border-radius:12px;
    padding:1rem;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:'Inter', sans-serif;}
  .big-btn:active{transform:scale(.98);}
  .rest-num{font-size:3.8rem;font-weight:800;text-align:center;margin:.4rem 0;letter-spacing:.02em;}
  .rest-flash{animation:flash .6s ease 3;}
  @keyframes flash{50%{background:rgba(74,222,128,.22);}}
  .exec-demo{font-size:2.8rem;text-align:center;margin:.2rem 0;}
  .rsec{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:.8rem 0 .4rem;}
  .rrow{display:flex;align-items:center;gap:.5rem;font-size:.8rem;margin-bottom:.35rem;color:var(--text-dim);}
  .rrow .rn{flex:0 0 86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rrow .rbar{flex:1;height:8px;background:var(--card-2);border:1px solid var(--border);border-radius:99px;overflow:hidden;}
  .rrow .rbar i{display:block;height:100%;background:var(--green);border-radius:99px;}
  .rrow .rv{flex:0 0 22px;text-align:right;font-weight:700;}
  .rpe{display:flex;gap:.4rem;}
  .rpe button{flex:1;background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);
    border-radius:8px;padding:.6rem 0;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Inter', sans-serif;}
  .rpe button.on{background:rgba(74,222,128,.16);border-color:var(--green);color:var(--green);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:.4rem;}
  .cal-dow{font-size:.62rem;color:var(--text-faint);text-align:center;padding:.15rem 0;}
  .cal-d{min-height:34px;border-radius:8px;background:var(--card-2);border:1px solid var(--border);
    font-size:.72rem;display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;}
  .cal-d.has{background:rgba(74,222,128,.15);border-color:var(--green);color:var(--text);font-weight:700;}
  .cal-d.sel{outline:2px solid var(--green);}
  .extra-fields select{background:var(--card-2);border:1px solid var(--border);color:var(--text);
    padding:.55rem .6rem;border-radius:8px;font-size:.8rem;font-family:'Inter', sans-serif;width:100%;}
</style>
</head>
<body>
<div class="wrap">
  <div class="greeting-icon"><i>&#9679;</i></div>
  <h1 id="greeting">Bem-vindo_</h1>
  <p class="date-line" id="date-line"></p>
  <audio id="t-silence" loop preload="auto" style="display:none;"></audio>
  <div class="aba-nav">
    <button type="button" data-aba="habitos" class="active">Hábitos</button>
    <button type="button" data-aba="treino">Treino</button>
  </div>
  <div id="root"><div class="loading">Carregando…</div></div>
</div>

<script>
const STORAGE_KEY = 'habits-v3';
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const CATS = [
  {key:'fisico', label:'Físico', color:'var(--fisico)', angle:-90},
  {key:'disciplina', label:'Disciplina', color:'var(--disciplina)', angle:30},
  {key:'mental', label:'Mental', color:'var(--mental)', angle:150},
];
const CAT_HEX = {fisico:'#5FC77E',disciplina:'#D8D8D8',mental:'#B18CF5'};
let state = { habits: [], checkins: {} };
let aba = 'habitos';
try{ aba = localStorage.getItem('habitos-aba') || 'habitos'; }catch(e){}
let periodDays = 7;
let showAllTasks = false;
let addType = 'check';
let selDays = [0,1,2,3,4,5,6];
let editingId = null;
let saving = false;

function todayISO(){ const d=new Date(); return fmt(d); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoFromOffset(o){ const d=new Date(); d.setDate(d.getDate()+o); return fmt(d); }
function dowIndex(iso){ return new Date(iso+'T00:00:00').getDay(); }
function dayNum(iso){ return parseInt(iso.split('-')[2],10); }
function esc(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(!state.habits) state.habits = [];
      if(!state.checkins) state.checkins = {};
      if(!state.modos) state.modos = {};
      const CAT_MAP = {intelecto:'mental', produtividade:'disciplina', financeiro:'disciplina'};
      state.habits.forEach(h=>{ if(CAT_MAP[h.category]) h.category = CAT_MAP[h.category]; });
    }
  }catch(e){ state = { habits: [], checkins: {}, modos: {} }; }
  setHeader();
  loadTreino2();
  bindAbaNav();
  render();
  baixarSeNovo();
}
function bindAbaNav(){
  document.querySelectorAll('.aba-nav button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      aba = btn.dataset.aba;
      try{ localStorage.setItem('habitos-aba', aba); }catch(e){}
      render();
    });
  });
}
async function persist(){
  if(saving) return; saving = true;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); tocarLocal(); }
  catch(e){ console.error('Falha ao salvar', e); }
  saving = false;
}

function setHeader(){
  const now = new Date();
  const wd = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'][now.getDay()];
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  document.getElementById('date-line').textContent = `${wd}, ${now.getDate()} de ${meses[now.getMonth()]} de ${now.getFullYear()}`;
}

function addHabit(data){
  const id = 'h'+Date.now()+Math.floor(Math.random()*1000);
  const h = { id, name: data.name.trim(), category: data.category, type: data.type, createdAt: todayISO() };
  if(data.type==='time') h.time = data.time || '08:00';
  if(data.type==='quantity'){
    h.target = data.target || 1;
    h.unit = (data.unit || '').trim() || 'un';
    h.step = data.step || Math.max(1, Math.round(h.target/10));
  }
  if(data.days && data.days.length && data.days.length<7) h.days = [...data.days].sort((a,b)=>a-b);
  state.habits.push(h);
  persist(); render();
}
function updateHabit(id, data){
  const h = state.habits.find(x=>x.id===id);
  if(!h) return;
  h.name = data.name.trim();
  h.category = data.category;
  h.type = data.type;
  delete h.time; delete h.target; delete h.unit; delete h.step; delete h.days;
  if(data.type==='time') h.time = data.time || '08:00';
  if(data.type==='quantity'){
    h.target = data.target || 1;
    h.unit = (data.unit || '').trim() || 'un';
    h.step = data.step || Math.max(1, Math.round(h.target/10));
  }
  if(data.days && data.days.length && data.days.length<7) h.days = [...data.days].sort((a,b)=>a-b);
  persist(); render();
}
function isScheduled(h, iso){
  if(!h.days || h.days.length>=7) return true;
  return h.days.includes(dowIndex(iso));
}
// ===== MODO DO DIA: normal | corrido (versões reduzidas valem) | recuperacao (dia neutro) =====
function modoDe(iso){
  return (state.modos && state.modos[iso] && state.modos[iso].modo) || 'normal';
}
function motivoDe(iso){
  return (state.modos && state.modos[iso] && state.modos[iso].motivo) || '';
}
function setModo(iso, modo){
  if(!state.modos) state.modos = {};
  state.modos[iso] = { modo, motivo: motivoDe(iso) };
  persist(); render();
}
function setMotivo(iso, motivo){
  if(!state.modos) state.modos = {};
  state.modos[iso] = { modo: modoDe(iso), motivo };
  persist();
}
function diaNeutro(iso){
  return modoDe(iso)==='recuperacao';
}
function estadoDe(h, iso){
  if(h.type==='quantity') return isDoneOn(h, iso) ? 'done' : '';
  const v = state.checkins[iso] && state.checkins[iso][h.id];
  if(v==='R') return 'reduz';
  return v ? 'done' : '';
}
function toggleReduzida(habitId, iso){
  if(iso > todayISO()) return;
  if(!state.checkins[iso]) state.checkins[iso] = {};
  if(state.checkins[iso][habitId]==='R') delete state.checkins[iso][habitId];
  else state.checkins[iso][habitId] = 'R';
  persist(); render();
}
function startEdit(id){
  const h = state.habits.find(x=>x.id===id);
  if(!h) return;
  editingId = id;
  addType = h.type;
  selDays = (h.days && h.days.length) ? [...h.days] : [0,1,2,3,4,5,6];
  render();
  const card = document.querySelector('.wrap .card');
  if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
  focusNameInput();
}
function deleteHabit(id){
  state.habits = state.habits.filter(h=>h.id!==id);
  for(const d in state.checkins){ delete state.checkins[d][id]; }
  persist(); render();
}
function toggleCheckin(habitId, iso){
  if(iso > todayISO()) return;
  const hh = state.habits.find(x=>x.id===habitId);
  if(hh && !isScheduled(hh, iso)) return;
  if(!state.checkins[iso]) state.checkins[iso] = {};
  if(state.checkins[iso][habitId]) delete state.checkins[iso][habitId];
  else state.checkins[iso][habitId] = true;
  persist(); render();
}
function addQty(habitId, iso, delta){
  if(iso > todayISO()) return;
  const hh = state.habits.find(x=>x.id===habitId);
  if(hh && !isScheduled(hh, iso)) return;
  if(!state.checkins[iso]) state.checkins[iso] = {};
  const cur = state.checkins[iso][habitId] || 0;
  const next = Math.max(0, cur + delta);
  if(next===0) delete state.checkins[iso][habitId];
  else state.checkins[iso][habitId] = next;
  persist(); render();
}
function setQty(h, iso){
  if(!isScheduled(h, iso)) return;
  const cur = (state.checkins[iso] && state.checkins[iso][h.id]) || 0;
  const val = prompt(`Quanto de ${h.unit} você já fez hoje (${h.name})?`, cur);
  if(val===null) return;
  const num = parseFloat(val.replace(',','.'));
  if(isNaN(num) || num<0) return;
  if(!state.checkins[iso]) state.checkins[iso] = {};
  if(num===0) delete state.checkins[iso][h.id];
  else state.checkins[iso][h.id] = num;
  persist(); render();
}

function habitDays(n){
  const days = [];
  for(let i=n-1;i>=0;i--) days.push(isoFromOffset(-i));
  return days;
}
function isDoneOn(h, iso){
  if(h.type==='quantity') return ((state.checkins[iso]&&state.checkins[iso][h.id])||0) >= h.target;
  return !!(state.checkins[iso] && state.checkins[iso][h.id]);
}
function qtyOn(h, iso){ return (state.checkins[iso] && state.checkins[iso][h.id]) || 0; }

function catCompletion(catKey, days){
  const habits = state.habits.filter(h=>h.category===catKey);
  if(habits.length===0) return 0;
  let done=0, total=0;
  for(const h of habits){
    for(const iso of days){
      if(!isScheduled(h, iso) || diaNeutro(iso)) continue;
      total++; if(isDoneOn(h, iso)) done++;
    }
  }
  return total ? Math.round((done/total)*100) : 0;
}
function habitStats(h, days){
  const base = days.filter(iso=>isScheduled(h,iso) && !diaNeutro(iso));
  const dd = base.length ? base : days.filter(iso=>isScheduled(h,iso));
  let done=0, running=0, currentStreak=0, bestStreak=0;
  for(const iso of dd){
    const ok = isDoneOn(h, iso);
    if(ok){ done++; running++; bestStreak=Math.max(bestStreak,running); } else running=0;
  }
  for(let i=dd.length-1;i>=0;i--){
    if(isDoneOn(h, dd[i])) currentStreak++; else break;
  }
  return { done, pct: dd.length?Math.round((done/dd.length)*100):0, currentStreak, bestStreak };
}

function radarSVG(scores){
  const cx=140, cy=140, maxR=95;
  const rings=[0.25,0.5,0.75,1];
  let svg = `<svg width="280" height="280" viewBox="0 0 280 280">`;
  for(const lvl of rings){
    let pts = CATS.map(c=>{
      const r = maxR*lvl; const rad = c.angle*Math.PI/180;
      return (cx+r*Math.cos(rad)).toFixed(1)+','+(cy+r*Math.sin(rad)).toFixed(1);
    }).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="#272A28" stroke-width="1"/>`;
  }
  for(const c of CATS){
    const rad = c.angle*Math.PI/180;
    const x = cx+maxR*Math.cos(rad), y = cy+maxR*Math.sin(rad);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#272A28" stroke-width="1"/>`;
  }
  let dataPts = CATS.map(c=>{
    const score = scores[c.key]||0;
    const r = Math.max(maxR*(score/100), score>0?6:0);
    const rad = c.angle*Math.PI/180;
    return (cx+r*Math.cos(rad)).toFixed(1)+','+(cy+r*Math.sin(rad)).toFixed(1);
  }).join(' ');
  svg += `<polygon points="${dataPts}" fill="rgba(74,222,128,.18)" stroke="#4ADE80" stroke-width="2"/>`;
  for(const c of CATS){
    const rad = c.angle*Math.PI/180;
    const lx = cx+(maxR+26)*Math.cos(rad), ly = cy+(maxR+26)*Math.sin(rad);
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="${CAT_HEX[c.key]}" font-size="10" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">${c.label.toUpperCase()}</text>`;
  }
  const overall = Math.round(CATS.reduce((s,c)=>s+(scores[c.key]||0),0)/CATS.length);
  svg += `<text x="${cx}" y="${cy-6}" fill="#F2F2F0" font-size="30" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">${overall}</text>`;
  svg += `<text x="${cx}" y="${cy+16}" fill="#5C605C" font-size="9" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="1">SCORE</text>`;
  svg += `</svg>`;
  return svg;
}

function buildInsights(days){
  if(state.habits.length===0) return [];
  const lines = [];
  const stats = state.habits.map(h=>({h, s:habitStats(h, days)}));
  const sorted = [...stats].sort((a,b)=>b.s.pct-a.s.pct);
  if(sorted[0] && sorted[0].s.pct>=70){
    lines.push({c:'var(--green)', html:`<b>${esc(sorted[0].h.name)}</b> está indo bem — ${sorted[0].s.pct}% nos últimos ${days.length} dias.`});
  }
  const worst = sorted[sorted.length-1];
  if(worst && worst.s.pct<=40 && stats.length>1){
    lines.push({c:'var(--red)', html:`<b>${esc(worst.h.name)}</b> está com só ${worst.s.pct}% de conclusão. Pode ser hora de simplificar.`});
  }
  for(const {h,s} of stats){
    if(s.currentStreak>=3) lines.push({c:'var(--green)', html:`<b>${esc(h.name)}</b> está numa sequência de ${s.currentStreak} dias.`});
  }
  const dowNames=['domingos','segundas','terças','quartas','quintas','sextas','sábados'];
  const miss=[0,0,0,0,0,0,0], tot=[0,0,0,0,0,0,0];
  for(const {h} of stats){
    for(const iso of days){
      if(!isScheduled(h, iso) || diaNeutro(iso)) continue;
      const d = dowIndex(iso); tot[d]++;
      if(!isDoneOn(h, iso)) miss[d]++;
    }
  }
  let wi=-1, wr=0;
  for(let i=0;i<7;i++){ if(tot[i]<2) continue; const r=miss[i]/tot[i]; if(r>wr){wr=r;wi=i;} }
  if(wi>=0 && wr>=0.5) lines.push({c:'var(--red)', html:`Você falha mais aos <b>${dowNames[wi]}</b> — ${Math.round(wr*100)}% de falta.`});
  if(lines.length===0) lines.push({c:'var(--text-faint)', html:'Continue marcando os dias para ver padrões aqui.'});
  return lines;
}

function sortedTodayList(){
  const list = [...state.habits];
  list.sort((a,b)=>{
    const at = a.type==='time' ? a.time : '99:99';
    const bt = b.type==='time' ? b.time : '99:99';
    if(at!==bt) return at<bt?-1:1;
    return 0;
  });
  return list;
}

function bip(dur){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const c = new C(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'sine'; o.frequency.value = 880;
    const t = c.currentTime, d = dur||0.6;
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t+0.03);
    [0, 0.25].forEach(k=>{ o.frequency.setValueAtTime(k?1174:880, t+k); });
    g.gain.exponentialRampToValueAtTime(0.001, t+d);
    o.start(t); o.stop(t+d+0.05);
    setTimeout(()=>{ try{ c.close(); }catch(e){} }, 900);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}

    saveTreino2(); render();
  }));
  const rt = document.getElementById('t-retomar');
  if(rt) rt.addEventListener('click', ()=>irTreino('exec'));

function fmtDataCurta(ts){
  if(!ts) return '';
  const m = String(ts).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3]+'/'+m[2] : ts;
}
function iniciarSessao(fid){
  const f = fichaDe(fid);
  if(!f || !f.exercicios.length){ alert('Ficha sem exercícios.'); return; }
  const s = {
    id: 's'+Date.now(), fichaId: f.id, fichaNome: f.nome,
    inicio: new Date().toISOString(), fim: '', status: 'ativa',
    esforco: 0, energia: 0, obs: '', ativoMs: 0, segIni: Date.now(),
    descansoTroca: (f.descansoTroca!=null ? f.descansoTroca : 90),
    descanso: null, exIdx: 0, serieIdx: 0,
    itens: f.exercicios.map(e=>({ nome: e.nome, grupo: e.grupo, tipo: e.tipo||'reps',
      demo: e.demo||'🏋️', inst: e.inst||'',
      meta: { series: e.series, reps: e.reps||0, tempoSeg: e.tempoSeg||0, distanciaM: e.distanciaM||0, carga: e.carga||0, descansoSeg: e.descansoSeg||0 },
      series: [] }))
  };
    treino2.sessoes.push(s);
    treino2.ativaId = s.id;
    saveTreino2();
    marcarTreinoFeito();
    irTreino('exec');
}
// Começou a treinar = hábito "treinar" feito no dia (cria se não existir).
function marcarTreinoFeito(){
  const hoje = todayISO();
  let h = state.habits.find(x=>/trein/i.test(x.name||''));
  if(!h){
    h = { id: 'h'+Date.now()+Math.floor(Math.random()*1000), name: 'Treinar', category: 'fisico', type: 'check', createdAt: hoje };
    state.habits.push(h);
  }
  if(!state.checkins[hoje]) state.checkins[hoje] = {};
  state.checkins[hoje][h.id] = true;
  persist();
}
function cancelarSessao(s, silencioso){
  pararAtivo(s);
  s.status = 'cancelada';
  s.descanso = null;
  if(treino2.ativaId===s.id) treino2.ativaId = null;
  saveTreino2();
  if(!silencioso) irTreino('home');
}

// ===== Execução guiada + cronômetro =====
function posAtual(s){
  for(let i=0;i<s.itens.length;i++){
    const it = s.itens[i];
    const total = it.meta.series;
    const feitas = it.series.filter(x=>x.feita||x.pulada).length;
    if(feitas < total) return { ex: i, sr: feitas };
  }
  return { ex: s.itens.length, sr: 0 };
}
function metaCurta(it){
  if(it.tipo==='tempo') return `${it.meta.series}x${it.meta.tempoSeg}s`;
  if(it.tipo==='distancia') return `${it.meta.series}x${it.meta.distanciaM}m`;
  return `${it.meta.series}x${it.meta.reps}${it.meta.carga?' · '+formatNum(it.meta.carga)+'kg':''}`;
}

    root.innerHTML = `<div class="card"><div class="card-head">

    });
    document.getElementById('ex-enc2').addEventListener('click', encerrarSessao);
    return;
  }
  const it = s.itens[pos.ex];
  const tot = seriesFeitasSessao(s);
  // Descanso em andamento?
  if(s.descanso){
    const d = s.descanso;
    const rest = d.pausado ? d.restanteMs : Math.max(0, d.fimTs - Date.now());
    root.innerHTML = `<div class="card" id="rest-card"><div class="card-head">
        <div class="card-title"><i>&#9679;</i>${d.troca?'TROCA DE EXERCÍCIO':'DESCANSO'}</div>

        <button id="t-rpause" type="button" style="flex:1;background:var(--card-2);color:var(--text);border:1px solid var(--border);">${d.pausado?'Continuar':'Pausar'}</button>

      if(d.pausado){ d.fimTs = Date.now()+d.restanteMs; d.pausado = false; andarAtivo(s); }

function exDemo(it){ return it.demo || '🏋️'; }
function exInst(it){ return it.inst || ''; }
function concluirSerie(s, pos, feito, carga){
  const it = s.itens[pos.ex];
  if(!it) return;
  const reg = { n: pos.sr+1, feita: true, pulada: false, repsFeitas: 0, tempoFeitoSeg: 0, distFeitaM: 0, carga: carga||0, ts: new Date().toISOString() };
  if(it.tipo==='reps') reg.repsFeitas = feito;
  else if(it.tipo==='tempo') reg.tempoFeitoSeg = Math.round(feito);
  else reg.distFeitaM = feito;
  it.series.push(reg);
  const faltam = it.meta.series - it.series.filter(x=>x.feita||x.pulada).length;
  if(faltam > 0 && (it.meta.descansoSeg||0) > 0){
    s.serieIdx = pos.sr+1;
    s.descanso = { fimTs: Date.now()+(it.meta.descansoSeg*1000), durSeg: it.meta.descansoSeg, pausado: false, restanteMs: 0, troca: false, prox: '' };
  } else if(faltam <= 0 && pos.ex+1 < s.itens.length){
    // Troca de exercício: descanso configurável na ficha
    const troca = Math.max(0, s.descansoTroca!=null ? s.descansoTroca : 90);
    s.exIdx = pos.ex+1; s.serieIdx = 0;
    s.descanso = troca > 0
      ? { fimTs: Date.now()+(troca*1000), durSeg: troca, pausado: false, restanteMs: 0, troca: true, prox: s.itens[pos.ex+1].nome }
      : null;
  } else if(faltam <= 0){
    s.exIdx = pos.ex+1; s.serieIdx = 0;
  } else {
    s.serieIdx = pos.sr+1;
  }
  saveTreino2(); render();
}
function addDescanso(s, ms){
  const d = s.descanso;
  if(!d) return;
  if(d.pausado) d.restanteMs += ms;
  else d.fimTs += ms;
  d.durSeg += Math.round(ms/1000);
  saveTreino2(); render();
}
function fimDescanso(s, pulado){
  s.descanso = null;
  try{ msStop(); }catch(e){}
  saveTreino2();
  if(!pulado){
    bip(0.7);
    const card = document.getElementById('rest-card');
    if(card){ card.classList.add('rest-flash'); }
  }
  render();
}
// Timer na tela bloqueada (Media Session): mostra o descanso no Android/iOS
// sem precisar desbloquear. Requer o áudio silencioso tocando (loop).
let tSilURL = '', tMSOk = false, tMSec = -1;
function msSilence(){
  if(tSilURL) return tSilURL;
  const n = 4000, buf = new ArrayBuffer(44+n), v = new DataView(buf);
  const ws = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4,36+n,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
  ws(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  tSilURL = URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  return tSilURL;
}
function msStart(s, d){
  try{
    if(!('mediaSession' in navigator)) return;
    const a = document.getElementById('t-silence');
    if(a){ if(!a.src) a.src = msSilence(); a.play().catch(()=>{}); }
    if(!tMSOk){
      tMSOk = true;
      try{ navigator.mediaSession.setActionHandler('play', ()=>{ const x=document.getElementById('t-rpause'); if(x) x.click(); }); }catch(e){}
      try{ navigator.mediaSession.setActionHandler('pause', ()=>{ const x=document.getElementById('t-rpause'); if(x) x.click(); }); }catch(e){}
      try{ navigator.mediaSession.setActionHandler('previoustrack', ()=>{ const x=document.getElementById('t-rskip'); if(x) x.click(); }); }catch(e){}
    }
    tMSec = -1;
    navigator.mediaSession.playbackState = 'playing';
    msTickSessao(s, d);
  }catch(e){}
}
function msTickSessao(s, d){
  try{
    if(!('mediaSession' in navigator) || !d) return;
    const total = Math.max(1, d.durSeg||0);
    const rest = d.pausado ? d.restanteMs : Math.max(0, d.fimTs-Date.now());
    const sec = Math.ceil(rest/1000);
    if(sec===tMSec) return;
    tMSec = sec;
    const el = Math.min(total, Math.max(0, total-Math.round(rest/1000)));
    try{ navigator.mediaSession.setPositionState({ duration: total, playbackRate: d.pausado?0:1, position: el }); }catch(e){}
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Descanso ' + fmtDur(rest),
        artist: (d.troca ? 'Próximo: ' + (d.prox||'') : 'Treino') + ' · ' + (s.fichaNome||''),
        album: 'Treino'
      });
    }catch(e){}
    navigator.mediaSession.playbackState = d.pausado ? 'paused' : 'playing';
  }catch(e){}
}
function msStop(){
  try{
    const a = document.getElementById('t-silence');
    if(a) a.pause();
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
    tMSec = -1;
  }catch(e){}
}
function ligarTick(s){
  if(tTick) clearInterval(tTick);
  tTick = setInterval(()=>{
    if(!document.getElementById('t-dur')){ clearInterval(tTick); tTick = null; return; }
    document.getElementById('t-dur').textContent = 'Tempo ativo ' + fmtDur(durAtiva(s));
    const d = s.descanso;
    if(d && !d.pausado){
      const rest = d.fimTs - Date.now();
      const num = document.getElementById('t-rest-num');
      const fill = document.getElementById('t-rest-fill');
      if(num) num.textContent = Math.max(0, Math.ceil(rest/1000)) + 's';
      if(fill) fill.style.width = Math.max(0, Math.min(100, rest/(d.durSeg*1000)*100)) + '%';
      msTickSessao(s, d);
      if(rest <= 0) fimDescanso(s, false);
    } else if(d && d.pausado){
      const num = document.getElementById('t-rest-num');
      if(num) num.textContent = Math.ceil(d.restanteMs/1000) + 's ⏸';
      msTickSessao(s, d);
    }
  }, 250);
}
function corrigirUltima(s){
  for(let i=s.itens.length-1;i>=0;i--){
    const it = s.itens[i];
    for(let k=it.series.length-1;k>=0;k--){
      if(it.series[k].feita || it.series[k].pulada){
        it.series.splice(k,1);
        s.exIdx = i; s.serieIdx = k;
        s.descanso = null;
        saveTreino2(); render();
        return;
      }
    }
  }
  alert('Nada para corrigir.');
}

  if(s.status==='pausada'){ s.status = 'ativa'; }
  irTreino('resumo');

function calMes(){
  const h = new Date();
  const ano = h.getFullYear(), mes = h.getMonth();

    const m = String(s.inicio||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m && +m[1]===ano && (+m[2]-1)===mes) comTreino[`${m[1]}-${m[2]}-${m[3]}`] = true;
  });
  const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  let html = `<div class="rsec" style="text-transform:capitalize;">${nomes[mes]} ${ano}${tHistDia?' · <span style="color:var(--green)">'+tHistDia.slice(8)+'/'+tHistDia.slice(5,7)+' ✕</span>':''}</div><div class="cal-grid">`;
  ['S','T','Q','Q','S','S','D'].forEach(d=>{ html += `<div class="cal-dow">${d}</div>`; });
  for(let i=0;i<off;i++) html += `<div></div>`;
  for(let d=1;d<=diasNoMes;d++){
    const iso = ano+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    html += `<div class="cal-d${comTreino[iso]?' has':''}${tHistDia===iso?' sel':''}" data-calday="${iso}">${d}</div>`;
  }
  return html + `</div>`;
}

function render(){
  document.querySelectorAll('.aba-nav button').forEach(b=>b.classList.toggle('active', b.dataset.aba===aba));
  if(aba==='treino'){ renderTreino(); return; }
  renderHabitos();
}

function renderHabitos(){
  const root = document.getElementById('root');
  const days = habitDays(periodDays);
  const today = todayISO();
  const nowStr = nowHM();
  const modoHoje = modoDe(today);

  const editingHabit = editingId ? state.habits.find(h=>h.id===editingId) : null;
  const efName = editingHabit ? esc(editingHabit.name) : '';
  const efTime = (editingHabit && editingHabit.time) ? editingHabit.time : '08:00';
  const efTarget = (editingHabit && editingHabit.target!=null) ? editingHabit.target : '';
  const efUnit = editingHabit ? esc(editingHabit.unit||'') : '';
  const efStep = (editingHabit && editingHabit.step!=null) ? editingHabit.step : '';

  const addFormHtml = `
    <div class="add-row">
      <input type="text" id="new-habit-input" placeholder="Novo hábito" value="${efName}">
      <select id="new-habit-cat">${CATS.map(c=>`<option value="${c.key}" ${editingHabit && editingHabit.category===c.key?'selected':''}>${c.label}</option>`).join('')}</select>

      <div class="qty-field"><span class="field-label">Unidade</span><input type="text" id="new-habit-unit" placeholder="L, ml, copos..." value="${efUnit}"></div>

      <button id="add-habit-btn" style="flex:1;">${editingHabit ? 'Salvar alterações' : 'Adicionar hábito'}</button>
      ${editingHabit ? `<button id="cancel-edit-btn" type="button" style="flex:0 0 auto;background:var(--card-2);color:var(--text-dim);border:1px solid var(--border);border-radius:8px;padding:0 .9rem;font-size:.85rem;cursor:pointer;">Cancelar</button>` : ''}

    root.innerHTML = `<div class="card">${addFormHtml}<div class="empty-state">Adicione seu primeiro hábito para começar a acompanhar seus dias.</div></div>`;

  for(const c of CATS) scores[c.key] = catCompletion(c.key, days);

    normal: 'Tente cumprir o plano. Treino quando abrir uma janela.',
    corrido: 'Versões reduzidas valem — use o ½ nos hábitos e um treino curto se der.',
    recuperacao: 'Sem cobrança hoje. Registre o motivo e adie o que der.'

      <button type="button" data-modo="normal" class="${modoHoje==='normal'?'active':''}">Normal</button>

  for(const h of shownTasks){
    const colorHex = CAT_HEX[h.category] || CAT_HEX.disciplina;

          <div class="task-qty-bar"><div class="task-qty-fill" style="width:${pct}%;background:${done?'var(--green)':'var(--blue)'}"></div></div>
          <div class="task-qty-label">${formatNum(amt)}/${formatNum(h.target)} ${esc(h.unit)}</div>
        </div>
        <button class="qty-plus" data-qtyplus="${h.id}">+</button>
        <div class="row-actions">
          <button class="edit-x" data-edit="${h.id}">&#9998;</button>
          <button class="del-x" data-del="${h.id}">&#10005;</button>
        </div>
      </div>`;
    } else {
      const isTime = h.type==='time';
      const red = estadoDe(h, today)==='reduz';
      const late = isTime && !done && h.time < nowStr;
      html += `<div class="task-row ${done?'done':''}" data-toggle="${h.id}">
        <div class="checkbox ${done?'done':''}">${done?'<i>&#10003;</i>':''}</div>
        <div class="task-main">
          <span class="task-name">${esc(h.name)}</span>
          ${red?`<div class="task-time">versão reduzida</div>`:''}
          ${(!red&&isTime)?`<div class="task-time ${late?'late':''}">${h.time}${late?' · atrasado':''}</div>`:''}
        </div>
        ${modoHoje==='corrido'?`<button class="qty-plus" data-reduz="${h.id}" title="Versão reduzida" style="font-size:.7rem;">½</button>`:''}
        <span class="task-dot" style="background:${colorHex}"></span>
        <div class="row-actions">
          <button class="edit-x" data-edit="${h.id}">&#9998;</button>
          <button class="del-x" data-del="${h.id}">&#10005;</button>
        </div>
      </div>`;
    }
  }
  if(list.length>4){
    html += `<div class="more-toggle" id="more-toggle">${showAllTasks ? 'mostrar menos' : `+${list.length-4} tarefas`}</div>`;
  }
  html += `</div>`;

  html += `<div class="card">
    <div class="card-head">
      <div class="card-title"><i>&#9670;</i>VISÃO GERAL</div>
      <div class="period-toggle">
        <button data-days="7" class="${periodDays===7?'active':''}">7d</button>
        <button data-days="14" class="${periodDays===14?'active':''}">14d</button>
        <button data-days="30" class="${periodDays===30?'active':''}">30d</button>
      </div>
    </div>
    <div class="radar-wrap">${radarSVG(scores)}</div>
    <div class="score-cards">
      ${CATS.map(c=>`<div class="score-cell"><div class="lbl" style="color:${CAT_HEX[c.key]}">${c.label}</div><div class="val">${scores[c.key]}</div></div>`).join('')}
    </div>
  </div>`;

  const insights = buildInsights(days);
  html += `<div class="card">
    <div class="card-head"><div class="card-title"><i>&#9679;</i>O QUE OS DADOS MOSTRAM</div></div>
    ${insights.map(l=>`<div class="insight-line"><span class="insight-dot" style="background:${l.c}"></span><span>${l.html}</span></div>`).join('')}
  </div>`;

  html += `<div class="card">
    <div class="card-head"><div class="card-title"><i>&#9638;</i>HISTÓRICO — ÚLTIMOS ${periodDays} DIAS</div></div>
    <div class="hist-scroll"><table class="hist"><thead><tr>
      <th class="hist-name"></th>
      ${days.map(iso=>`<th class="${iso===today?'today':''}">${DOW[dowIndex(iso)]}<br>${dayNum(iso)}</th>`).join('')}
    </tr></thead><tbody>
    ${state.habits.map(h=>`<tr>
      <td class="hist-name">${esc(h.name)}</td>
      ${days.map(iso=>{
        const est = estadoDe(h, iso);
        const future = iso>today;
        const folga = !isScheduled(h, iso);
        const rec = !future && modoDe(iso)==='recuperacao';
        const cls = est==='done' ? 'done' : (est==='reduz' ? 'reduz' : (rec ? 'rec' : ((!est&&!future&&folga) ? 'off' : '')));
        return `<td class="hist-cell-wrap"><div class="hist-cell ${cls}" data-habit="${h.id}" data-date="${iso}"></div></td>`;

    </tr>`).join('')}

  </div>`;

  html += `<div class="card"><div class="card-head">
      <div class="card-title"><i>&#9679;</i>BACKUP</div></div>

    <div class="add-row" style="margin-top:.6rem;">
      <button id="bk-exp" type="button" style="flex:1;">Exportar</button>
      <button id="bk-imp" type="button" style="flex:1;background:var(--card-2);color:var(--text);border:1px solid var(--border);">Importar</button>
    </div>
    <input type="file" id="bk-file" accept="application/json,.json" style="display:none;">
    <div class="task-qty-label" id="bk-msg"></div>
    <span class="field-label" style="margin-top:.8rem;">Sincronização automática (opcional)</span>
    <div class="add-row"><input type="text" id="sync-url" placeholder="URL do Apps Script (/exec)" value=""></div>
    <div class="add-row"><input type="text" id="sync-chave" placeholder="Chave (igual a do script)" value=""></div>
    <div class="task-qty-label" id="sync-msg"></div>
    <div class="add-row" style="margin-top:.4rem;">
      <button id="sync-salvar" type="button" style="flex:1;">Salvar</button>
      <button id="sync-env" type="button" style="flex:1;background:var(--card-2);color:var(--text);border:1px solid var(--border);">Enviar agora</button>

  root.innerHTML = html;
  bindAdd();
  bindBackup();
  root.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', e=>{

    });

  root.querySelectorAll('[data-qtyplus]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const h = state.habits.find(x=>x.id===btn.dataset.qtyplus);
      if(h) addQty(h.id, today, h.step);

  root.querySelectorAll('[data-qtyname]').forEach(el=>{

  root.querySelectorAll('.period-toggle button').forEach(btn=>{

  root.querySelectorAll('.hist-cell:not(.future):not(.off)').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const h = state.habits.find(x=>x.id===cell.dataset.habit);
      if(h && h.type==='quantity') setQty(h, cell.dataset.date);
      else toggleCheckin(cell.dataset.habit, cell.dataset.date);
    });
  });
  root.querySelectorAll('.type-toggle button').forEach(btn=>{
    if(btn.dataset.day!==undefined || btn.dataset.modo!==undefined) return;
    btn.addEventListener('click', ()=>{ addType = btn.dataset.type; render(); focusNameInput(); });
  });
  root.querySelectorAll('#modo-pick button').forEach(btn=>{
    btn.addEventListener('click', ()=>setModo(today, btn.dataset.modo));
  });
  const motivoEl = document.getElementById('modo-motivo');
  if(motivoEl) motivoEl.addEventListener('change', ()=>setMotivo(today, motivoEl.value.trim()));
  root.querySelectorAll('[data-reduz]').forEach(btn=>{

  });
  root.querySelectorAll('#day-pick button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = parseInt(btn.dataset.day, 10);
      if(selDays.includes(d)){ if(selDays.length>1) selDays = selDays.filter(x=>x!==d); }
      else selDays.push(d);
      render();
    });
  });
}

function formatNum(n){
  return (Math.round(n*100)/100).toString().replace('.', ',');
}
function focusNameInput(){
  const el = document.getElementById('new-habit-input');
  if(el) el.focus();
}

function bkMsg(t){ const el = document.getElementById('bk-msg'); if(el) el.textContent = t; }
function bindBackup(){
  const ex = document.getElementById('bk-exp');
  if(!ex) return;
  ex.addEventListener('click', ()=>{
    try{
      const dados = {};
      ['habits-v3','habitos-aba','treino-v1','treino-v2'].forEach(k=>{
        const v = localStorage.getItem(k);
        if(v!=null) dados[k] = v;
      });
      if(!Object.keys(dados).length){ bkMsg('Nada para exportar.'); return; }
      const blob = new Blob([JSON.stringify({ app:'habitos', v:1, quando:new Date().toISOString(), dados })], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'habitos-backup-'+todayISO()+'.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 5000);
      bkMsg('Backup baixado. Guarde o arquivo.');
    }catch(e){ bkMsg('Falha ao exportar.'); }
  });
  const im = document.getElementById('bk-imp');
  const fi = document.getElementById('bk-file');
  if(im && fi){
    im.addEventListener('click', ()=>fi.click());
    fi.addEventListener('change', ()=>{
      const f = fi.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const o = JSON.parse(r.result);
          if(!o || !o.dados || typeof o.dados!=='object') throw 0;
          const chaves = Object.keys(o.dados).filter(k=>['habits-v3','habitos-aba','treino-v1','treino-v2'].includes(k));
          if(!chaves.length) throw 0;
          if(!confirm('Substituir os dados deste aparelho pelos do backup?')){ fi.value=''; return; }
          chaves.forEach(k=>{ try{ localStorage.setItem(k, o.dados[k]); }catch(e){} });
          location.reload();
        }catch(e){ bkMsg('Arquivo inválido.'); fi.value=''; }
      };
      r.readAsText(f);
    });
  }
  const su = document.getElementById('sync-url');
  const sk = document.getElementById('sync-chave');
  if(su && sk){
    try{
      su.value = localStorage.getItem('habitos-sync-url')||'';
      sk.value = localStorage.getItem('habitos-sync-chave')||'';
      const sem = localStorage.getItem('habitos-sync-em');
      if(sem) syncMsg('Última sync: ' + fmtHoraCurta(sem) + '.');
    }catch(e){}
    document.getElementById('sync-salvar').addEventListener('click', ()=>{
      try{
        localStorage.setItem('habitos-sync-url', su.value.trim());
        localStorage.setItem('habitos-sync-chave', sk.value.trim());
      }catch(e){}
      syncMsg('Configuração salva.');
      baixarSeNovo();
    });
    document.getElementById('sync-env').addEventListener('click', ()=>enviarAgora(false));
    document.getElementById('sync-get').addEventListener('click', baixarAgora);
  }
}
function syncCfg(){
  try{
    const url = (localStorage.getItem('habitos-sync-url')||'').trim().replace(/\/+$/,'');
    const chave = (localStorage.getItem('habitos-sync-chave')||'').trim();
    if(!url || !chave) return null;
    return { url, chave };
  }catch(e){ return null; }
}
function syncMsg(t){ const el = document.getElementById('sync-msg'); if(el) el.textContent = t; }
function fmtHoraCurta(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function tocarLocal(){
  try{ localStorage.setItem('habitos-local-em', new Date().toISOString()); }catch(e){}
  agendaEnvio();
}
let tSyncT = null;
function agendaEnvio(){
  if(!syncCfg()) return;
  if(tSyncT) clearTimeout(tSyncT);
  tSyncT = setTimeout(()=>enviarAgora(true), 3000);
}
async function fetchTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const id = setTimeout(()=>{ try{ ctrl.abort(); }catch(e){} }, ms||20000);
  try{ return await fetch(url, Object.assign({}, opts||{}, { signal: ctrl.signal })); }
  finally{ clearTimeout(id); }
}
async function enviarAgora(sil){
  const c = syncCfg();
  if(!c){ if(!sil) syncMsg('Configure URL e chave.'); return; }
  try{
    if(!sil) syncMsg('Enviando...');
    const dados = {};
    ['habits-v3','habitos-aba','treino-v1','treino-v2'].forEach(k=>{
      const v = localStorage.getItem(k);
      if(v!=null) dados[k] = v;
    });
    const r = await fetchTimeout(c.url, { method:'POST', body: JSON.stringify({ chave: c.chave, dados: JSON.stringify(dados) }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'falha');
    const em = String(j.atualizadoEm || new Date().toISOString());
    try{
      localStorage.setItem('habitos-sync-em', em);
      localStorage.setItem('habitos-local-em', em);
    }catch(e){}
    syncMsg('Sincronizado ' + fmtHoraCurta(em) + '.');
  }catch(e){ if(!sil) syncMsg('Falha no envio. Confira internet, URL e chave.'); }
}
function aplicarRemoto(j){
  const o = JSON.parse(j.dados);
  Object.keys(o).filter(k=>['habits-v3','habitos-aba','treino-v1','treino-v2'].includes(k)).forEach(k=>{
    try{ localStorage.setItem(k, o[k]); }catch(e){}
  });
  const em = String(j.atualizadoEm||'');
  try{ localStorage.setItem('habitos-sync-em', em); localStorage.setItem('habitos-local-em', em); }catch(e){}
  location.reload();
}
async function baixarSeNovo(){
  const c = syncCfg();
  if(!c) return;
  try{
    const r = await fetchTimeout(c.url + '?chave=' + encodeURIComponent(c.chave));
    const j = await r.json();
    if(!j.ok || !j.dados) return;
    const rem = String(j.atualizadoEm||'');
    const sem = localStorage.getItem('habitos-sync-em')||'';
    const lem = localStorage.getItem('habitos-local-em')||'';
    if(rem && rem > sem){
      if(lem && lem > sem){
        if(confirm('O outro aparelho tem dados mais novos, mas aqui também tem alterações. Baixar do outro aparelho (o daqui será substituído)?')) aplicarRemoto(j);
      } else aplicarRemoto(j);
    }
  }catch(e){}
}
async function baixarAgora(){
  const c = syncCfg();
  if(!c){ syncMsg('Configure URL e chave.'); return; }
  syncMsg('Baixando...');
  try{
    const r = await fetchTimeout(c.url + '?chave=' + encodeURIComponent(c.chave));
    const j = await r.json();
    if(!j.ok || !j.dados) throw new Error('vazio');
    const sem = localStorage.getItem('habitos-sync-em')||'';
    const lem = localStorage.getItem('habitos-local-em')||'';
    if(lem && sem && lem > sem && !confirm('Há alterações neste aparelho. Baixar do outro aparelho e substituir?')){ syncMsg('Cancelado.'); return; }
    aplicarRemoto(j);
  }catch(e){ syncMsg('Falha ao baixar. Confira internet, URL e chave.'); }
}
function bindAdd(){
  const btn = document.getElementById('add-habit-btn');
  const input = document.getElementById('new-habit-input');
  const sel = document.getElementById('new-habit-cat');
  if(!btn) return;
  const submit = ()=>{
    const name = input.value.trim();
    if(!name) return;
    if(!selDays.length) selDays = [0,1,2,3,4,5,6];
    const data = { name, category: sel.value, type: addType, days: [...selDays] };
    selDays = [0,1,2,3,4,5,6];
    if(addType==='time'){
      const t = document.getElementById('new-habit-time');
      data.time = t ? t.value : '08:00';
    }
    if(addType==='quantity'){
      const tEl = document.getElementById('new-habit-target');
      const uEl = document.getElementById('new-habit-unit');
      const sEl = document.getElementById('new-habit-step');
      data.target = parseFloat((tEl.value||'').replace(',','.')) || 1;
      data.unit = uEl.value || 'un';
      data.step = parseFloat((sEl.value||'').replace(',','.')) || Math.max(1, Math.round(data.target/10));
    }
    if(editingId){
      updateHabit(editingId, data);
      editingId = null;
    } else {
      addHabit(data);
    }
    input.value='';
    const tEl=document.getElementById('new-habit-target'), uEl=document.getElementById('new-habit-unit'), sEl=document.getElementById('new-habit-step');
    if(tEl) tEl.value=''; if(uEl) uEl.value=''; if(sEl) sEl.value='';
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

load();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW falhou', e));
  });
}
</script>
</body>
