  return { iso: datas[datas.length-1], vals: o.medidas[datas[datas.length-1]] };
}
function cargaMaxSemana(n){
  const out = [];
  const conc = treino2.sessoes.filter(x=>x.status==='concluida');
  for(let i=n-1;i>=0;i--){
    const ref = new Date(); ref.setDate(ref.getDate()-i*7);
    const s0 = new Date(ref); s0.setDate(ref.getDate()-((ref.getDay()+6)%7)); s0.setHours(0,0,0,0);
    const s1 = new Date(s0); s1.setDate(s0.getDate()+7);
    let mx = 0;
    conc.forEach(s=>{
      const d = new Date(s.fim||s.inicio);
      if(d<s0 || d>=s1) return;
      (s.itens||[]).forEach(it=>{
        if(evolEx!=='todos' && it.nome!==evolEx) return;
        (it.series||[]).forEach(x=>{ if(x.feita && !x.pulada) mx = Math.max(mx, x.carga||0); });
      });
    });
    out.push({ lbl: String(s0.getDate()).padStart(2,'0')+'/'+String(s0.getMonth()+1).padStart(2,'0'), v: mx });
  }
  return out;
}
function consistenciaSemanal(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const ref = new Date(); ref.setDate(ref.getDate()-i*7);
    const s0 = new Date(ref); s0.setDate(ref.getDate()-((ref.getDay()+6)%7)); s0.setHours(0,0,0,0);
    const s1 = new Date(s0); s1.setDate(s0.getDate()+7);
    let done=0, total=0;
    for(let d=new Date(s0); d<s1; d.setDate(d.getDate()+1)){
      const iso = fmt(d);
      if(iso > todayISO()) break;
      state.habits.forEach(h=>{
        if(!isScheduled(h, iso) || diaNeutro(iso)) return;
        total++; if(isDoneOn(h, iso)) done++;
      });
    }
    out.push({ lbl: String(s0.getDate()).padStart(2,'0')+'/'+String(s0.getMonth()+1).padStart(2,'0'), v: total? Math.round(done/total*100):0 });
  }
  return out;
}
function todosExercicios(){
  const set = {};
  treino2.sessoes.forEach(s=>(s.itens||[]).forEach(it=>{ if(it.nome) set[it.nome]=1; }));
  return Object.keys(set).sort();
}
let evolSemanas = 8;
let evolEx = 'todos';

// ===== PAINEL INTEGRADO (dashboard) =====
function renderPainel(){
  const root = document.getElementById('root');
  const { today, list, done, pct } = resumoHoje();
  const pend = list.filter(h=>!isDoneOn(h, today));
  const streaks = state.habits.map(h=>({h, s:streakAtual(h)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const melhorStreak = streaks[0] ? streaks[0].s : 0;
  const scores = {};
  for(const c of CATS) scores[c.key] = catCompletion(c.key, habitDays(7));
  const scoreGeral = Math.round(CATS.reduce((s,c)=>s+(scores[c.key]||0),0)/CATS.length);
  const ativa = sessaoAtiva();
  const conc = treino2.sessoes.filter(x=>x.status==='concluida')
    .sort((a,b)=>String(b.fim||b.inicio)<String(a.fim||a.inicio)?-1:1);
  const ult = conc[0];
  const { seg, dom } = semAtual();
  const sem = conc.filter(x=>{ const d = new Date(x.fim||x.inicio); return d>=seg && d<dom; });
  const volSem = sem.reduce((a,x)=>a+volSessao(x),0);
  const sems4 = evolucaoSemanal(4);
  const sems6 = evolucaoSemanal(6);
  const insights = buildInsights(habitDays(7));
  const dias7 = habitDays(7);
  const nome = userName();
  const maxV4 = Math.max(1, ...sems4.map(x=>x.vol));
  const proxima = !ativa && !sem.length && treino2.fichas.length ? treino2.fichas[0] : null;

  let html = '';
  // HERO
  html += `<section class="hero">
    <div class="hero-left">
      <div class="eyebrow">${dataLonga()}</div>
      <h2 class="hero-greet">${saudacao()}<span class="hl">${nome?', '+esc(nome):''}</span></h2>
      <p class="hero-date">${list.length ? done+' de '+list.length+' hábitos de hoje concluídos' : 'Nenhum hábito agendado para hoje'}${sem.length ? ' · '+sem.length+' treino(s) na semana' : ''}</p>
      <div class="hero-phrase">${ic('spark',14)} ${fraseDoDia()}</div>
    </div>
    <div class="hero-right">
      <div class="hero-user">
        <div class="nm">${esc(nome || 'Visitante')}</div>
        <div class="rl">${melhorStreak>0 ? 'Sequência de '+melhorStreak+' dias' : 'Comece hoje'}</div>
      </div>
      <div class="avatar lg">${userInitial()}</div>
    </div>
  </section>`;
  // KPIs
  html += `<div class="grid-4" style="margin-bottom:20px;">
    <div class="stat-card" style="--accent:var(--green);--accent-soft:var(--green-soft);animation-delay:.03s">
      <div class="stat-top"><span class="stat-label">Hábitos hoje</span><span class="stat-ic">${ic('check')}</span></div>
      <div class="stat-val">${done}<small>/${list.length}</small></div>
      <div class="stat-sub">${pct>=100?'<span class="up">Dia completo</span>':pct+'% do dia'}</div>
    </div>
    <div class="stat-card" style="--accent:var(--blue);--accent-soft:var(--blue-soft);animation-delay:.08s">
      <div class="stat-top"><span class="stat-label">Consistência 7d</span><span class="stat-ic">${ic('target')}</span></div>
      <div class="stat-val">${scoreGeral}<small>%</small></div>
      <div class="stat-sub">score médio das categorias</div>
    </div>
    <div class="stat-card" style="--accent:var(--purple);--accent-soft:var(--purple-soft);animation-delay:.13s">
      <div class="stat-top"><span class="stat-label">Treinos na semana</span><span class="stat-ic">${ic('dumbbell')}</span></div>
      <div class="stat-val">${sem.length}</div>
      <div class="stat-sub">${formatNum(Math.round(volSem))} kg de volume</div>
    </div>
    <div class="stat-card" style="--accent:var(--amber);--accent-soft:var(--amber-soft);animation-delay:.18s">
      <div class="stat-top"><span class="stat-label">Sequência ativa</span><span class="stat-ic">${ic('flame')}</span></div>
      <div class="stat-val">${melhorStreak}<small>d</small></div>
      <div class="stat-sub">${streaks[0] ? esc(streaks[0].h.name) : 'marque hábitos para iniciar'}</div>
    </div>
  </div>`;
  // ROW 2: atividade diária + treino
  html += `<div class="grid-2" style="margin-bottom:20px;">
    <div class="col col-tight">
      <div class="card">
        <div class="card-head">
          <div class="card-title">${ic('check')} HOJE</div>
          <div class="card-count">${done}/${list.length}</div>
        </div>
        <div class="task-qty-bar" style="height:8px;"><div class="task-qty-fill g" style="width:${pct}%;"></div></div>
        <div class="pending-list" style="margin-top:.7rem;">`;
  if(!list.length){
    html += `<div class="sec-empty">Nenhum hábito agendado para hoje.</div>`;
  } else if(!pend.length){
    html += `<div class="sec-empty">Tudo concluído por hoje. Bom trabalho.</div>`;
  } else {
    pend.slice(0,5).forEach(h=>{
      const colorHex = CAT_HEX[h.category] || CAT_HEX.disciplina;
      if(h.type==='quantity'){
        const amt = qtyOn(h, today);
        const p = Math.min(100, Math.round((amt/h.target)*100));
        html += `<div class="task-row" data-qtyname="${h.id}">
          <span class="task-dot" style="background:${colorHex}"></span>
          <div class="task-main"><span class="task-name">${esc(h.name)}</span>
          <div class="task-qty-bar"><div class="task-qty-fill" style="width:${p}%;"></div></div>
          <div class="task-qty-label">${formatNum(amt)}/${formatNum(h.target)} ${esc(h.unit)}</div></div>
          <button class="qty-plus" data-qtyplus="${h.id}">+</button>
        </div>`;
      } else {
        html += `<div class="task-row" data-toggle="${h.id}">
          <div class="checkbox"></div>
          <div class="task-main"><span class="task-name">${esc(h.name)}</span>
          ${h.type==='time'?`<div class="task-time">${esc(h.time||'')}</div>`:''}</div>
          <span class="task-dot" style="background:${colorHex}"></span>
        </div>`;
      }
    });
    if(pend.length>5) html += `<div class="more-toggle" id="painel-more">+${pend.length-5} pendentes — ver todos</div>`;
  }
  html += `<div class="goto-row"><button class="btn btn-ghost" type="button" data-goto="habitos">${ic('arrow',15)} Abrir Hábitos</button></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">${ic('flame')} SEQUÊNCIAS</div></div>`;
  if(streaks.length){
    html += streaks.slice(0,4).map((x,i)=>`<div class="insight-line"><span class="insight-dot" style="background:${i===0?'var(--amber)':i===1?'var(--green)':'var(--blue)'}"></span><span><b>${esc(x.h.name)}</b> — ${x.s} dia(s) em sequência</span></div>`).join('');
  } else {
    html += `<div class="sec-empty">Marque hábitos para construir sequências.</div>`;
  }
  html += `</div>
    </div>
    <div class="col col-tight">
      <div class="card">
        <div class="card-head">
          <div class="card-title">${ic('dumbbell')} TREINO</div>
          <div class="card-count">${sem.length} na semana</div>
        </div>`;
  if(ativa){
    html += `<div class="insight-line"><span class="insight-dot" style="background:var(--blue)"></span>
        <span><b>${esc(ativa.fichaNome)}</b> em andamento · ${fmtDur(durAtiva(ativa))} · ${seriesFeitasSessao(ativa).f}/${seriesFeitasSessao(ativa).t} séries</span></div>
      <div class="goto-row">
        <button class="btn btn-primary" type="button" id="painel-retomar">${ic('play',15)} Retomar sessão</button>
        <button class="btn btn-danger" type="button" id="painel-descartar">Descartar</button>
      </div>`;
  } else {
    if(ult){
      html += `<div class="insight-line"><span class="insight-dot" style="background:var(--green)"></span>
        <span>Último: <b>${esc(ult.fichaNome)}</b> · ${fmtDataCurta(ult.fim||ult.inicio)} · ${fmtDur(ult.ativoMs||0)} · ${formatNum(Math.round(volSessao(ult)))} kg</span></div>`;
    } else {
      html += `<div class="sec-empty">Nenhum treino concluído ainda.</div>`;
    }
    if(proxima){
      html += `<div class="insight-line"><span class="insight-dot" style="background:var(--purple)"></span>
        <span>Sugestão de hoje: <b>${esc(proxima.nome)}</b> · ${proxima.exercicios.length} exercícios</span></div>`;
    }
    html += `<div class="goto-row">
      <button class="btn btn-primary btn-block" type="button" data-goto="treino">${ic('play',15)} ${treino2.fichas.length?'Abrir Treino':'Criar primeiro treino'}</button>
    </div>`;
  }
  html += `<div class="rsec">Volume semanal (kg)</div>
        <div class="chart-box"><div class="chart-cap"><span>Últimas 6 semanas</span><b>${formatNum(Math.round(volSem))} kg agora</b></div>${chartLinhaSVG(sems6.map(x=>Math.round(x.vol)), sems6.map(x=>x.lbl))}</div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">${ic('activity')} Ritmo — 7 dias</div></div>
        <div class="bar7">`;
  dias7.forEach(iso=>{
    const p = habitPctDia(iso);
    const temTreino = conc.some(x=>String(x.fim||x.inicio).startsWith(iso));
    const h = p<0?0:p;
    const cls = (temTreino?'b treino':(p<0?'b off':'b')) + (iso===today?' hoje':'');
    html += `<div class="${cls}" title="${iso}: ${p<0?'sem hábitos':p+'%'}${temTreino?' · treino':''}"><i style="height:${Math.max(4,h)}%"></i><span>${DOW[dowIndex(iso)].slice(0,3)}</span></div>`;
  });
  html += `</div><div class="legend-row"><span><i style="background:var(--green)"></i> Hábitos do dia</span><span><i style="background:var(--blue)"></i> Dia com treino</span></div>
      </div>
    </div>
  </div>`;
  // EVOLUÇÃO (gráficos)
  html += `<div class="grid-2" style="margin-bottom:20px;">
    <div class="card">
      <div class="card-head"><div class="card-title">${ic('target')} Consistência — 7 dias</div><div class="card-count">${scoreGeral}%</div></div>
      <div class="chart-box"><div class="chart-cap"><span>% de hábitos cumpridos por dia</span></div>${chartBarrasSVG(dias7.map(iso=>{ const p=habitPctDia(iso); return p<0?0:p; }), dias7.map(iso=>DOW[dowIndex(iso)].slice(0,3)))}</div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">${ic('trend')} Evolução — 4 semanas</div></div>
      <div class="chart-box"><div class="chart-cap"><span>Volume de treino (kg)</span><b>${formatNum(Math.round(sems4[3]?sems4[3].vol:0))} kg</b></div>${chartLinhaSVG(sems4.map(x=>Math.round(x.vol)), sems4.map(x=>x.lbl))}</div>
      <div class="rsec">Sessões por semana</div>
      ${sems4.map(x=>`<div class="rrow"><span class="rn">sem ${x.lbl}</span><span class="rbar"><i style="width:${Math.max(x.n>0?8:0,Math.round(x.n/Math.max(1,...sems4.map(y=>y.n))*100))}%"></i></span><span class="rv">${x.n}</span></div>`).join('')}
    </div>
  </div>`;
  // INSIGHTS + RADAR
  html += `<div class="grid-2">
    <div class="card">
      <div class="card-head"><div class="card-title">${ic('spark')} O que os dados mostram</div></div>
      ${insights.map(l=>`<div class="insight-line"><span class="insight-dot" style="background:${l.c}"></span><span>${l.html}</span></div>`).join('')}
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">${ic('layers')} Visão geral — 7 dias</div>
        <button class="card-link" type="button" data-goto="habitos">Detalhes</button></div>
      <div class="radar-wrap">${radarSVG(scores)}</div>
      <div class="score-cards">
        ${CATS.map(c=>`<div class="score-cell"><div class="lbl" style="color:${CAT_HEX[c.key]}">${c.label}</div><div class="val">${scores[c.key]}</div></div>`).join('')}
      </div>
    </div>
  </div>`;

  root.innerHTML = html;
  root.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>irPara(b.dataset.goto)));
  const pm = document.getElementById('painel-more');
  if(pm) pm.addEventListener('click', ()=>irPara('habitos'));
  root.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('[data-del]')) return;
      toggleCheckin(el.dataset.toggle, today);
    });
  });
  root.querySelectorAll('[data-qtyplus]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const h = state.habits.find(x=>x.id===btn.dataset.qtyplus);
      if(h) addQty(h.id, today, h.step);
    });
  });
  root.querySelectorAll('[data-qtyname]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('[data-qtyplus]')) return;
      const h = state.habits.find(x=>x.id===el.dataset.qtyname);
      if(h) setQty(h, today);
    });
  });
  const pr = document.getElementById('painel-retomar');
  if(pr) pr.addEventListener('click', ()=>{ irPara('treino'); irTreino('exec'); });
  const pd = document.getElementById('painel-descartar');
  if(pd) pd.addEventListener('click', ()=>{
    const s0 = sessaoAtiva();
    if(s0 && confirm('Descartar a sessão em andamento?')) cancelarSessao(s0);
  });
}

// ===== EVOLUÇÃO FÍSICA (página) =====
function renderEvolucao(){
  const root = document.getElementById('root');
  const pesos = pesosOrdenados();
  const ultPeso = pesos.length ? pesos[pesos.length-1] : null;
  const priPeso = pesos.length ? pesos[0] : null;
  const deltaPeso = (ultPeso && priPeso && pesos.length>1) ? Math.round((ultPeso.kg - priPeso.kg)*10)/10 : null;
  const med = medidasRecentes();
  const sems = evolucaoSemanal(evolSemanas);
  const cargas = cargaMaxSemana(evolSemanas);
  const consist = consistenciaSemanal(evolSemanas);
  const maxC = Math.max(1, ...cargas.map(x=>x.v));
  const conc = treino2.sessoes.filter(x=>x.status==='concluida');
  const totalSess = conc.length;
  const freqMed = sems.length ? (conc.filter(x=>{ const d=new Date(x.fim||x.inicio); return d >= new Date(Date.now()-evolSemanas*7*86400000); }).length / evolSemanas) : 0;
  const exs = todosExercicios();

  let html = `<div class="section-head">
    <div><div class="eyebrow">Acompanhamento</div><h2>Evolução física</h2><p>Peso, medidas, cargas e frequência — com seus dados reais.</p></div>
    <div class="section-actions">
      <div class="period-toggle">
        <button data-evol-sem="4" class="${evolSemanas===4?'active':''}">4 sem</button>
        <button data-evol-sem="8" class="${evolSemanas===8?'active':''}">8 sem</button>
        <button data-evol-sem="12" class="${evolSemanas===12?'active':''}">12 sem</button>
      </div>
    </div>
  </div>`;
  // KPIs
  html += `<div class="grid-4" style="margin-bottom:20px;">
    <div class="stat-card" style="--accent:var(--blue);--accent-soft:var(--blue-soft)">
      <div class="stat-top"><span class="stat-label">Peso atual</span><span class="stat-ic">${ic('scale')}</span></div>
      <div class="stat-val">${ultPeso ? formatNum(ultPeso.kg)+'<small>kg</small>' : '—'}</div>
      <div class="stat-sub">${deltaPeso!==null ? (deltaPeso>=0?'<span class="up">+':'<span class="down">')+formatNum(deltaPeso)+' kg desde o início</span>' : (ultPeso ? 'registrado em '+fmtDataCurta(ultPeso.iso) : 'sem registro')}</div>
    </div>
    <div class="stat-card" style="--accent:var(--green);--accent-soft:var(--green-soft)">
      <div class="stat-top"><span class="stat-label">Sessões totais</span><span class="stat-ic">${ic('dumbbell')}</span></div>
      <div class="stat-val">${totalSess}</div>
      <div class="stat-sub">histórico completo</div>
    </div>
    <div class="stat-card" style="--accent:var(--purple);--accent-soft:var(--purple-soft)">
      <div class="stat-top"><span class="stat-label">Frequência</span><span class="stat-ic">${ic('activity')}</span></div>
      <div class="stat-val">${(Math.round(freqMed*10)/10)}<small>/sem</small></div>
      <div class="stat-sub">média em ${evolSemanas} semanas</div>
    </div>
    <div class="stat-card" style="--accent:var(--amber);--accent-soft:var(--amber-soft)">
      <div class="stat-top"><span class="stat-label">Carga máxima</span><span class="stat-ic">${ic('trophy')}</span></div>
      <div class="stat-val">${Math.max(0,...cargas.map(x=>x.v))}<small>kg</small></div>
      <div class="stat-sub">${evolEx==='todos'?'todos os exercícios':esc(evolEx)}</div>
    </div>
  </div>`;
  // Peso + medidas
  html += `<div class="grid-2" style="margin-bottom:20px;">
    <div class="card">
      <div class="card-head"><div class="card-title">${ic('scale')} Peso corporal</div>
        <div class="card-count">${pesos.length} registro(s)</div></div>`;
  if(pesos.length>=2){
    html += `<div class="chart-box"><div class="chart-cap"><span>Evolução (kg)</span><b>${formatNum(ultPeso.kg)} kg</b></div>${chartLinhaSVG(pesos.map(p=>p.kg), pesos.map(p=>fmtDataCurta(p.iso)))}</div>`;
  } else if(pesos.length===1){
    html += `<div class="sec-empty">Primeiro registro: ${formatNum(pesos[0].kg)} kg — registre mais um para ver o gráfico.</div>`;
  } else {
    html += `<div class="empty-state">${ic('scale',34)}<br>Nenhum peso registrado ainda.</div>`;
  }
  html += `<div class="add-row mt-1" style="margin-bottom:0;">
      <input type="text" id="evol-peso" inputmode="decimal" placeholder="Peso hoje (kg, ex: 78,5)">
      <button class="btn btn-primary" type="button" id="evol-peso-save">${ic('plus',15)} Registrar</button>
    </div>
    <div class="msg" id="evol-peso-msg"></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">${ic('heart')} Medidas</div>
        ${med?`<div class="card-count">${fmtDataCurta(med.iso)}</div>`:''}</div>`;
  if(med){
    html += `<div class="score-cards" style="grid-template-columns:repeat(2,1fr);">` +
      Object.keys(med.vals).map(k=>`<div class="score-cell"><div class="lbl">${esc(k)}</div><div class="val">${formatNum(med.vals[k])}<span style="font-size:.7rem"> cm</span></div></div>`).join('') +
      `</div>`;
  } else {
    html += `<div class="sec-empty">Sem medidas registradas.</div>`;
  }
  html += `<div class="form-grid mt-1" style="margin-bottom:0;">
      <div class="qty-field"><span class="field-label">Cintura (cm)</span><input type="text" id="evol-cintura" inputmode="decimal" placeholder="80" style="width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:.6rem .75rem;border-radius:10px;"></div>
      <div class="qty-field"><span class="field-label">Quadril (cm)</span><input type="text" id="evol-quadril" inputmode="decimal" placeholder="100" style="width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:.6rem .75rem;border-radius:10px;"></div>
    </div>
    <div class="add-row mt-1" style="margin-bottom:0;">
      <button class="btn btn-ghost btn-block" type="button" id="evol-med-save">${ic('save',15)} Salvar medidas de hoje</button>
    </div>
    <div class="msg" id="evol-med-msg"></div>
    </div>
  </div>`;
  // Cargas + frequência/consistência
  html += `<div class="grid-2" style="margin-bottom:20px;">
    <div class="card">
      <div class="card-head"><div class="card-title">${ic('trophy')} Evolução de cargas</div>
        <select id="evol-ex" style="background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:.45rem .6rem;border-radius:9px;font-size:.78rem;max-width:190px;">
          <option value="todos" ${evolEx==='todos'?'selected':''}>Todos os exercícios</option>
          ${exs.map(e=>`<option value="${esc(e)}" ${evolEx===e?'selected':''}>${esc(e)}</option>`).join('')}
        </select></div>`;
  const temCarga = cargas.some(x=>x.v>0);
  if(temCarga){
    html += `<div class="chart-box"><div class="chart-cap"><span>Carga máxima por semana (kg)</span><b>${Math.max(...cargas.map(x=>x.v))} kg</b></div>${chartBarrasSVG(cargas.map(x=>x.v), cargas.map(x=>x.lbl))}</div>`;
    html += cargas.slice().reverse().map(x=>`<div class="rrow"><span class="rn">sem ${x.lbl}</span><span class="rbar"><i style="width:${Math.max(x.v>0?8:0,Math.round(x.v/maxC*100))}%"></i></span><span class="rv">${x.v}</span></div>`).join('');
  } else {
    html += `<div class="empty-state">${ic('trophy',34)}<br>Séries com carga ainda não registradas neste período.</div>`;
  }
  html += `</div>
    <div class="card">
      <div class="card-head"><div class="card-title">${ic('target')} Consistência dos hábitos</div>
        <div class="card-count">${consist.length?consist[consist.length-1].v:0}% agora</div></div>
      <div class="chart-box"><div class="chart-cap"><span>% de conclusão semanal</span></div>${chartBarrasSVG(consist.map(x=>x.v), consist.map(x=>x.lbl))}</div>
      <div class="rsec">Frequência de treinos</div>
      ${sems.map(x=>`<div class="rrow"><span class="rn">sem ${x.lbl}</span><span class="rbar"><i style="width:${Math.max(x.n>0?8:0,Math.round(x.n/Math.max(1,...sems.map(y=>y.n))*100))}%"></i></span><span class="rv">${x.n}</span></div>`).join('')}
    </div>
  </div>`;

  root.innerHTML = html;

// ===== HISTÓRICO GERAL (página) =====
let histGFiltro = 30, histGTipo = 'tudo', histGBusca = '', histGDia = '', histGExp = '';
function renderHistoricoGeral(){
  const root = document.getElementById('root');
  const hoje = todayISO();
  const lim = new Date(); lim.setDate(lim.getDate()-histGFiltro+1); lim.setHours(0,0,0,0);
  const conc = treino2.sessoes.filter(x=>x.status==='concluida')
    .sort((a,b)=>String(b.fim||b.inicio)<String(a.fim||a.inicio)?-1:1);
  const q = histGBusca.trim().toLowerCase();
  const sessoes = conc.filter(s=>{
    const d = new Date(s.fim||s.inicio);
    if(d < lim) return false;
    if(histGDia && !String(s.inicio||'').startsWith(histGDia)) return false;
    if(q && !(s.fichaNome||'').toLowerCase().includes(q) && !(s.itens||[]).some(it=>it.nome.toLowerCase().includes(q))) return false;
    return true;
  });
  // dias com treino no mês atual + dias com hábitos concluídos
  const now = new Date();
  const ano = now.getFullYear(), mes = now.getMonth();
  const treinoDias = {}, habDias = {};
  conc.forEach(s=>{
    const m = String(s.inicio||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m && +m[1]===ano && (+m[2]-1)===mes) treinoDias[`${m[1]}-${m[2]}-${m[3]}`] = true;
  });
  Object.keys(state.checkins||{}).forEach(iso=>{
    const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m && +m[1]===ano && (+m[2]-1)===mes){
      const feitos = state.habits.filter(h=>isDoneOn(h, iso)).length;
      if(feitos>0) habDias[iso] = true;
    }
  });
  const totalPeriodo = sessoes.length;
  const volPeriodo = sessoes.reduce((a,x)=>a+volSessao(x),0);
  const tempoPeriodo = Math.round(sessoes.reduce((a,x)=>a+(x.ativoMs||0),0)/60000);
  const diasAtivos = new Set(sessoes.map(s=>String(s.fim||s.inicio).slice(0,10))).size;
  const streaks = state.habits.map(h=>streakAtual(h));
  const melhor = streaks.length?Math.max(...streaks):0;

  let html = `<div class="section-head">
    <div><div class="eyebrow">Registro</div><h2>Histórico</h2><p>Sessões de treino e dias de hábitos em um só lugar.</p></div>
    <div class="section-actions">
      <div class="period-toggle">
        <button data-hg-per="7" class="${histGFiltro===7?'active':''}">7 dias</button>
        <button data-hg-per="30" class="${histGFiltro===30?'active':''}">30 dias</button>
        <button data-hg-per="90" class="${histGFiltro===90?'active':''}">90 dias</button>
      </div>
    </div>
  </div>`;
  // Estatísticas
  html += `<div class="grid-4" style="margin-bottom:20px;">
    <div class="stat-card" style="--accent:var(--green);--accent-soft:var(--green-soft)">
      <div class="stat-top"><span class="stat-label">Sessões</span><span class="stat-ic">${ic('dumbbell')}</span></div>
      <div class="stat-val">${totalPeriodo}</div><div class="stat-sub">no período</div>
    </div>
    <div class="stat-card" style="--accent:var(--blue);--accent-soft:var(--blue-soft)">
      <div class="stat-top"><span class="stat-label">Volume</span><span class="stat-ic">${ic('activity')}</span></div>
      <div class="stat-val">${formatNum(Math.round(volPeriodo))}<small>kg</small></div><div class="stat-sub">total levantado</div>
    </div>
    <div class="stat-card" style="--accent:var(--purple);--accent-soft:var(--purple-soft)">
      <div class="stat-top"><span class="stat-label">Dias ativos</span><span class="stat-ic">${ic('cal')}</span></div>
      <div class="stat-val">${diasAtivos}</div><div class="stat-sub">com treino · ${tempoPeriodo} min</div>
    </div>
    <div class="stat-card" style="--accent:var(--amber);--accent-soft:var(--amber-soft)">
      <div class="stat-top"><span class="stat-label">Melhor sequência</span><span class="stat-ic">${ic('flame')}</span></div>
      <div class="stat-val">${melhor}<small>d</small></div><div class="stat-sub">de hábitos</div>
    </div>
  </div>`;
  html += `<div class="grid-23" style="margin-bottom:20px;">
    <div class="col">
      <div class="card">
        <div class="card-head"><div class="card-title">${ic('cal')} Calendário — ${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][mes]} ${ano}</div>
          ${histGDia?`<button class="card-link" type="button" id="hg-clear">${histGDia.slice(8)+'/'+histGDia.slice(5,7)} ✕</button>`:''}</div>
        <div class="cal-grid">`;
  ['S','T','Q','Q','S','S','D'].forEach(d=>{ html += `<div class="cal-dow">${d}</div>`; });
  const off = (new Date(ano, mes, 1).getDay()+6)%7;
  for(let i=0;i<off;i++) html += `<div></div>`;
  const diasNoMes = new Date(ano, mes+1, 0).getDate();
  for(let d=1;d<=diasNoMes;d++){
    const iso = ano+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const t = treinoDias[iso], hb = habDias[iso];
    const cls = [ 'cal-d', t&&hb?'ambos':(t?'treino':(hb?'has':'')), histGDia===iso?'sel':'', iso>hoje?'out':'' ].filter(Boolean).join(' ');
    const tit = (t?'treino ':'')+(hb?'hábitos':'');
    html += `<div class="${cls}" data-hg-day="${iso}" title="${tit.trim()}">${d}</div>`;
  }
  html += `</div>
        <div class="legend-row">
          <span><i style="background:var(--green-soft);border:1px solid rgba(34,197,94,.5)"></i> Hábitos concluídos</span>
          <span><i style="background:var(--blue);box-shadow:inset 0 -3px 0 #1D4ED8"></i> Treino realizado</span>
          <span><i style="background:linear-gradient(135deg,rgba(34,197,94,.35),rgba(59,130,246,.35))"></i> Ambos</span>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">${ic('spark')} Estatísticas do período</div></div>
        <div class="insight-line"><span class="insight-dot" style="background:var(--green)"></span><span><b>${totalPeriodo}</b> sessões concluídas em ${histGFiltro} dias</span></div>
        <div class="insight-line"><span class="insight-dot" style="background:var(--blue)"></span><span>Volume total de <b>${formatNum(Math.round(volPeriodo))} kg</b> em <b>${tempoPeriodo} min</b> ativos</span></div>
        <div class="insight-line"><span class="insight-dot" style="background:var(--purple)"></span><span>Média de <b>${totalPeriodo?formatNum(Math.round(volPeriodo/totalPeriodo)):0} kg</b> por sessão</span></div>
        <div class="insight-line"><span class="insight-dot" style="background:var(--amber)"></span><span>Melhor sequência de hábitos: <b>${melhor} dias</b></span></div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-head"><div class="card-title">${ic('clock')} Sessões</div><div class="card-count">${sessoes.length}</div></div>
        <div class="add-row"><input type="text" id="hg-busca" placeholder="Buscar ficha ou exercício..." value="${esc(histGBusca)}"></div>`;
  if(!sessoes.length){
    html += `<div class="empty-state">${ic('cal',34)}<br>Nenhuma sessão neste filtro.</div>`;
  }
  sessoes.slice(0,40).forEach(s=>{
    const { f, t } = seriesFeitasSessao(s);
    const prev = conc.filter(x=>x.fichaId===s.fichaId && String(x.fim||x.inicio)<String(s.fim||s.inicio)).sort((a,b)=>String(b.fim||b.inicio)<String(a.fim||a.inicio)?-1:1)[0];
    let delta = '';
    if(prev){
      const dv = Math.round(volSessao(s)-volSessao(prev));
      const dt = Math.round(((s.ativoMs||0)-(prev.ativoMs||0))/60000);
      delta = `<div class="delta ${dv>=0?'pos':'neg'}">vs anterior: ${dv>=0?'+':''}${formatNum(dv)} kg · ${dt>=0?'+':''}${dt} min</div>`;
    }
    const open = histGExp===s.id;
    html += `<div class="sess-row" data-hg-exp="${s.id}">
      <div class="sess-top">
        <span class="sess-dot" style="background:${open?'var(--blue)':'var(--green)'}"></span>
        <span class="sess-nm">${esc(s.fichaNome)}</span>
        <span class="sess-when">${fmtDataCurta(s.fim||s.inicio)} · ${fmtHora(s.fim||s.inicio)}</span>
      </div>
      <div class="sess-stats">
        <span>${ic('clock',12)} <b>${fmtDur(s.ativoMs||0)}</b></span>
        <span>${ic('check',12)} <b>${f}/${t}</b> séries</span>
        <span>${ic('activity',12)} <b>${formatNum(Math.round(volSessao(s)))}</b> kg</span>
        ${s.esforco?`<span>${ic('bolt',12)} esforço <b>${s.esforco}/5</b></span>`:''}
      </div>
      ${open?`<div class="sess-detail">
        ${delta}
        ${s.itens.map(it=>{
          const fd = it.series.filter(x=>x.feita&&!x.pulada);
          return `<div class="insight-line" style="padding:.4rem 0;"><span class="insight-dot" style="background:${fd.length>=it.meta.series?'var(--green)':'var(--text-faint)'}"></span>
            <span>${esc(it.nome)} — ${fd.map(x=>it.tipo==='reps'?x.repsFeitas:(it.tipo==='tempo'?x.tempoFeitoSeg+'s':x.distFeitaM+'m')).join(', ')||'—'}${it.series.some(x=>x.pulada)?' · pulou':''}</span></div>`;
        }).join('')}
        ${s.esforco?`<div class="task-qty-label">Esforço ${s.esforco}/5 · energia ${s.energia||'–'}/5${s.obs?' · '+esc(s.obs):''}</div>`:''}
      </div>`:''}
    </div>`;
  });
  html += `</div>
    </div>
  </div>`;

  root.innerHTML = html;
  root.querySelectorAll('[data-hg-per]').forEach(b=>b.addEventListener('click', ()=>{ histGFiltro = parseInt(b.dataset.hgPer,10)||30; render(); }));
  root.querySelectorAll('[data-hg-day]').forEach(el=>el.addEventListener('click', ()=>{
    histGDia = (histGDia===el.dataset.hgDay) ? '' : el.dataset.hgDay;
    render();
  }));
  root.querySelectorAll('[data-hg-exp]').forEach(el=>el.addEventListener('click', ()=>{
    histGExp = (histGExp===el.dataset.hgExp) ? '' : el.dataset.hgExp;
    render();
  }));
  const cl = document.getElementById('hg-clear');
  if(cl) cl.addEventListener('click', ()=>{ histGDia=''; render(); });
  const hb = document.getElementById('hg-busca');
  if(hb) hb.addEventListener('input', ()=>{
    histGBusca = hb.value; render();
    const n = document.getElementById('hg-busca');
    if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  });
}

      </div>
    </div>
  </div>`;

  html += `<div class="chips">
    <button type="button" class="chip ${habCat==='todos'?'active':''}" data-cat="todos">Todos</button>
    ${CATS.map(c=>`<button type="button" class="chip ${habCat===c.key?'active':''}" data-cat="${c.key}"><span class="dot" style="color:${CAT_HEX[c.key]}"></span>${c.label}</button>`).join('')}
  </div>`;

  html += `<div class="grid-23" style="margin-bottom:20px;">
    <div class="col col-tight">
      <div class="card">
        <div class="card-head"><div class="card-title">${ic('bolt')} MODO DE HOJE</div></div>
        <div class="type-toggle" id="modo-pick">
          <button type="button" data-modo="normal" class="${modoHoje==='normal'?'active':''}">Normal</button>
          <button type="button" data-modo="corrido" class="${modoHoje==='corrido'?'active':''}">Corrido</button>
          <button type="button" data-modo="recuperacao" class="${modoHoje==='recuperacao'?'active':''}">Recuperação</button>
        </div>
        <div class="add-row" style="margin-bottom:0;">
          <input type="text" id="modo-motivo" placeholder="Motivo (ex: plantio o dia todo, doente...)" value="${esc(motivoDe(today))}">
        </div>
        <div class="modo-tip">${DICAS_MODO[modoHoje]}</div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">${ic('plus')} ${editingHabit?'EDITAR HÁBITO':'NOVO HÁBITO'}</div></div>
        ${addFormHtml}
      </div>
      <div class="card">
        <div class="card-head">
          <div class="card-title">${ic('check')} RESUMO DO DIA</div>
          <div class="card-count">${doneToday}/${list.length}</div>
        </div>
        ${descansoHoje.length?`<div class="task-qty-label" style="margin:-.4rem 0 .8rem;">Folga hoje: ${descansoHoje.map(h=>esc(h.name)).join(', ')}</div>`:''}`;

  if(!listF.length){
    html += `<div class="sec-empty">Nenhum hábito nesta categoria hoje.</div>`;
  }
  for(const h of shownTasks){
    const colorHex = CAT_HEX[h.category] || CAT_HEX.disciplina;
    const done = isDoneOn(h, today);
    const st = streakAtual(h);
    const stPill = st>1 ? `<span class="streak-pill">${st} dias</span>` : '';

    if(h.type==='quantity'){
      const amt = qtyOn(h, today);
      const pct = Math.min(100, Math.round((amt/h.target)*100));
      html += `<div class="task-row" data-qtyname="${h.id}">
        <span class="task-dot" style="background:${colorHex}"></span>
        <div class="task-main">
          <span class="task-name" style="${done?'color:var(--green)':''}">${esc(h.name)}${stPill}</span>
          <div class="task-qty-bar"><div class="task-qty-fill ${done?'g':''}" style="width:${pct}%;"></div></div>
          <div class="task-qty-label">${formatNum(amt)}/${formatNum(h.target)} ${esc(h.unit)}</div>
        </div>
        <button class="qty-plus" data-qtyplus="${h.id}">+</button>
        <div class="row-actions">
          <button class="edit-x" data-edit="${h.id}">${ic('pencil',13)}</button>
          <button class="del-x" data-del="${h.id}">${ic('x',13)}</button>
        </div>
      </div>`;
    } else {
      const isTime = h.type==='time';
      const red = estadoDe(h, today)==='reduz';
      const late = isTime && !done && h.time < nowStr;
      html += `<div class="task-row ${done?'done':''}" data-toggle="${h.id}">
        <div class="checkbox ${done?'done':''}">${done?'<i>&#10003;</i>':''}</div>
        <div class="task-main">
          <span class="task-name">${esc(h.name)}${stPill}</span>
          ${red?`<div class="task-time">versão reduzida</div>`:''}
          ${(!red&&isTime)?`<div class="task-time ${late?'late':''}">${h.time}${late?' · atrasado':''}</div>`:''}
        </div>
        ${modoHoje==='corrido'?`<button class="qty-plus" data-reduz="${h.id}" title="Versão reduzida" style="font-size:.7rem;">½</button>`:''}
        <span class="task-dot" style="background:${colorHex}"></span>
        <div class="row-actions">
          <button class="edit-x" data-edit="${h.id}">${ic('pencil',13)}</button>
          <button class="del-x" data-del="${h.id}">${ic('x',13)}</button>
        </div>
      </div>`;
    }
  }
  if(listF.length>4){
    html += `<div class="more-toggle" id="more-toggle">${showAllTasks ? 'mostrar menos' : `+${listF.length-4} tarefas`}</div>`;
  }
  html += `</div>
    </div>
    <div class="col col-tight">
      <div class="card">
        <div class="card-head">
          <div class="card-title">${ic('layers')} VISÃO GERAL</div>
          <div class="card-count">${scores && Math.round(CATS.reduce((s,c)=>s+(scores[c.key]||0),0)/CATS.length)}% médio</div>
        </div>
        <div class="radar-wrap">${radarSVG(scores)}</div>
        <div class="score-cards">
          ${CATS.map(c=>`<div class="score-cell"><div class="lbl" style="color:${CAT_HEX[c.key]}">${c.label}</div><div class="val">${scores[c.key]}</div></div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">${ic('spark')} O QUE OS DADOS MOSTRAM</div></div>
        ${buildInsights(days).map(l=>`<div class="insight-line"><span class="insight-dot" style="background:${l.c}"></span><span>${l.html}</span></div>`).join('')}
      </div>
    </div>
  </div>`;

  html += `<div class="card">
    <div class="card-head"><div class="card-title">${ic('cal')} HISTÓRICO — ÚLTIMOS ${periodDays} DIAS</div></div>
    <div class="hist-scroll"><table class="hist"><thead><tr>
      <th class="hist-name"></th>
      ${days.map(iso=>`<th class="${iso===today?'today':''}">${DOW[dowIndex(iso)]}<br>${dayNum(iso)}</th>`).join('')}
    </tr></thead><tbody>
    ${state.habits.map(h=>`<tr>
      <td class="hist-name">${esc(h.name)}</td>
      ${days.map(iso=>{
        const est = estadoDe(h, iso);
        const future = iso>today;
        const folga = !isScheduled(h, iso);
        const rec = !future && modoDe(iso)==='recuperacao';
        const cls = est==='done' ? 'done' : (est==='reduz' ? 'reduz' : (rec ? 'rec' : ((!est&&!future&&folga) ? 'off' : '')));
        return `<td class="hist-cell-wrap"><div class="hist-cell ${cls}" data-habit="${h.id}" data-date="${iso}"></div></td>`;
      }).join('')}
    </tr>`).join('')}
    </tbody></table></div>
  </div>`;

  root.innerHTML = html;
  bindAdd();
  root.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('[data-del]')) return;
      toggleCheckin(el.dataset.toggle, today);
    });
  });
  root.querySelectorAll('[data-qtyplus]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const h = state.habits.find(x=>x.id===btn.dataset.qtyplus);
      if(h) addQty(h.id, today, h.step);
    });
  });
  root.querySelectorAll('[data-qtyname]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('[data-qtyplus]') || e.target.closest('[data-del]')) return;
      const h = state.habits.find(x=>x.id===el.dataset.qtyname);
      if(h) setQty(h, today);
    });
  });
  root.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      if(confirm('Remover este hábito e todo o histórico dele?')) deleteHabit(btn.dataset.del);
    });
  });
  root.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      startEdit(btn.dataset.edit);
    });
  });
  const moreToggle = document.getElementById('more-toggle');
  if(moreToggle) moreToggle.addEventListener('click', ()=>{ showAllTasks = !showAllTasks; render(); });
  root.querySelectorAll('.period-toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ periodDays = parseInt(btn.dataset.days,10); render(); });
  });
  root.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ habCat = btn.dataset.cat; render(); });
  });
  root.querySelectorAll('.hist-cell:not(.future):not(.off)').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const h = state.habits.find(x=>x.id===cell.dataset.habit);
      if(h && h.type==='quantity') setQty(h, cell.dataset.date);
      else toggleCheckin(cell.dataset.habit, cell.dataset.date);
    });
  });
  root.querySelectorAll('#modo-pick button').forEach(btn=>{
    btn.addEventListener('click', ()=>setModo(today, btn.dataset.modo));
  });
  const motivoEl = document.getElementById('modo-motivo');
  if(motivoEl) motivoEl.addEventListener('change', ()=>setMotivo(today, motivoEl.value.trim()));
  root.querySelectorAll('[data-reduz]').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); toggleReduzida(btn.dataset.reduz, today); });
  });
}
function formatNum(n){
  return (Math.round(n*100)/100).toString().replace('.', ',');
}
function focusNameInput(){
  const el = document.getElementById('new-habit-input');
  if(el) el.focus();
}

function bkMsg(t){ const el = document.getElementById('bk-msg'); if(el) el.textContent = t; }
function bindBackup(){
  const ex = document.getElementById('bk-exp');
  if(!ex) return;
  ex.addEventListener('click', ()=>{
    try{
      const dados = {};
      ['habits-v3','habitos-aba','treino-v1','treino-v2','evolucao-v1'].forEach(k=>{
        const v = localStorage.getItem(k);
        if(v!=null) dados[k] = v;
      });
      if(!Object.keys(dados).length){ bkMsg('Nada para exportar.'); return; }
      const blob = new Blob([JSON.stringify({ app:'habitos', v:1, quando:new Date().toISOString(), dados })], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'habitos-backup-'+todayISO()+'.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 5000);
      bkMsg('Backup baixado. Guarde o arquivo.');
    }catch(e){ bkMsg('Falha ao exportar.'); }
  });
  const im = document.getElementById('bk-imp');
  const fi = document.getElementById('bk-file');
  if(im && fi){
    im.addEventListener('click', ()=>fi.click());
    fi.addEventListener('change', ()=>{
      const f = fi.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const o = JSON.parse(r.result);
          if(!o || !o.dados || typeof o.dados!=='object') throw 0;
          const chaves = Object.keys(o.dados).filter(k=>['habits-v3','habitos-aba','treino-v1','treino-v2','evolucao-v1'].includes(k));
          if(!chaves.length) throw 0;
          if(!confirm('Substituir os dados deste aparelho pelos do backup?')){ fi.value=''; return; }
          chaves.forEach(k=>{ try{ localStorage.setItem(k, o.dados[k]); }catch(e){} });
          location.reload();
        }catch(e){ bkMsg('Arquivo inválido.'); fi.value=''; }
      };
      r.readAsText(f);
    });
  }
  const su = document.getElementById('sync-url');
  const sk = document.getElementById('sync-chave');
  if(su && sk){
    try{
      su.value = localStorage.getItem('habitos-sync-url')||'';
      sk.value = localStorage.getItem('habitos-sync-chave')||'';
      const sem = localStorage.getItem('habitos-sync-em');
      if(sem) syncMsg('Última sync: ' + fmtHoraCurta(sem) + '.');
    }catch(e){}
    document.getElementById('sync-salvar').addEventListener('click', ()=>{
      let u = su.value.trim();
      const k = sk.value.trim();
      if(k && !u) u = SYNC_URL_PADRAO;
      try{
        localStorage.setItem('habitos-sync-url', u);
        localStorage.setItem('habitos-sync-chave', k);
        su.value = u;
      }catch(e){}
      syncMsg(k ? 'Configuração salva. Sincronizando...' : 'Chave vazia.');
      if(k){ iniciarAutoPull(); baixarSeNovo(); enviarAgora(true); }
    });
    document.getElementById('sync-env').addEventListener('click', ()=>enviarAgora(false));
    document.getElementById('sync-get').addEventListener('click', baixarAgora);
  }
}
function syncCfg(){
  try{
    const url = (localStorage.getItem('habitos-sync-url')||'').trim().replace(/\/+$/,'');
    const chave = (localStorage.getItem('habitos-sync-chave')||'').trim();
    if(!url || !chave) return null;
    return { url, chave };
  }catch(e){ return null; }
}
function syncMsg(t){ const el = document.getElementById('sync-msg'); if(el) el.textContent = t; }
function fmtHoraCurta(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function tocarLocal(){
  try{ localStorage.setItem('habitos-local-em', new Date().toISOString()); }catch(e){}
  agendaEnvio();
}
let tSyncT = null;
function agendaEnvio(){
  if(!syncCfg()) return;
  if(tSyncT) clearTimeout(tSyncT);
  tSyncT = setTimeout(()=>{ tSyncT = null; enviarAgora(true); }, 3000);
}
function flushEnvioPendente(){
  if(tSyncT){ clearTimeout(tSyncT); tSyncT = null; enviarAgora(true); }
}
let tAutoPull = null;
function iniciarAutoPull(){
  if(!syncCfg()) return;
  if(tAutoPull) clearInterval(tAutoPull);
  tAutoPull = setInterval(()=>{ baixarSeNovo(); }, 45000);
}
async function fetchTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const id = setTimeout(()=>{ try{ ctrl.abort(); }catch(e){} }, ms||20000);
  try{ return await fetch(url, Object.assign({}, opts||{}, { signal: ctrl.signal })); }
  finally{ clearTimeout(id); }
}
async function enviarAgora(sil){
  const c = syncCfg();
  if(!c){ if(!sil) syncMsg('Configure URL e chave.'); return; }
  try{
    if(!sil) syncMsg('Enviando...');
    const dados = {};
    ['habits-v3','habitos-aba','treino-v1','treino-v2','evolucao-v1'].forEach(k=>{
      const v = localStorage.getItem(k);
      if(v!=null) dados[k] = v;
    });
    const r = await fetchTimeout(c.url, { method:'POST', body: JSON.stringify({ chave: c.chave, dados: JSON.stringify(dados) }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'falha');
    const em = String(j.atualizadoEm || new Date().toISOString());
    try{
      localStorage.setItem('habitos-sync-em', em);
      localStorage.setItem('habitos-local-em', em);
    }catch(e){}
    syncMsg('Sincronizado ' + fmtHoraCurta(em) + '.');
  }catch(e){ if(!sil) syncMsg('Falha no envio. Confira internet, URL e chave.'); }
}
function aplicarRemoto(j){
  const o = JSON.parse(j.dados);
  Object.keys(o).filter(k=>['habits-v3','habitos-aba','treino-v1','treino-v2','evolucao-v1'].includes(k)).forEach(k=>{
    try{ localStorage.setItem(k, o[k]); }catch(e){}
  });
  const em = String(j.atualizadoEm||'');
  try{ localStorage.setItem('habitos-sync-em', em); localStorage.setItem('habitos-local-em', em); }catch(e){}
  location.reload();
}
async function baixarSeNovo(){
  const c = syncCfg();
  if(!c) return;
  try{
    const r = await fetchTimeout(c.url + '?chave=' + encodeURIComponent(c.chave));
    const j = await r.json();
    if(!j.ok || !j.dados) return;
    const rem = String(j.atualizadoEm||'');
    const sem = localStorage.getItem('habitos-sync-em')||'';
    const lem = localStorage.getItem('habitos-local-em')||'';
    if(rem && rem > sem){
      if(lem && lem > sem){
        if(confirm('O outro aparelho tem dados mais novos, mas aqui também tem alterações. Baixar do outro aparelho (o daqui será substituído)?')) aplicarRemoto(j);
      } else aplicarRemoto(j);
    }
  }catch(e){}
}
async function baixarAgora(){
  const c = syncCfg();
  if(!c){ syncMsg('Configure URL e chave.'); return; }
  syncMsg('Baixando...');
  try{
    const r = await fetchTimeout(c.url + '?chave=' + encodeURIComponent(c.chave));
    const j = await r.json();
    if(!j.ok || !j.dados) throw new Error('vazio');
    const sem = localStorage.getItem('habitos-sync-em')||'';
    const lem = localStorage.getItem('habitos-local-em')||'';
    if(lem && sem && lem > sem && !confirm('Há alterações neste aparelho. Baixar do outro aparelho e substituir?')){ syncMsg('Cancelado.'); return; }
    aplicarRemoto(j);
  }catch(e){ syncMsg('Falha ao baixar. Confira internet, URL e chave.'); }
}
function bindAdd(){
  const btn = document.getElementById('add-habit-btn');
  const input = document.getElementById('new-habit-input');
  const sel = document.getElementById('new-habit-cat');
  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', ()=>{ editingId = null; selDays = [0,1,2,3,4,5,6]; render(); });
  document.querySelectorAll('.type-toggle button').forEach(b=>{
    if(b.dataset.day!==undefined || b.dataset.modo!==undefined) return;
    if(!b.dataset.type) return;
    b.addEventListener('click', ()=>{ addType = b.dataset.type; render(); focusNameInput(); });
  });
  document.querySelectorAll('#day-pick button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const d = parseInt(b.dataset.day, 10);
      if(selDays.includes(d)){ if(selDays.length>1) selDays = selDays.filter(x=>x!==d); }
      else selDays.push(d);
      render();
    });
  });
  if(!btn) return;
  const submit = ()=>{
    const name = input.value.trim();
    if(!name) return;
    if(!selDays.length) selDays = [0,1,2,3,4,5,6];
    const data = { name, category: sel.value, type: addType, days: [...selDays] };
    selDays = [0,1,2,3,4,5,6];
    if(addType==='time'){
      const t = document.getElementById('new-habit-time');
      data.time = t ? t.value : '08:00';
    }
    if(addType==='quantity'){
      const tEl = document.getElementById('new-habit-target');
      const uEl = document.getElementById('new-habit-unit');
      const sEl = document.getElementById('new-habit-step');
      data.target = parseFloat((tEl.value||'').replace(',','.')) || 1;
      data.unit = uEl.value || 'un';
      data.step = parseFloat((sEl.value||'').replace(',','.')) || Math.max(1, Math.round(data.target/10));
    }
    if(editingId){
      updateHabit(editingId, data);
      editingId = null;
    } else {
      addHabit(data);
    }
    input.value='';
    const tEl=document.getElementById('new-habit-target'), uEl=document.getElementById('new-habit-unit'), sEl=document.getElementById('new-habit-step');
    if(tEl) tEl.value=''; if(uEl) uEl.value=''; if(sEl) sEl.value='';
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

load();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW falhou', e));
  });
}
</script>
</body>
</html>
