<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estufas">
<meta name="theme-color" content="#0D1B13">
<title>Pulverizações</title>
<style>
  :root{
    --bg:#F2F5EF; --ink:#1D2B22; --leaf:#234D35; --leaf-dark:#173425;
    --paper:#FFFFFF; --line:#DCE3D8; --pend:#C68A2E; --feito:#3D7A5C; --danger:#B5432F;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:100px;}
  header{background:var(--leaf-dark); color:#fff; padding:16px 20px 20px; position:sticky; top:0; z-index:5;}
  header a{color:#CFE0D3; text-decoration:none; font-size:13px;}
  header h1{margin:6px 0 0; font-size:20px;}
  .tabs{display:flex; gap:8px; margin:14px 20px 0;}
  .tab{flex:1; text-align:center; padding:9px 0; border-radius:9px; font-size:13px; background:var(--paper); border:1px solid var(--line); cursor:pointer; color:var(--ink);}
  .tab.active{background:var(--leaf); color:#fff; border-color:var(--leaf);}
  .estufa-filter{display:flex; align-items:center; gap:8px; margin:10px 20px 0;}
  .estufa-filter label{font-size:12px; color:#CFE0D3;}
  .estufa-filter select{flex:1; padding:8px 10px; border-radius:8px; border:none; font-size:13px; background:rgba(255,255,255,.12); color:#fff;}
  .estufa-filter select option{color:#000;}
  main{padding:16px 20px;}
  .empty{text-align:center; color:#6C7A67; font-size:14px; margin-top:40px;}
  .item{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .badge{
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; font-weight:600;
    background:var(--leaf); color:#fff; padding:3px 9px; border-radius:6px; white-space:nowrap;
  }
  .badge.water{background:#1E3A5C; margin-left:6px;}
  .status{font-size:11px; padding:3px 8px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .status.pendente{background:#FBEBD3; color:var(--pend);}
  .status.feito{background:#DCEFE3; color:var(--feito);}
  .status.atrasado{background:#F7DAD2; color:var(--danger);}
  .group-header{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#6C7A67; margin:22px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line);}
  .group-header:first-child{margin-top:0;}
  .item h3{margin:8px 0 2px; font-size:16px;}
  .item p{margin:0; font-size:13px; color:#54614F;}
  .item .meta{font-size:12px; color:#8A968A; margin-top:6px;}
  .item .actions{display:flex; gap:8px; margin-top:10px;}
  .item button{flex:1; border:none; border-radius:8px; padding:9px 0; font-size:13px; font-weight:600;}
  .btn-done{background:var(--feito); color:#fff;}
  .btn-edit{background:transparent; color:var(--leaf); border:1px solid var(--leaf) !important;}
  .btn-del{background:transparent; color:var(--danger); border:1px solid var(--danger) !important;}
  .fab{
    position:fixed; bottom:22px; right:20px; left:20px; max-width:420px; margin:0 auto;
    background:var(--leaf); color:#fff; border:none; border-radius:14px; padding:16px;
    font-size:16px; font-weight:600; box-shadow:0 4px 14px rgba(23,52,37,.35);
  }
  dialog{border:none; border-radius:16px; width:min(92vw,420px); padding:0;}
  dialog::backdrop{background:rgba(23,52,37,.45);}
  .sheet{padding:20px;}
  .sheet h2{margin:0 0 16px; font-size:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:#54614F; margin-bottom:5px;}
  .field select, .field input, .field textarea{
    width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; font-size:15px; background:#fff;
  }
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:14px;}
  .sheet-actions button{flex:1; padding:12px; border-radius:9px; border:none; font-size:15px; font-weight:600;}
  .btn-cancel{background:#EDEFEA; color:var(--ink);}
  .btn-save{background:var(--leaf); color:#fff;}
  .loading{text-align:center; color:#8A968A; font-size:13px; margin-top:20px;}
  .prod-row{border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px;}
  .prod-row-top{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .prod-row-top input{flex:1; padding:9px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
  .prod-row-bottom{display:flex; gap:8px; align-items:center;}
  .prod-row-bottom input.dose100-input{flex:0 0 70px; padding:9px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
  .prod-row-bottom select.unidade-input{flex:0 0 64px; padding:9px 4px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff;}
  .prod-row-bottom .prod-total-calc{flex:1; font-size:12px; color:var(--leaf); font-weight:600; text-align:right;}
  .rm-row{flex:0 0 auto; width:32px; height:32px; border:none; background:#F3E4E0; color:var(--danger); border-radius:8px; font-size:16px; line-height:1;}
  .add-row{width:100%; padding:9px; border:1px dashed var(--line); border-radius:8px; background:transparent; color:var(--leaf); font-size:13px; font-weight:600; margin-bottom:14px;}
  .prod-list{margin:8px 0 0; padding:0; list-style:none;}
  .prod-list li{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .prod-list li:last-child{border-bottom:none;}
  .prod-list .p-nome{color:var(--ink);}
  .prod-list .p-dose{color:#54614F; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12.5px; white-space:nowrap; text-align:right;}
  .prod-list .p-total{color:var(--leaf); font-size:11px; display:block; font-weight:600;}
  .estufa-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .estufa-chip{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600;
    color:var(--ink); cursor:pointer; user-select:none;
  }
  .estufa-chip.sel{background:var(--leaf); color:#fff; border-color:var(--leaf);}
</style>
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="theme.css">
</head>
<body data-page="pulverizacoes" class="tdark">
<header>
  <a href="index.html">‹ voltar</a>
  <h1>Pulverizações</h1>
  <div class="tabs">
    <div class="tab active" data-f="pendente">Pendentes</div>
    <div class="tab" data-f="feito">Feitas</div>
    <div class="tab" data-f="todas">Todas</div>
  </div>
  <div class="estufa-filter">
    <label for="filtroEstufaSel">Estufa</label>
    <select id="filtroEstufaSel">
      <option value="todas">Todas as estufas</option>
      <option value="1">Estufa 1</option>
      <option value="2">Estufa 2</option>
      <option value="3">Estufa 3</option>
      <option value="4">Estufa 4</option>
      <option value="5">Estufa 5</option>
      <option value="6">Estufa 6</option>
      <option value="7">Estufa 7</option>
    </select>
  </div>
</header>
<main id="list"><div class="loading">Carregando…</div></main>

<button class="fab" onclick="openForm()">+ Nova pulverização</button>

<dialog id="dialog">
  <div class="sheet">
    <h2 id="dlgTitle">Nova pulverização</h2>
    <div class="field">
      <label>Estufas <span class="hint" style="margin:0; font-size:12px; color:#8A968A;">(toque em quantas precisar)</span></label>
      <div class="estufa-grid" id="estufaGrid">
        <div class="estufa-chip" data-e="1">1</div>
        <div class="estufa-chip" data-e="2">2</div>
        <div class="estufa-chip" data-e="3">3</div>
        <div class="estufa-chip" data-e="4">4</div>
        <div class="estufa-chip" data-e="5">5</div>
        <div class="estufa-chip" data-e="6">6</div>
        <div class="estufa-chip" data-e="7">7</div>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Situação</label>
        <select id="fStatus">
          <option value="pendente">Precisa fazer</option>
          <option value="feito">Já foi feito</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Litros de água usados na aplicação</label>
      <input id="fLitros" type="number" step="any" inputmode="decimal" placeholder="ex: 300">
    </div>
    <div class="field">
      <label>Produtos e doses <span class="hint" style="margin:0; font-size:12px; color:#8A968A;">(dose para cada 100L de água)</span></label>
      <div id="produtosList"></div>
      <button type="button" class="add-row" onclick="addProdutoRow()">+ Adicionar produto</button>
    </div>
    <div class="field">
      <label>Alvo / motivo</label>
      <input id="fAlvo" type="text" placeholder="ex: requeima, mosca branca...">
    </div>
    <div class="field">
      <label>Data (prevista ou feita)</label>
      <input id="fData" type="date">
    </div>
    <div class="field">
      <label>Observação</label>
      <textarea id="fObs" rows="2"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeForm()">Cancelar</button>
      <button class="btn-save" onclick="salvar()">Salvar</button>
    </div>
  </div>
</dialog>

<script src="config.js"></script>
<datalist id="dlEstoque"></datalist>
<script>
let dados = [];
let filtro = 'pendente';
let filtroEstufa = 'todas';

// ===== INTEGRAÇÃO ESTOQUE (baixa automática) =====
async function baixarEstoque(produtoNome, quantidade, unidade, origem, origemId, obs) {
  try {
    const qtd = parseFloat(String(quantidade).replace(',', '.'));
    if (!produtoNome || !qtd || qtd <= 0) return;
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({
      action: 'movimentar',
      data: { produtoNome, tipo: 'saida', quantidade: qtd, unidade: unidade || '',
              origem: origem || 'manual', origemId: origemId || '', obs: obs || '' }
    })});
    const j = await r.json().catch(()=>null);
    if (j && j.aviso) alert('Atenção no estoque (' + produtoNome + '): ' + j.aviso);
  } catch(e) { console.warn('Falha ao dar baixa no estoque:', produtoNome, e); }
}

// Autocompletar com os nomes cadastrados no estoque (evita duplicados por erro de digitação)
async function carregarNomesEstoque(){
  try{
    const arr = (typeof buscarTipo === 'function') ? await buscarTipo('estoque') : ((await (await fetch(`${API_URL}?tipo=estoque`)).json()).data || []);
    const dl = document.getElementById('dlEstoque');
    if(dl) dl.innerHTML = arr.map(p => `<option value="${escapeHtml(p.nome)}">`).join('');
  }catch(e){}
}
carregarNomesEstoque();

async function carregar(){
  // Mostra cache na hora p/ não travar em "Carregando"
  try {
    if (typeof cacheLerTipo === 'function') {
      const c = cacheLerTipo('pulverizacao');
      if (c && c.length) { dados = c.sort((a,b)=> new Date(b.dataCriacao) - new Date(a.dataCriacao)); render(); }
      else document.getElementById('list').innerHTML = '<div class="loading">Carregando…</div>';
    } else document.getElementById('list').innerHTML = '<div class="loading">Carregando…</div>';
  } catch (e) {}
  try{
    const arr = (typeof buscarTipo === 'function') ? await buscarTipo('pulverizacao') : ((await (await fetch(`${API_URL}?tipo=pulverizacao`)).json()).data || []);
    dados = (arr || []).sort((a,b)=> new Date(b.dataCriacao) - new Date(a.dataCriacao));
    render();
  }catch(e){
    const c = (typeof cacheLerTipo === 'function') ? cacheLerTipo('pulverizacao') : null;
    if (c && c.length) { dados = c; render(); return; }
    document.getElementById('list').innerHTML = '<div class="loading">Demorou demais. <a href="#" onclick="carregar();return false">Tentar de novo</a></div>';
  }
}

function isAtrasado(d){
  if(d.status === 'feito' || !d.dataPrevista) return false;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dt = new Date(d.dataPrevista + 'T00:00:00');
  return dt < hoje;
}

function parseProdutos(d){
  if(!d.produto) return [];
  try{
    const parsed = JSON.parse(d.produto);
    if(Array.isArray(parsed)) return parsed;
  }catch(e){}
  return [{ nome: d.produto, dose: d.dose || '' }];
}

function estufasArray(d){
  return String(d.estufa || '').split(',').map(s => s.trim()).filter(Boolean);
}

function calcTotalProduto(p, litros){
  const dose = parseFloat(p.dose100);
  const l = parseFloat(litros);
  if(p.dose100 === undefined || isNaN(dose) || isNaN(l) || l <= 0) return null;
  return `${formatNum((dose/100)*l)} ${p.unidade || ''}`;
}

function itemCard(d){
  const atrasado = isAtrasado(d);
  const statusLabel = d.status === 'feito' ? 'Feito' : (atrasado ? 'Atrasado' : 'Pendente');
  const statusClass = d.status === 'feito' ? 'feito' : (atrasado ? 'atrasado' : 'pendente');
  const produtos = parseProdutos(d);
  const estufas = estufasArray(d);
  const badgeTxt = estufas.length > 1 ? `Estufas ${estufas.join(', ')}` : `Estufa ${estufas[0] || '?'}`;
  const tituloProdutos = produtos.length
    ? produtos.map(p => escapeHtml(p.nome)).join(' + ')
    : '(produto não informado)';
  const doseTxt = p => p.dose100 !== undefined
    ? (p.dose100 ? `${escapeHtml(p.dose100)} ${p.unidade || ''}/100L` : '')
    : (p.dose ? escapeHtml(p.dose) : '');
  const totalTxt = p => {
    const t = calcTotalProduto(p, d.litrosAgua);
    return t ? `<span class="p-total">gastou ${t}</span>` : '';
  };
  const listaProdutos = produtos.length > 1
    ? `<ul class="prod-list">${produtos.map(p => `<li><span class="p-nome">${escapeHtml(p.nome)}</span><span class="p-dose">${doseTxt(p)}${totalTxt(p)}</span></li>`).join('')}</ul>`
    : (produtos[0] ? `<p>Dose: ${doseTxt(produtos[0]) || '—'}${produtos[0] && calcTotalProduto(produtos[0], d.litrosAgua) ? ' · gastou ' + calcTotalProduto(produtos[0], d.litrosAgua) : ''}</p>` : '');
  return `
    <div class="item">
      <div class="item-top">
        <div><span class="badge">${badgeTxt}</span>${d.litrosAgua ? `<span class="badge water">💧 ${escapeHtml(d.litrosAgua)} L</span>` : ''}</div>
        <span class="status ${statusClass}">${statusLabel}</span>
      </div>
      <h3>${tituloProdutos}</h3>
      ${listaProdutos}
      ${d.alvo ? `<p>Alvo: ${escapeHtml(d.alvo)}</p>` : ''}
      ${d.litrosAgua ? `<p>Água usada: ${escapeHtml(d.litrosAgua)} L</p>` : ''}
      ${d.obs ? `<p>${escapeHtml(d.obs)}</p>` : ''}
      <div class="meta">${d.status === 'feito' ? (d.dataExecucao ? 'Feito em ' + fmtData(d.dataExecucao) : '') : (d.dataPrevista ? 'Previsto para ' + fmtData(d.dataPrevista) : 'Sem data definida')}</div>
      <div class="actions">
        ${d.status !== 'feito' ? `<button class="btn-done" onclick="marcarFeito('${d.id}')">Marcar como feito</button>` : ''}
        <button class="btn-edit" onclick="editarItem('${d.id}')">Editar</button>
        <button class="btn-del" onclick="excluir('${d.id}')">Excluir</button>
      </div>
    </div>
  `;
}

function render(){
  const list = document.getElementById('list');
  let itens = dados;
  if(filtro !== 'todas') itens = itens.filter(d => d.status === filtro);
  if(filtroEstufa !== 'todas') itens = itens.filter(d => estufasArray(d).includes(filtroEstufa));
  if(itens.length === 0){
    list.innerHTML = '<div class="empty">Nada por aqui.</div>';
    return;
  }

  if(filtro === 'feito'){
    itens = itens.slice().sort((a,b) => new Date(b.dataExecucao||b.dataCriacao) - new Date(a.dataExecucao||a.dataCriacao));
    list.innerHTML = itens.map(itemCard).join('');
    return;
  }

  itens = itens.slice().sort((a,b) => {
    if(!a.dataPrevista) return 1;
    if(!b.dataPrevista) return -1;
    return new Date(a.dataPrevista) - new Date(b.dataPrevista);
  });
  let html = '';
  let grupoAtual = null;
  itens.forEach(d => {
    const chave = d.dataPrevista || 'sem-data';
    if(chave !== grupoAtual){
      grupoAtual = chave;
      const titulo = d.dataPrevista ? fmtData(d.dataPrevista) : 'Sem data definida';
      html += `<div class="group-header">${titulo}</div>`;
    }
    html += itemCard(d);
  });
  list.innerHTML = html;
}

function fmtData(v){
  const dt = new Date(v.length === 10 ? v + 'T00:00:00' : v);
  if(isNaN(dt)) return v;
  return dt.toLocaleDateString('pt-BR');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  filtro = t.dataset.f;
  render();
}));

document.getElementById('filtroEstufaSel').addEventListener('change', (e) => {
  filtroEstufa = e.target.value;
  render();
});

function hojeISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function formatNum(n){
  const r = Math.round(n * 100) / 100;
  return r.toString().replace('.', ',');
}

function atualizarTotais(){
  const litros = parseFloat(document.getElementById('fLitros').value) || 0;
  document.querySelectorAll('#produtosList .prod-row').forEach(row => {
    const dose = parseFloat(row.querySelector('.dose100-input').value);
    const unidade = row.querySelector('.unidade-input').value;
    const totalEl = row.querySelector('.prod-total-calc');
    if(!isNaN(dose) && litros > 0){
      totalEl.textContent = `= ${formatNum((dose/100)*litros)} ${unidade} no total`;
    } else {
      totalEl.textContent = '';
    }
  });
}
document.getElementById('fLitros').addEventListener('input', atualizarTotais);
document.getElementById('produtosList').addEventListener('input', atualizarTotais);
document.getElementById('produtosList').addEventListener('change', atualizarTotais);

let prodRowCount = 0;
function addProdutoRow(nome, dose100, unidade){
  prodRowCount++;
  const id = 'row' + prodRowCount;
  const wrap = document.getElementById('produtosList');
  const row = document.createElement('div');
  row.className = 'prod-row';
  row.id = id;
  const un = unidade || 'mL';
  row.innerHTML = `
    <div class="prod-row-top">
      <input type="text" class="nome-input" list="dlEstoque" placeholder="Produto (ex: Amistar Top)" value="${nome ? escapeHtml(nome) : ''}" autocomplete="off">
      <button type="button" class="rm-row" onclick="removeProdutoRow('${id}')">×</button>
    </div>
    <div class="prod-row-bottom">
      <input type="number" step="any" inputmode="decimal" class="dose100-input" placeholder="Dose/100L" value="${dose100 !== undefined && dose100 !== '' ? escapeHtml(String(dose100)) : ''}">
      <select class="unidade-input">
        <option value="mL" ${un==='mL'?'selected':''}>mL</option>
        <option value="g" ${un==='g'?'selected':''}>g</option>
        <option value="L" ${un==='L'?'selected':''}>L</option>
        <option value="kg" ${un==='kg'?'selected':''}>kg</option>
      </select>
      <span class="prod-total-calc"></span>
    </div>
  `;
  wrap.appendChild(row);
  atualizarTotais();
}
function removeProdutoRow(id){
  const row = document.getElementById(id);
  if(row) row.remove();
  if(document.querySelectorAll('#produtosList .prod-row').length === 0) addProdutoRow();
}
function resetProdutosRows(){
  document.getElementById('produtosList').innerHTML = '';
  prodRowCount = 0;
  addProdutoRow();
  addProdutoRow();
  addProdutoRow();
}

function normalizeUnidade(u){
  const s = String(u || '').toLowerCase();
  if(s.startsWith('kg')) return 'kg';
  if(s.startsWith('g')) return 'g';
  if(s.startsWith('l')) return 'L';
  return 'mL';
}
function parseDoseLegado(texto){
  if(!texto) return { valor:'', unidade:'mL' };
  const m = String(texto).match(/([\d.,]+)\s*([a-zA-Zµ]+)/);
  if(m) return { valor: m[1].replace(',', '.'), unidade: normalizeUnidade(m[2]) };
  return { valor:'', unidade:'mL' };
}

let estufasSelecionadas = new Set();
document.querySelectorAll('#estufaGrid .estufa-chip').forEach(chip => chip.addEventListener('click', () => {
  const e = chip.dataset.e;
  if(estufasSelecionadas.has(e)){ estufasSelecionadas.delete(e); chip.classList.remove('sel'); }
  else { estufasSelecionadas.add(e); chip.classList.add('sel'); }
}));
function setEstufasSelecionadas(lista){
  estufasSelecionadas = new Set(lista);
  document.querySelectorAll('#estufaGrid .estufa-chip').forEach(chip => {
    chip.classList.toggle('sel', estufasSelecionadas.has(chip.dataset.e));
  });
}

let editandoId = null;

function openForm(){
  editandoId = null;
  document.getElementById('dlgTitle').textContent = 'Nova pulverização';
  setEstufasSelecionadas(['1']);
  document.getElementById('fStatus').value='pendente';
  document.getElementById('fAlvo').value='';
  document.getElementById('fData').value=hojeISO();
  document.getElementById('fObs').value='';
  document.getElementById('fLitros').value='';
  resetProdutosRows();
  document.getElementById('dialog').showModal();
}

function editarItem(id){
  const d = dados.find(x => x.id === id);
  if(!d) return;
  editandoId = id;
  document.getElementById('dlgTitle').textContent = 'Editar pulverização';
  setEstufasSelecionadas(estufasArray(d));
  document.getElementById('fStatus').value = d.status || 'pendente';
  document.getElementById('fAlvo').value = d.alvo || '';
  document.getElementById('fData').value = (d.status === 'feito' ? d.dataExecucao : d.dataPrevista) || hojeISO();
  document.getElementById('fObs').value = d.obs || '';
  document.getElementById('fLitros').value = d.litrosAgua || '';

  document.getElementById('produtosList').innerHTML = '';
  prodRowCount = 0;
  const produtos = parseProdutos(d);
  if(produtos.length){
    produtos.forEach(p => {
      if(p.dose100 !== undefined){
        addProdutoRow(p.nome, p.dose100, p.unidade);
      } else {
        const legado = parseDoseLegado(p.dose);
        addProdutoRow(p.nome, legado.valor, legado.unidade);
      }
    });
  } else {
    addProdutoRow();
  }
  addProdutoRow();

  document.getElementById('dialog').showModal();
}

function closeForm(){ document.getElementById('dialog').close(); }

async function salvar(){
  if(estufasSelecionadas.size === 0){ alert('Selecione ao menos uma estufa.'); return; }
  const status = document.getElementById('fStatus').value;
  const data = document.getElementById('fData').value;
  const litrosAgua = document.getElementById('fLitros').value;
  const estufasOrdenadas = Array.from(estufasSelecionadas).sort((a,b) => a - b);
  const produtos = Array.from(document.querySelectorAll('#produtosList .prod-row')).map(row => ({
    nome: row.querySelector('.nome-input').value.trim(),
    dose100: row.querySelector('.dose100-input').value.trim(),
    unidade: row.querySelector('.unidade-input').value
  })).filter(p => p.nome);

  const campos = {
    estufa: estufasOrdenadas.join(','),
    produto: JSON.stringify(produtos),
    alvo: document.getElementById('fAlvo').value,
    dose: '',
    litrosAgua: litrosAgua,
    obs: document.getElementById('fObs').value,
    status: status,
    dataPrevista: status === 'pendente' ? data : '',
    dataExecucao: status === 'feito' ? data : ''
  };
  closeForm();
  let origemId = editandoId;
  if(editandoId){
    await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'update', id: editandoId, data: campos})});
  } else {
    try {
      const resp = await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'add', data: campos})});
      origemId = (await resp.json()).id || null;
    } catch(e) {
      await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'add', data: campos})});
    }
  }
  if(campos.status === 'feito'){
    const litros = parseFloat(String(litrosAgua).replace(',','.')) || 0;
    for(const p of produtos){
      const dose100 = parseFloat(String(p.dose100).replace(',','.')) || 0;
      if(dose100 > 0 && litros > 0){
        const gasto = (dose100/100)*litros;
        await baixarEstoque(p.nome, gasto, p.unidade, 'pulverizacao', origemId,
          `Pulverizacao estufa(s) ${campos.estufa} - ${litros}L agua`);
      }
    }
  }
  carregar();
}

async function marcarFeito(id){
  const d = dados.find(x => x.id === id);
  await fetch(API_URL, {method:'POST', body: JSON.stringify({
    tipo:'pulverizacao', action:'update', id,
    data:{ status:'feito', dataExecucao: hojeISO() }
  })});
  if(d){
    try{
      const parsed = JSON.parse(d.produto || '[]');
      const arr = Array.isArray(parsed) ? parsed : [{ nome: d.produto, dose100: d.dose }];
      const litros = parseFloat(String(d.litrosAgua).replace(',','.')) || 0;
      for(const p of arr){
        const dose100 = parseFloat(String(p.dose100 ?? '').replace(',','.')) || 0;
        if(dose100 > 0 && litros > 0){
          await baixarEstoque(p.nome, (dose100/100)*litros, p.unidade || 'mL', 'pulverizacao', id,
            `Pulverizacao estufa(s) ${d.estufa}`);
        }
      }
    }catch(e){}
  }
  carregar();
}

async function excluir(id){
  if(!confirm('Excluir este registro?')) return;
  await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'delete', id})});
  carregar();
}

carregar();
</script>
