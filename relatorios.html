<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estufas">
<meta name="theme-color" content="#0D1B13">
<title>Relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0D1B13; --bg2:#10241A; --card:#152A1F; --card2:#1A3327;
    --line:#24402F; --ink:#E9F2EA; --mut:#9DB8A4; --dim:#6E8A75;
    --leaf:#3D7A5C; --lime:#8FD19A; --gold:#D9A441; --red:#E0785F; --blue:#5C8FD1;}
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(1200px 500px at 80% -10%, #16301f 0%, #0D1B13 55%) fixed, var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:60px;}
  a{color:var(--lime); text-decoration:none;}
  header{background:linear-gradient(180deg,#123024,#0E2318); padding:16px 20px 14px; position:sticky; top:0; z-index:6; border-bottom:1px solid var(--line);}
  header a{color:var(--lime); font-size:13px;}
  header h1{margin:6px 0 0; font-size:20px; font-weight:800; letter-spacing:-.02em;}
  header p{margin:4px 0 0; font-size:12.5px; color:var(--mut);}
  main{padding:16px 20px; max-width:1080px; margin:0 auto;}

  /* Filtros globais */
  .filtros{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px;}
  .filtros .grp{display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:5px 8px;}
  .filtros label{font-size:11px; color:var(--mut); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .filtros select,.filtros input{background:var(--bg2); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:7px 9px; font-size:13px; font-family:inherit; color-scheme:dark;}
  .filtros select:focus,.filtros input:focus{outline:none; border-color:var(--leaf);}
  .presets{display:flex; gap:5px; flex-wrap:wrap;}
  .presets button{background:var(--card); color:var(--mut); border:1px solid var(--line); border-radius:9px;
    padding:7px 11px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;}
  .presets button.ativo{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff; border-color:transparent;}
  .nota-filtro{font-size:11.5px; color:var(--dim); margin:0 0 10px;}

  /* Abas de categoria */
  .cats{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .cat{flex:0 0 auto; padding:9px 14px; border-radius:12px; font-size:12.5px; font-weight:700; cursor:pointer;
    background:var(--card); border:1px solid var(--line); color:var(--mut); transition:.18s; white-space:nowrap;}
  .cat:hover{background:var(--card2); color:var(--ink);}
  .cat.active{background:linear-gradient(135deg,#3D7A5C,#2A5A41); color:#fff; border-color:transparent;}

  .grid{display:grid; gap:14px;}
  .kpis{grid-template-columns:repeat(4,1fr);}
  .card{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line);
    border-radius:18px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .card h2{margin:0 0 10px; font-size:14.5px; font-weight:700;}
  .kpi .lbl{font-size:11.5px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .kpi .num{font-size:23px; font-weight:800; margin-top:6px; line-height:1.25; word-break:break-word;}
  .kpi .num small{font-size:12px; color:var(--mut); font-weight:600;}
  .delta{font-size:11px !important; font-weight:800 !important; margin-left:4px; white-space:nowrap;}
  .delta.up{color:var(--lime);} .delta.down{color:var(--red);} .delta.neu{color:var(--dim); font-weight:600 !important;}
  .cols2{grid-template-columns:1fr 1fr;}
  canvas{max-height:250px;}
  .legend{font-size:11.5px; color:var(--dim); margin-top:8px;}
  .rank{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13.5px; gap:10px;}
  .rank:last-child{border:none;} .rank b{color:var(--lime); white-space:nowrap;}
  .rank span{color:var(--mut); overflow:hidden; text-overflow:ellipsis;}
  .empty{color:var(--dim); font-size:13px; text-align:center; padding:18px 0;}
  .loading{color:var(--dim); font-size:13px; text-align:center; padding:40px 0;}

  /* Tabelas */
  .tbl-wrap{overflow-x:auto; max-height:340px; overflow-y:auto;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{position:sticky; top:0; background:var(--card2); color:var(--mut); text-align:left; font-size:11px;
    text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--line); z-index:1;}
  td{padding:8px 10px; border-bottom:1px dashed var(--line); color:var(--ink);}
  td.mut{color:var(--mut);} td.num{text-align:right; font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  .badge{font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
  .badge.ok{background:rgba(143,209,154,.14); color:var(--lime);}
  .badge.warn{background:rgba(217,164,65,.15); color:var(--gold);}
  .badge.err{background:rgba(224,120,95,.15); color:#F0907A;}
  .badge.info{background:rgba(92,143,209,.15); color:#8FB8E8;}
  .sub-tit{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:6px 0 0;}
  .sec{display:none;} .sec.ativa{display:block;}
  .duas{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  @media (max-width:860px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .cols2,.duas{grid-template-columns:1fr;}
  }
  @media (max-width:600px){
    main{padding:14px 12px;}
    .kpi .num{font-size:19px;}
    .filtros{flex-direction:column; align-items:stretch;}
    .filtros .grp{justify-content:space-between;}
  }
</style>
<link rel="stylesheet" href="sidebar.css">
</head>
<body data-page="relatorios">
<header>
  <a href="index.html">‹ voltar</a>
  <h1>Relatórios</h1>
  <p>Todos os relatórios do sistema em um só lugar — filtros valem para as 7 categorias.</p>
</header>
<main>
  <div class="filtros">
    <div class="presets" id="presets">
      <button data-d="30">30d</button>
      <button data-d="90" class="ativo">90d</button>
      <button data-d="180">6 meses</button>
      <button data-d="365">12 meses</button>
      <button data-d="mes">Este mês</button>
    </div>
    <div class="grp"><label>De</label><input type="date" id="fDe"></div>
    <div class="grp"><label>Até</label><input type="date" id="fAte"></div>
    <div class="grp"><label>Estufa</label><select id="fEstufa"><option value="todas">Todas</option></select></div>
    <div class="grp"><label>Cultura</label><select id="fCultura"><option value="todas">Todas</option></select></div>
  </div>
  <p class="nota-filtro" id="notaFiltro" style="display:none"></p>

  <div class="cats" id="cats">
    <div class="cat active" data-c="producao">Produção</div>
    <div class="cat" data-c="pulverizacoes">Pulverizações</div>
    <div class="cat" data-c="nutricao">Nutrição</div>
    <div class="cat" data-c="estoque">Estoque</div>
    <div class="cat" data-c="colheita">Colheita</div>
    <div class="cat" data-c="vendas">Vendas</div>
    <div class="cat" data-c="financeiro">Financeiro</div>
  </div>

  <div id="conteudo"><div class="loading">Carregando dados…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script>
const num = v => { const n = parseFloat(String(v??'').replace(',','.')); return isNaN(n)?0:n; };
const BRL = v => (Math.round(num(v)*100)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoD = v => { if(!v) return ''; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1]+'-'+m[2]+'-'+m[3] : ''; };
const fmtData = v => { const s = isoD(v); return s ? s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : '—'; };
const fmtQtd = v => { const n = num(v); return n % 1 === 0 ? String(n) : n.toFixed(2).replace('.',','); };

let DADOS = {};
let cat = 'producao';
let per = {ini:'', fim:''};
let estufa = 'todas', cultura = 'todas';
const charts = {};

async function get(t){
  try { if (typeof buscarTipo === 'function') return await buscarTipo(t); }
  catch (e) { const c = (typeof cacheLerTipo === 'function') ? cacheLerTipo(t) : null; if (c) return c; }
  try {
    const ft = (typeof fetchComTimeout === 'function') ? await fetchComTimeout(API_URL+'?tipo='+t) : await fetch(API_URL+'?tipo='+t);
    return ((await ft.json()).data)||[];
  } catch(e){
    const c = (typeof cacheLerTipo === 'function') ? cacheLerTipo(t) : null; return c || [];
  }
}
async function carregarDados(){
  const tipos = ['colheitas','ciclos','pulverizacao','nutricao','estoque','movimentacoes','vendas','boletos'];
  try {
    if (typeof buscarLote === 'function') {
      const d = await buscarLote(tipos);
      tipos.forEach(t => DADOS[t] = d[t] || []);
      return;
    }
  } catch(e){}
  const r = await Promise.all(tipos.map(get));
  tipos.forEach((t,i) => DADOS[t] = r[i] || []);
}

// ---------- período ----------
function iso(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function presetDias(d){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if(d === 'mes'){
    const i = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    per = {ini: iso(i), fim: iso(hoje)};
  }else{
    const i = new Date(hoje); i.setDate(i.getDate() - (d - 1));
    per = {ini: iso(i), fim: iso(hoje)};
  }
}
function periodoAnterior(){
  const a = new Date(per.ini+'T00:00:00'), b = new Date(per.fim+'T00:00:00');
  const dias = Math.round((b - a)/86400000) + 1;
  const f2 = new Date(a); f2.setDate(f2.getDate() - 1);
  const i2 = new Date(f2); i2.setDate(i2.getDate() - dias + 1);
  return {ini: iso(i2), fim: iso(f2)};
}
function noPer(v){ const s = isoD(v); return !!s && s >= per.ini && s <= per.fim; }
function antPer(v){ const p = periodoAnterior(); const s = isoD(v); return !!s && s >= p.ini && s <= p.fim; }
function mesesNoPer(){
  const out = [];
  const [ai,mi] = per.ini.split('-').map(Number), [af,mf] = per.fim.split('-').map(Number);
  const d = new Date(ai, mi-1, 1), fim = new Date(af, mf-1, 1);
  let guarda = 0;
  while(d <= fim && guarda++ < 60){ out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); d.setMonth(d.getMonth()+1); }
  if(!out.length) out.push(per.ini.slice(0,7));
  return out;
}
const nomeMes = ym => { const [a,m] = ym.split('-'); return m+'/'+a.slice(2); };
function deltaPct(atual, anterior){ if(!(anterior > 0)) return null; return Math.round((atual - anterior)/anterior*100); }
function kpiHTML(valor, d){
  let h = valor;
  if(d === null || d === undefined) h += ' <small class="delta neu" title="sem base de comparação no período anterior">sem base</small>';
  else h += ' <small class="delta '+(d>=0?'up':'down')+'">'+(d>=0?'▲':'▼')+' '+Math.abs(d)+'%</small>';
  return h;
}
function kpiSet(id, valor, d){ const el = document.getElementById(id); if(el) el.innerHTML = kpiHTML(valor, d); }

// ---------- filtros ----------
function estOk(e){ return estufa === 'todas' || String(e ?? '') === estufa; }
function cultOk(c){ return cultura === 'todas' || String(c ?? '') === cultura; }
function cultDoCiclo(id){ const c = (DADOS.ciclos||[]).find(x => String(x.id) === String(id)); return c ? (c.cultura||'') : ''; }
function prodList(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  const s = String(v).trim();
  if(s.startsWith('[')){ try{ const a = JSON.parse(s); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  return [{nome: s}];
}
function nomeProd(v){
  const l = prodList(v);
  return l.map(p => (p && (p.produto || p.nome)) || String(p)).filter(Boolean).join(' + ') || '—';
}
function dataTarefa(t){ return isoD(t.dataExecucao) || isoD(t.dataPrevista) || ''; }

// ---------- helpers de exibição ----------
function tabela(cols, rows, vazio){
  if(!rows.length) return '<div class="empty">'+(vazio || 'Sem registros no período.')+'</div>';
  return '<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th'+(c.n?' class="num"':'')+'>'+c.t+'</th>').join('')+
    '</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}
function rankHTML(pares, fmt, vazio){
  if(!pares.length) return '<div class="empty">'+(vazio || 'Sem dados no período.')+'</div>';
  return pares.map(([k,v])=>'<div class="rank"><span>'+esc(k)+'</span><b>'+(fmt?fmt(v):v)+'</b></div>').join('');
}
function novoChart(id, cfg){
  const el = document.getElementById(id);
  if(!el) return;
  if(charts[id]){ charts[id].destroy(); }
  if(!window.Chart) return;
  Chart.defaults.color = '#9DB8A4'; Chart.defaults.borderColor = '#24402F';
  charts[id] = new Chart(el, cfg);
}
function somaMes(ms, registros, dataFn, valFn, filtro){
  return ms.map(m => registros.reduce((a,r) => {
    if(filtro && !filtro(r)) return a;
    if(isoD(dataFn(r)).slice(0,7) !== m) return a;
    return a + valFn(r);
  }, 0));
}
const cores = {leaf:'#3D7A5C', lime:'#8FD19A', gold:'#D9A441', red:'#E0785F', blue:'#5C8FD1', dim:'#6E8A75'};
function barOpts(){
  return {plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{color:'#9DB8A4'}, grid:{color:'#24402F'}}, x:{ticks:{color:'#9DB8A4'}, grid:{display:false}}}};
}

// ---------- colheitas / produção ----------
function colheitasPeriodo(Intervalo){
  const f = Intervalo === 'ant' ? antPer : noPer;
  return (DADOS.colheitas||[]).filter(h => f(h.data) && estOk(h.estufa) && cultOk(cultDoCiclo(h.cicloId)));
}
function somaKG(lista){ return lista.reduce((a,h) => String(h.unidade||'').toUpperCase()==='CX' ? a : a + num(h.quantidade), 0); }
function somaCX(lista){ return lista.reduce((a,h) => String(h.unidade||'').toUpperCase()==='CX' ? a + num(h.quantidade) : a, 0); }

function secProducao(){
  const at = colheitasPeriodo('at'), an = colheitasPeriodo('ant');
  const kg = Math.round(somaKG(at)), cx = Math.round(somaCX(at));
  const kgAnt = Math.round(somaKG(an)), cxAnt = Math.round(somaCX(an));
  const ms = mesesNoPer();
  const porCult = {}, porEst = {};
  at.forEach(h => {
    const c = cultDoCiclo(h.cicloId) || '—';
    porCult[c] = (porCult[c]||0) + (String(h.unidade||'').toUpperCase()==='CX' ? 0 : num(h.quantidade));
    porEst[h.estufa||'—'] = (porEst[h.estufa||'—']||0) + (String(h.unidade||'').toUpperCase()==='CX' ? 0 : num(h.quantidade));
  });
  const rkCult = Object.entries(porCult).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const rkEst = Object.entries(porEst).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const cmpRows = [
    ['KG colhido', kg, kgAnt], ['CX colhido', cx, cxAnt],
    ['Nº de colheitas', at.length, an.length]
  ].map(([lbl, a2, b2]) => {
    const d = deltaPct(a2, b2);
    return '<tr><td>'+lbl+'</td><td class="num">'+fmtQtd(a2)+'</td><td class="num mut">'+fmtQtd(b2)+'</td><td class="num">'+
      (d===null?'<span class="mut">sem base</span>':'<span class="delta '+(d>=0?'up':'down')+'">'+(d>=0?'▲':'▼')+' '+Math.abs(d)+'%</span>')+'</td></tr>';
  });
  return `
  <div class="grid kpis">
    <div class="card kpi"><div class="lbl">KG no período</div><div class="num" id="pKg">—</div></div>
    <div class="card kpi"><div class="lbl">CX no período</div><div class="num" id="pCx">—</div></div>
    <div class="card kpi"><div class="lbl">Colheitas</div><div class="num" id="pN">—</div></div>
    <div class="card kpi"><div class="lbl">Variação vs anterior</div><div class="num" id="pVar">—</div></div>
  </div>
  <div class="grid cols2" style="margin-top:14px">
    <div class="card"><h2>Evolução da produção (KG/mês)</h2><canvas id="chProdMes"></canvas></div>
    <div class="card"><h2>Atual × período anterior</h2><canvas id="chProdCmp"></canvas></div>
  </div>
  <div class="grid cols2" style="margin-top:14px">
    <div class="card"><h2>Top culturas (KG)</h2>${rankHTML(rkCult, v=>Math.round(v).toLocaleString('pt-BR')+' KG', 'Sem colheitas no período.')}</div>
    <div class="card"><h2>Top estufas (KG)</h2>${rankHTML(rkEst, v=>Math.round(v).toLocaleString('pt-BR')+' KG', 'Sem colheitas no período.')}</div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Comparação de períodos</h2>
    ${tabela([{t:'Indicador'},{t:'Período atual',n:1},{t:'Período anterior',n:1},{t:'Variação',n:1}], cmpRows, 'Sem colheitas nos dois períodos.')}
  </div>`;
}
function pintarProducao(){
  const at = colheitasPeriodo('at'), an = colheitasPeriodo('ant');
  const kg = Math.round(somaKG(at)), cx = Math.round(somaCX(at));
  const kgAnt = Math.round(somaKG(an)), cxAnt = Math.round(somaCX(an));
  kpiSet('pKg', kg.toLocaleString('pt-BR'), deltaPct(kg, kgAnt));
  kpiSet('pCx', cx.toLocaleString('pt-BR'), deltaPct(cx, cxAnt));
  kpiSet('pN', String(at.length), deltaPct(at.length, an.length));
  const dVar = deltaPct(kg, kgAnt);
  document.getElementById('pVar').innerHTML = dVar === null
    ? '<small class="delta neu">sem base</small>'
    : (dVar>=0?'+':'')+dVar+'% <small class="delta '+(dVar>=0?'up':'down')+'">'+(dVar>=0?'▲':'▼')+'</small>';
  const ms = mesesNoPer();
  const kgMes = somaMes(ms, at, h=>h.data, h=>String(h.unidade||'').toUpperCase()==='CX'?0:num(h.quantidade));
  novoChart('chProdMes', {type:'bar', data:{labels:ms.map(nomeMes), datasets:[{data:kgMes, backgroundColor:cores.leaf, borderRadius:6}]}, options:barOpts()});
  novoChart('chProdCmp', {type:'bar',
    data:{labels:['KG','CX'], datasets:[
      {label:'Atual', data:[kg,cx], backgroundColor:cores.lime, borderRadius:6},
      {label:'Anterior', data:[kgAnt,cxAnt], backgroundColor:cores.dim, borderRadius:6}]},
    options:{plugins:{legend:{labels:{color:'#9DB8A4'}}}, scales:{y:{beginAtZero:true, ticks:{color:'#9DB8A4'}, grid:{color:'#24402F'}}, x:{ticks:{color:'#9DB8A4'}, grid:{display:false}}}}});
}

// ---------- colheita (histórico) ----------
function secColheita(){
  const at = colheitasPeriodo('at');
  const porEst = {};
  at.forEach(h => { porEst[h.estufa||'—'] = (porEst[h.estufa||'—']||0) + (String(h.unidade||'').toUpperCase()==='CX'?0:num(h.quantidade)); });
  const rkEst = Object.entries(porEst).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const linhas = at.slice().sort((a,b)=>isoD(b.data).localeCompare(isoD(a.data))).slice(0,60).map(h =>
    '<tr><td>'+fmtData(h.data)+'</td><td class="num">'+esc(String(h.estufa||'—'))+'</td><td>'+esc(cultDoCiclo(h.cicloId)||'—')+
    '</td><td class="num">'+fmtQtd(h.quantidade)+'</td><td class="mut">'+esc(String(h.unidade||'').toUpperCase())+'</td><td class="mut">'+esc(h.obs||'')+'</td></tr>');
  // por ciclo
  const ciclosUsados = {};
  at.forEach(h => { const id = String(h.cicloId||''); if(!ciclosUsados[id]) ciclosUsados[id] = {kg:0, n:0, ciclo: (DADOS.ciclos||[]).find(c=>String(c.id)===id) || null}; ciclosUsados[id].kg += String(h.unidade||'').toUpperCase()==='CX'?0:num(h.quantidade); ciclosUsados[id].n++; });
  const cicRows = Object.values(ciclosUsados).sort((a,b)=>b.kg-a.kg).slice(0,20).map(o => {

    </div>
    <div class="card"><h2>Vencidos em aberto</h2>
      ${tabela([{t:'Conta'},{t:'Categoria'},{t:'Valor',n:1},{t:'Vence'},{t:'Situação'}], linhasAber, 'Nenhuma conta vencida.')}
    </div>
  </div>`;
}
function pintarFinanceiro(){
  const bol = DADOS.boletos||[], ven = DADOS.vendas||[];
  const pagos = bol.filter(b=>String(b.status)==='pago' && noPer(b.dataPagamento));
  const pagosAnt = bol.filter(b=>String(b.status)==='pago' && antPer(b.dataPagamento));
  const abertos = bol.filter(b=>String(b.status)!=='pago');
  const hoje = new Date().toISOString().slice(0,10);
  const vencidos = abertos.filter(b=>{ const v = isoD(b.vencimento); return v && v < hoje; });
  const receb = ven.filter(v=>String(v.status)==='recebido' && noPer(v.data));
  const recebAnt = ven.filter(v=>String(v.status)==='recebido' && antPer(v.data));
  const pagoTot = pagos.reduce((a,b)=>a+num(b.valor),0);
  const recebTot = receb.reduce((a,v)=>a+num(v.total),0);
  const pagoTotAnt = pagosAnt.reduce((a,b)=>a+num(b.valor),0);
  const recebTotAnt = recebAnt.reduce((a,v)=>a+num(v.total),0);
  kpiSet('fiPago', BRL(pagoTot), deltaPct(pagoTot, pagoTotAnt));
  kpiSet('fiRec', BRL(recebTot), deltaPct(recebTot, recebTotAnt));
  const res = recebTot - pagoTot, resAnt = recebTotAnt - pagoTotAnt;
  const elRes = document.getElementById('fiRes');
  elRes.innerHTML = BRL(res) + (resAnt !== 0 ? ' <small class="delta '+(res>=resAnt?'up':'down')+'">'+(res>=resAnt?'▲':'▼')+' vs ant.</small>' : ' <small class="delta neu">sem base</small>');
  elRes.style.color = res >= 0 ? 'var(--lime)' : 'var(--red)';
  const elV = document.getElementById('fiVenc');
  elV.innerHTML = vencidos.length ? BRL(vencidos.reduce((a,b)=>a+num(b.valor),0))+' <small class="delta down">'+vencidos.length+' conta(s)</small>' : 'R$ 0,00';
  const ms = mesesNoPer();
  const ent = somaMes(ms, receb, v=>v.data, v=>num(v.total));
  const sai = somaMes(ms, pagos, b=>b.dataPagamento, b=>num(b.valor));
  novoChart('chFinMes', {type:'bar',
    data:{labels:ms.map(nomeMes), datasets:[
      {label:'Entradas (vendas recebidas)', data:ent, backgroundColor:cores.lime, borderRadius:5},
      {label:'Saídas (contas pagas)', data:sai, backgroundColor:cores.red, borderRadius:5}]},
    options:{plugins:{legend:{labels:{color:'#9DB8A4'}}}, scales:{y:{beginAtZero:true, ticks:{color:'#9DB8A4'}, grid:{color:'#24402F'}}, x:{ticks:{color:'#9DB8A4'}, grid:{display:false}}}}});
}

// ---------- orquestração ----------
const SECS = {
  producao: {html: secProducao, pintar: pintarProducao},
  pulverizacoes: {html: secPulverizacoes, pintar: pintarPulverizacoes},
  nutricao: {html: secNutricao, pintar: pintarNutricao},
  estoque: {html: estoqueSec, pintar: pintarEstoque},
  colheita: {html: secColheita, pintar: pintarColheita},
  vendas: {html: secVendas, pintar: pintarVendas},
  financeiro: {html: finSec, pintar: pintarFinanceiro}
};
function render(){
  const s = SECS[cat];
  if(!s) return;
  document.getElementById('conteudo').innerHTML = s.html();
  s.pintar();
  const nf = document.getElementById('notaFiltro');
  if(cultura !== 'todas'){
    nf.style.display = '';
    nf.textContent = 'Filtro de cultura "'+cultura+'" vale para Produção, Colheita, Vendas e ciclos — as demais categorias ignoram esse filtro.';
  } else nf.style.display = 'none';
}
function popularFiltros(){
  const estufas = new Set();
  ['colheitas','ciclos','pulverizacao','nutricao','movimentacoes'].forEach(t =>
    (DADOS[t]||[]).forEach(r => { const e = String(r.estufa ?? '').trim(); if(e) estufas.add(e); }));
  const listaE = [...estufas].sort((a,b)=>num(a)-num(b));
  const selE = document.getElementById('fEstufa');
  selE.innerHTML = '<option value="todas">Todas</option>'+listaE.map(e=>'<option value="'+esc(e)+'">Estufa '+esc(e)+'</option>').join('');
  const cults = new Set();
  (DADOS.ciclos||[]).forEach(c => { if(c.cultura) cults.add(String(c.cultura)); });
  (DADOS.vendas||[]).forEach(v => { if(v.cultura) cults.add(String(v.cultura)); });
  const listaC = [...cults].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const selC = document.getElementById('fCultura');
  selC.innerHTML = '<option value="todas">Todas</option>'+listaC.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
}
function aplicarPeríodoNosInputs(){
  document.getElementById('fDe').value = per.ini;
  document.getElementById('fAte').value = per.fim;
}
function marcarPreset(btn){
  document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('ativo'));
  if(btn) btn.classList.add('ativo');
}

document.getElementById('presets').addEventListener('click', e => {
  const b = e.target.closest('button[data-d]'); if(!b) return;
  const d = b.dataset.d;
  presetDias(d === 'mes' ? 'mes' : parseInt(d,10));
  marcarPreset(b);
  aplicarPeríodoNosInputs();
  render();
});
['fDe','fAte'].forEach(id => document.getElementById(id).addEventListener('change', () => {
  const ini = document.getElementById('fDe').value, fim = document.getElementById('fAte').value;
  if(ini && fim && ini <= fim){ per = {ini, fim}; marcarPreset(null); render(); }
}));
document.getElementById('fEstufa').addEventListener('change', e => { estufa = e.target.value; render(); });
document.getElementById('fCultura').addEventListener('change', e => { cultura = e.target.value; render(); });
document.getElementById('cats').addEventListener('click', e => {
  const c = e.target.closest('.cat'); if(!c) return;
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
  cat = c.dataset.c;
  render();
});

(async function init(){
  presetDias(90);
  aplicarPeríodoNosInputs();
  try{
    await carregarDados();
    popularFiltros();
    render();
  }catch(e){
    document.getElementById('conteudo').innerHTML = '<div class="loading">Não consegui carregar os dados. <a href="#" onclick="location.reload();return false">Tentar de novo</a></div>';
  }
})();
</script>
